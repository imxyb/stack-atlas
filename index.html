同 nonce 的多笔候选交易通常最终只有一个能在确定执行链状态下被接受。提交替换交易时，节点常要求新手续费参数满足其提升规则，但具体增幅/限制不是 EVM 共识规范给出的全球统一常数。\n\n生产级 Tx Manager 需要持久化 nonce 分配记录、`signedRawTx`、交易哈希、替换链及业务意图，避免“RPC 超时再重新申请 nonce”导致重复支付。`eth_getTransactionCount(pending)` 只反映目标节点当前视图，不能作为多实例唯一的全局 nonce 分配锁。\n\n**追问：** `eth_sendRawTransaction` 返回了 hash，是否说明交易已上链？不能，只代表对应 RPC 对提交请求给出了交易标识/接收结果；是否广播到网络、纳入区块、执行成功、获得安全或最终确定还需持续跟踪。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E30","title":"如何在不信任 RPC 返回值的前提下，验证一笔账户余额与 Storage 值？","priority":"P0","category":"ethereum","tags":["MPT","Storage","Nonce","Proof"],"answer":"**参考答案：** 先从已独立验证的共识锚点获得对应执行区块头/`stateRoot`，再通过 `eth_getProof` 获得 `accountProof`、`storageProof`；以客户端支持的规范 MPT 证明验证器分别验证 `keccak256(address)` 和 `keccak256(logicalSlot32)` 对应的数据。`accountProof` 输出的账户状态必须由你自行 RLP 解码并核实 nonce/balance/storageRoot/codeHash 等，而不能只读响应对象中客户端声称的 `balance`。\n\n然后用**证明出来的** storageRoot 作为第二层根来验证目标槽位的 proof。若有多个连续 RPC 请求，最好使用确定的区块哈希或已锚定的固定块高、检验其 Hash；否则期间发生 Reorg 可能使证明来自不同分支。\n\n**安全边界：** `eth_getProof` 可以给出账户及存储槽位的证明，但不直接验证任意 ERC-20 `balanceOf` 函数的全部经济逻辑。升级代理需要先推导准确的 Proxy Storage Slot，合约可能把余额映射在另一个账户、使用非标准逻辑或返回经过计算的数字。\n\n**追问：** 怎样证明“不存在这个合约”？需证明该地址在目标区块 State Trie 中不存在/为空账户，而不是只检查一次 `eth_getCode` 返回 `0x`；后者在不同账户状态和新协议行为下并非充分的存在性证明。","diagram":"proof","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E31","title":"全节点与 Archive Node 的差异是什么？区块收据、旧状态和历史事件对节点的要求一样吗？","priority":"P0","category":"ethereum","tags":["Storage","交易处理"],"answer":"**参考答案：** 标准全节点会验证共识/执行并保存运行当前链所需的数据，但对**很久以前每个区块的状态快照**可进行裁剪；Archive 服务则保留或构建可访问的历史状态，适合在任意早期高度调用 `eth_getStorageAt`、`eth_call` 或执行状态证明。具体能力取决于客户端版本、存储模式和保留期限。\n\n历史区块头/交易、执行收据/日志与**历史 State** 是不同数据集合。查询过去的 `eth_getLogs` 不等于必须完整保存所有历史账户状态；但节点的新历史数据裁剪策略也可能限制收据和区块体可访问性，不能只根据 `archive=true/false` 判断所有 API 是否可用。\n\n适合大型索引系统的架构是：执行节点/历史数据提供者负责链原始数据，索引层负责把日志和交易语义转化为关系型检索表，并持久化 `blockHash`、版本和回滚信息。对于长期证明和审计，应明确原始见证数据及头部归档的保留策略。\n\n**追问：** 节点能返回任意历史区块的 `eth_getBlockByNumber`，是否意味着能对该区块做 `eth_call`？不能，历史区块本身不等于完整的历史状态数据库。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E32","title":"EIP-4844 Blob 和 Calldata 区别是什么？Blob 为什么不能用 `SLOAD` 读取？","priority":"P1","category":"ethereum","tags":["Storage","Gas","EIP","交易处理"],"answer":"**参考答案：** Calldata 作为交易执行输入可被 EVM 读取，传统 Rollup 将批量数据放在 calldata 中供 L1 发布。EIP-4844 引入承载大量数据的 Blob Transaction 与**独立的 Blob Gas 市场**，Blob 数据通过共识层网络提供一定期限的数据可用性承诺，不进入执行层普通永久 Storage，也不按普通 calldata 的方式供 EVM 完整读取。\n\n执行层可见 Blob 的 versioned hash 等相关信息，EVM 可用特定 opcode 取得对应承诺标识；Blob 数据本身不是可以随意遍历的 Solidity `bytes` 参数。Blob 原始数据按协议设置的保留时窗被节点维护，而不是由链长期免费存档，因此审计/数据恢复服务若需要多年数据必须另做归档。\n\nBlob 的 KZG 承诺服务于数据承诺与证明体系，它和执行层 MPT 的 `transactionsRoot` / `stateRoot` 是不同密码学数据路径。即使 Blob 提升 DA 成本效率，也不自动意味着某笔 L2 交易已经 L1 finalized 或可以安全提现。\n\n**追问：** 为什么 Rollup 有了 Blob 仍需要证明/挑战或结算机制？DA 解决的是“可获得计算所需的数据”，不是“执行一定正确或状态已经最终确定”。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E33","title":"Rollup 的 State Root 和以太坊 L1 `stateRoot` 有什么关系？跨链桥究竟在验证什么？","priority":"P0","category":"ethereum","tags":[],"answer":"**参考答案：** 以太坊 L1 的 `stateRoot` 承诺 L1 执行状态；Rollup 通常维护自己的 L2 状态与执行承诺，发布到 L1 的可能是批次信息、输出根或状态承诺及相关证明对象。**L2 Root 不是 L1 区块头 `stateRoot` 的同义词**。只有当 L1 智能合约按 Rollup 协议记录或验证相应对象时，才形成特定的桥接信任路径。\n\nOptimistic Rollup 可能依赖挑战期/欺诈证明使断言最终成为可结算状态；ZK Rollup 依赖有效性证明在 L1 验证，之后仍受 L1 的确认与最终性约束。具体协议中 sequencer 的软确认、数据发布、L1 合约状态、证明/挑战与取款可用性都是不同状态。\n\n跨链桥后端不能只凭 `sourceTxHash`、`L2 Transfer` 事件就直接铸造目标链资产；应按协议要求验证源链共识最终性、跨链消息承诺与可消费状态、唯一 message nonce、目标合约回放保护，并持续对账 escrow 和 wrapped asset supply。\n\n**追问：** L2 一个区块已经 `finalized`（按 RPC 自己的标签），就等于可从 L1 官方桥立刻提款？未必；必须检查目标 Rollup 对 RPC 标签、L1 发布、证明窗口/有效性证明和桥合约消费条件的定义。","diagram":"l2","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E34","title":"为什么以太坊长期研究 Verkle Tree、Stateless Client？和传统 MPT 的问题是什么？","priority":"P1","category":"ethereum","tags":["MPT","交易处理"],"answer":"**参考答案：** 传统 MPT 的主要压力包括全局状态体积持续增长、节点维护状态的磁盘 IO 和存储负担，以及为一个区块涉及的众多账户与槽位构造状态见证数据时的体积。Verkle Tree 使用向量承诺思路，希望实现更小的状态证明/见证并改善 Stateless Validation 的可行性。\n\n**Stateless Client** 的核心不是“不要验证交易”，而是让执行验证者不必持有整个世界状态数据库，只用可信的前状态承诺、该块所需状态见证及交易执行规则就能验证转换。仍需要某些参与者提供数据、建立状态的可访问性与更新能力，不能误认为所有人都能无需历史数据立即重建任何状态。\n\n这是技术路线与协议演进方向，**不应未经确认就宣称截至面试时主网已经全面切换到 Verkle**。版本正确的高级回答应先解释今天所讨论的 MPT 如何工作，再说明可能的迁移路径会影响证明格式、客户端状态存储与后端工具兼容性。\n\n**追问：** 如果未来状态承诺从 MPT 换成别的结构，`eth_getProof` 等后端逻辑会受影响吗？证明字节格式、验证器、账户/Storage 语义与客户端 API 可能需要适配；应把证明格式和共识锚定封装成可升级组件。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E35","title":"为什么生产 RPC 查询优先固定 `blockHash`，而不是多个请求都传相同 `blockNumber`？","priority":"P0","category":"ethereum","tags":["Storage","Reorg","Proof","EIP"],"answer":"**参考答案：** `blockNumber` 定位的是**一个高度**，在 Reorg 前后相同高度可能对应不同哈希；不同 RPC Provider 甚至在同一时刻可拥有不同的规范链视图。把多次 `eth_call`、`eth_getProof`、Storage 查询的区块参数都写为一个高度，并不能证明它们实际绑定同一个执行状态。\n\nEIP-1898 为一些带区块参数的方法提供 `{ \"blockHash\": \"0x...\", \"requireCanonical\": true }` 等按哈希固定查询方式（具体 Provider 支持度须确认）。如果接口不支持，业务层应至少通过区块哈希与父哈希连续性校验把读操作绑定到指定分支，并在重组时重新执行。\n\n这种做法在多 RPC 容灾时格外重要：Provider A 的 100 高度头是 A，Provider B 的 100 高度头是 B，两者数据即使都自洽，也不能混合组成一份账户/收据证明，更不能把索引或对账视作一个原子快照。\n\n**追问：** `requireCanonical=true` 能否替代等待 Finality？不能。它只要求请求指定的块在**当前应答节点看来**属于规范链，未来仍可能变更；Finality 是另一个层面的共识安全条件。","diagram":"proof","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E36","title":"设计一个能回答“某 ERC-20 余额在 finalized 高度是否真实存在”的独立验证服务。","priority":"P0","category":"ethereum","tags":["Storage","Finality"],"answer":"**参考答案：** 先区分要证明的目标：是 EVM 某个**逻辑 Storage Slot**上的原始值，还是任意 token 的 `balanceOf(user)` 调用返回值？后者不总是直接等于单个 Storage Slot，尤其可能有代理、rebasing、份额换算、外部合约映射和自定义逻辑。\n\n如果目标合约的布局可知、余额映射确实直接存储，可以建立如下流程：\n\n1. 从独立验证的 PoS 共识客户端或可信最新 Finality 锚点拿到 finalized 执行块哈希和 `stateRoot`；记录 chainId、fork 版本和该块 hash。\n2. 校验合约目标地址、代理实现版本与对应布局，推导所需 Slot（包括嵌套 mapping 和存储 namespace），必要时确认该高度的实现代码。\n3. 对固定区块调用 `eth_getProof`，拿到账户证明与目标 Storage Proof；用本地可信证明验证器校验账户节点和 Slot 值，并自行按 storage layout 解码。\n4. 将证明结果与业务定义对齐，得出“在 finalized 区块 B 的合约 C 的槽位 S 的值 V”这一**精确结论**，而非笼统地说“永远拥有 X 资产”。\n5. 保存验证链、Proof、根、区块、RPC 来源与程序版本，支持以后复核；如果合约余额为动态计算结果，必须改用可信状态执行证明或更明确的协议信任模型。\n\n**追问：** 这个服务还可以用于“某笔 ERC-20 充值最终到账”吗？需要在证明链上新增目标交易 Receipt Proof、`Transfer` 日志语义校验和链上经济行为审查，单独证明余额槽位不等于证明充值交易来源合法。\n\n---","diagram":"proof","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"A01","title":"作为高级工程师，如何使用 Vibe Coding 而不牺牲可靠性？","priority":"P0","category":"ai","tags":["一致性"],"answer":"**参考答案：** 把 LLM 定位为快速生成候选方案、模板代码、测试用例和审查视角，而不是正确性来源。一个可重复流程是：先写清楚接口契约、数据模型、幂等/一致性不变式、性能预算与失败模型 → 让模型给实现草案/反例 → 自己审查并写自动化验证 → 小流量上线、可观测和回滚。对于资金链路、智能合约升级和签名服务，应以明确的不变式、测试和双人复核为上线门槛。\n\n面试能加分的是展示**利用 AI 缩短反馈循环**，而不是用“AI 帮我写得很快”代替架构和故障理解。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"A02","title":"AI 生成的并发代码最需要重点审查什么？","priority":"P0","category":"ai","tags":[],"answer":"**参考答案：** 明确任务生命周期、谁关闭 channel、cancel 是否传播、并发是否有上限、共享 map/slice 是否竞态、错误能否正确回传、下游资源是否被池上限保护。使用 `-race`、fuzz、压力测试、超时注入和 goroutine profile 检查；不要认为 `go test` 一次通过证明不存在竞态。\n\n要求模型构造反例：“如果发送成功但 ACK 丢失怎么办？如果 context 已取消但 select 仍发送怎么办？如果服务重启后有未确认消息怎么办？” 这比只要求“把代码写得更优雅”有价值。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"A03","title":"AI 生成的 Solidity 代码应该怎样验收？","priority":"P1","category":"ai","tags":["Storage","Nonce","Gas","锁与并发"],"answer":"**参考答案：** 不让模型自由引入不明来源的库或升级代理模板；锁定 compiler、依赖版本和网络 fork；列出资产守恒、权限、签名 nonce、可升级 storage 兼容、外部 call、重入、价格来源、gas 边界等安全不变式。使用 Foundry fuzz/invariant、静态分析、fork 测试、差分测试和代码审计，并验证部署字节码与 source 一致。\n\n特别小心“看起来和 OpenZeppelin 很像”的修改版库、未经授权的权限捷径、过时的安全建议，以及把 `tx.origin`/`block.timestamp` 当安全判断的答案。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"A04","title":"如何防止把生产密钥和公司代码泄露给 AI 工具？","priority":"P1","category":"ai","tags":[],"answer":"**参考答案：** 制定允许送入模型的数据分级：生产私钥、助记词、数据库凭据、客户敏感数据、未公开协议细节和真实 API token 不应粘贴进不受控会话。使用脱敏样例、最小上下文、经过企业审核的模型配置与日志保留策略，并对新增依赖做许可证与供应链扫描。\n\nAI 提议的 shell 命令、迁移脚本和 Solidity 部署操作要在沙盒/模拟环境验证，不能直接以高权限执行。模型输出是需要评审的不可信输入。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"A05","title":"如何衡量 Vibe Coding 的真实收益，而不是靠“生成了多少行代码”？","priority":"P1","category":"ai","tags":["安全"],"answer":"**参考答案：** 看从需求到生产的交付周期、PR 返工率、逃逸缺陷数、变更失败率、平均恢复时间、测试覆盖关键不变式的程度和代码可维护性。AI 让草案快 5 倍，但若审查/线上事故增加，整体工程效率未必更高。\n\n可比较同类任务的前后周期，区分样板代码、测试生成、重构与核心安全逻辑，建立 AI 辅助代码专门的失败案例复盘机制。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"C01","title":"设计一个 10 万 QPS 的商品秒杀 / 抢购系统。","priority":"P0","category":"design","tags":["缓存"],"answer":"**参考答案：** 先澄清库存与下单规模：10 万 QPS 查询不等于 10 万 TPS 付款。典型架构：CDN/边缘限流 → 网关鉴权/验证码/人机识别 → 预热商品和限购信息 → 按商品/用户分流 → 入口 Redis/内存配额快速拒绝 → 有界消息队列 → MySQL 订单与库存最终落账 → 结果异步通知。\n\n关键不变式：`已售 + 有效预占 <= 总库存`，`同用户同活动 <= 限购额度`；不能仅依赖 Redis 预扣，因为缓存切主可能回退。可把总库存提前分配为各分区不可重叠的配额，最终由 MySQL 条件更新/唯一约束/幂等记录作权威。失败退款/释放预占必须能重试且不造成过释放。\n\n**容量与故障：** 10 万 QPS × 2ms CPU ≈ 200 理论核；热点单 SKU 必须承认无法横向拆出无限强一致吞吐。排队容量、超售率、下单 P99、支付失败、重试放大、库存对账和拒绝率都要监控。限流失败时宁可明确返回繁忙，而不是无界接受请求。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"C02","title":"设计一个支持 50 条 EVM 链的充值监听与入账平台。","priority":"P0","category":"design","tags":["Reorg","Kafka","事务","RPC"],"answer":"**参考答案：** 以链为调度与故障隔离单位，维护 `chain_config`（RPC 池、确认策略、from/to height、ABI registry、token allowlist）。每链有逻辑上唯一的 scanner lease/fencing，按高度批量拉区块和日志，验证父 hash/哈希连续性，遇 reorg 找共同祖先并产生冲正任务；将 raw log、解析事件、cursor 与 outbox 在可恢复的事务链路里持久化。\n\n事件进入 Kafka 以 `chainId+depositAddress` 等可保证需要顺序的 key 分区，独立消费者负责用户地址映射、合约白名单、资产精度、风控与最终确认。以业务 `deposit_event_id` 唯一约束避免重复入账。普通 WS 用于实时提示，HTTP backfill 保证不漏；不同链最终性和 RPC 能力通过适配器实现。\n\n**追问：** 出现 RPC 分叉、同一 tx 在 reorg 中位置变化、历史节点不完整、重扫 1 亿日志、ABI 升级、假 token 合约和大额充值未 finalized 时如何处理？应分别给出暂停/重扫/冲正/兜底方案。","diagram":"reorg","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"C03","title":"设计一个每分钟处理 10 万提现请求的 Web3 提现系统。","priority":"P0","category":"design","tags":["Nonce","Gas","Kafka","交易处理"],"answer":"**参考答案：** 高请求量不等于同速链上出块能力。可把提现拆为用户意图、余额冻结、审核/合规、链上交易打包、确认、账务结算五个阶段。API 用 `request_id` 幂等，DB 事务冻结资金；Kafka/队列按热钱包地址和网络分区，单地址 nonce 分配由强持久存储控制；广播器保存签名原文、tx hash、nonce 和替换历史。\n\n吞吐取决于链 gas/交易容量与账户 nonce 顺序；可通过多热钱包、合约批量转账（安全校验、gas、失败处理）、合理打包费用优化，但会增加余额调拨、手续费预估与运营复杂度。签名通过 HSM/MPC 服务和权限隔离，设置双人审批、大额延迟、单地址与全平台限额。\n\n**关键故障：** RPC 超时→先查 nonce/hash/receipt，不能换新 nonce 重发相同业务；EVM revert→分析是否允许重试或退回冻结；链 reorg→回退临时完成状态；签名服务失效→停止放款并保留可恢复队列，不允许绕开审批流程。","diagram":"tx","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"C04","title":"设计一条“订单支付成功后，扣库存并发券”的可靠事件流水线。","priority":"P0","category":"design","tags":["Kafka","交易处理","事务"],"answer":"**参考答案：** 支付成功源头以交易状态机和支付渠道幂等回调为权威；同一 DB 事务写订单 `PAID`、支付流水和 outbox。CDC 把事件送 Kafka，库存服务使用 `payment_event_id` 唯一键处理，条件扣减后发布库存事件；券服务使用独立幂等键发放。发生库存不足不能“悄悄失败”，需要触发退款/人工处理/库存补偿 Saga。\n\n消费者采用“业务效果与 inbox 幂等记录同事务提交，之后提交 Kafka offset”，支持崩溃重放。对账任务发现订单 `PAID` 但库存未扣、券未发的长时间中间态，主动补偿和告警。不要承诺一个 Kafka transaction 能把 MySQL、外部支付、券 API 全部原子化。","diagram":"kafka","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"C05","title":"某服务 P99 从 100ms 飙升到 3s，CPU 只有 20%，怎么定位？","priority":"P0","category":"design","tags":["Kafka","GC","锁与并发","事务"],"answer":"**参考答案：** 按请求旅程拆解：入口排队 → goroutine/线程调度 → 数据库连接池等待 → 锁等待/事务冲突 → RPC provider 延迟 → Kafka 同步依赖 → 网络丢包重传 → GC/磁盘。CPU 低往往说明请求在**等待**，并非机器余量充足。结合 tracing、`database/sql.DBStats`、`pprof` block/mutex/goroutine、MySQL performance_schema、RPC latency histogram、网络指标找主因。\n\n**常见根因与验证：** 少量慢 SQL 占满连接池引起级联等待；下游只有少数副本/热 key；K8s CPU throttling 未体现在平均 CPU；锁争用使大量 goroutine 排队；依赖故障时重试雪崩。临时止血可限流/熔断/回滚部署，永久修复需要消除瓶颈而非盲目扩容。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"C06","title":"实现一个不会因 RPC 超时而重复转账的链上 Tx Manager。","priority":"P1","category":"design","tags":["Nonce","安全","链上","RPC"],"answer":"**参考答案：** 状态机建议：`CREATED -> NONCE_ASSIGNED -> SIGNED -> BROADCAST_UNKNOWN/BROADCASTED -> INCLUDED -> SAFE/FINALIZED`，旁路 `REPLACED/REVERTED/DROPPED/MANUAL_REVIEW`；各状态变化有版本号 CAS 和持久化事件日志。发送前必须持久化已签名 raw tx 与业务 request_id 的映射；RPC 超时后重播**同一 raw tx**通常是安全的（同一 hash），不能直接重新分配 nonce。\n\n对同一 nonce 价格替换需记录旧新 tx hashes 和是否属于同一业务意图；交易执行成功与资产实际变化可能还需要解析 receipt/log 与最终链状态。不可靠 mempool 不作为资金状态权威；跨 Provider 查询与 finalized view 决定何时终结。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"C07","title":"设计一个跨地域高可用的 Redis + MySQL + Kafka 业务平台。","priority":"P1","category":"design","tags":["Kafka","安全","缓存"],"answer":"**参考答案：** 先按数据类型拆：缓存（可丢/重建）、事件日志（可重放）、账务数据库（不可丢且需强序）。读流量区域就近处理，写流量按租户/账户归属到单主 region 或使用能承担跨区共识延迟的强一致数据库；缓存使用地区独立副本和版本失效；事件通过 Outbox/CDC 异步跨区镜像，并明确复制落后和灾难切换的 RPO。\n\n常见错误是异步主从切换后旧主恢复双写；必须有全局 epoch/fencing、明确变更写归属、切换前后的账务对账，以及不能自动安全切换时的只读/暂停预案。真正多活不是“各区都能写同一行”这么简单。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"C08","title":"设计一个安全可升级的资金 Vault 合约及其 Go 后端。","priority":"P1","category":"design","tags":["Storage","Reorg","交易处理","安全"],"answer":"**参考答案：** 合约层：记录用户份额/可领取余额并建立 `totalAssets >= totalLiabilities` 等可验证不变式，外部转账遵循 CEI，保护回调重入，使用角色分离、暂停、Timelock、多签升级、Storage layout 校验；资产兼容性采用有限 token allowlist，不默认信任非标准代币。\n\n后端：所有合约参数/ABI 版本与部署交易记录可审计，写请求先模拟再签名/广播；事件索引器支持 reorg、cursor 和幂等；内部账本按最终性确认并定期核对链上 Vault 余额及份额。升级演练使用 fork 环境跑状态迁移前后不变式测试，并模拟无法升级、暂停误触发、恶意代币回调、RPC 故障等异常。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"}];
</script>
  <script>/* Stack Atlas visualization library. Zero runtime dependencies, editable inline SVG diagrams. */

'use strict';
const META={

function evmSim(n){let st=[],storage={};const ops=[['PUSH1 0x02',()=>st.push(2)],['PUSH1 0x03',()=>st.push(3)],['ADD',()=>{const a=st.pop(),b=st.pop();st.push(a+b);}],['PUSH1 0x00',()=>st.push(0)],['SSTORE',()=>{const slot=st.pop();const value=st.pop();storage[slot]=value;}]];for(let i=0;i<Math.min(n,ops.length);i++)ops[i][1]();return{st,storage,ops};}

 const opHTML=r.ops.map(([text],i)=>`<div class="code-chip" style="${i<n?'border-color:#bce879;color:#bce879;':''}${i===n?'background:#294030;':''}">${i<n?'✓ ':i===n?'▶ ':''}${text}</div>`).join('');
 return{visual:`<div class="diagram-slide"><div class="diagram-data-row">${opHTML}</div><div class="diagram-flow" style="margin-top:22px"><div class="flow-box" style="width:145px"><div class="flow-name">Stack</div><div class="flow-desc" style="font-size:15px;color:#c0ed7a">[ ${r.st.join(', ')||'∅'} ]</div></div><div class="flow-box" style="width:145px"><div class="flow-name">Memory</div><div class="flow-desc">调用帧内临时</div></div><div class="flow-box ${n===5?'highlight':''}" style="width:145px"><div class="flow-name">Storage</div><div class="flow-desc" style="font-size:13px">${r.storage[0]!==undefined?'slot 0 → '+r.storage[0]:'slot 0 → ∅'}</div></div></div><div class="floating-tip">执行进度 ${n} / 5 · ${n===0?'点击下一条指令观察堆栈变化':n===5?'SSTORE 将 5 写入逻辑 Storage Slot 0':'每次操作消费栈顶参数，并可能将结果重新压栈'}</div></div>`,controls:`<div class="diagram-controls"><button class="dctl" data-action="diagram" data-type="evm" data-value="0">↺ 重置</button><button class="dctl active" data-action="diagram" data-type="evm" data-value="${Math.min(n+1,5)}" ${n===5?'disabled':''}>下一条指令 →</button></div>`,desc:'仅示意操作数和存储效果；真实 EVM 的 Gas、暖/冷存储访问与执行回滚语义更复杂。'};

 if(!terms.length)return true;const hay=(q.id+' '+q.title+' '+q.answer+' '+q.category+' '+(q.tags||[]).join(' ')).toLowerCase();return terms.every(t=>hay.includes(t));

function splitAnswer(raw){let answer=String(raw||'').replace(/^\*\*参考答案[：:]\*\*\s*/,'').trim();const re=/\*\*(?:追问|面试高频追问|面试加分追问)[：:]\*\*/;const m=re.exec(answer);if(!m)return{main:answer,follow:''};return{main:answer.slice(0,m.index).trim(),follow:answer.slice(m.index).replace(re,'').trim()};}
function inlineMd(text){let safe=escapeHTML(text);const code=[];safe=safe.replace(/`([^`]+)`/g,(_,x)=>{const tok='@@C'+code.length+'@@';code.push(`<code>${x}</code>`);return tok});
 safe=safe.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
 safe=safe.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
 return safe.replace(/@@C(\d+)@@/g,(_,i)=>code[Number(i)]||'');}
function markdownToHTML(markdown){const lines=String(markdown||'').replace(/\r/g,'').split('\n');let html='',i=0,list='';
 const endList=()=>{if(list){html+=`</${list}>`;list='';}};
 const special=s=>/^\s*$/.test(s)||/^```/.test(s)||/^#{1,4} /.test(s)||/^(?:[-*] |\d+\. |>|---\s*$)/.test(s)|| /^\|.*\|$/.test(s);
 while(i<lines.length){let line=lines[i];if(!line.trim()){endList();i++;continue;}
 const code=line.match(/^```([a-zA-Z0-9_-]*)/);if(code){endList();const lang=code[1];i++;const codeLines=[];while(i<lines.length&&!/^```/.test(lines[i]))codeLines.push(lines[i++]);if(i<lines.length)i++;html+=`<pre><code class="language-${escapeHTML(lang)}">${escapeHTML(codeLines.join('\n'))}</code></pre>`;continue;}
 const heading=line.match(/^(#{1,4})\s+(.+)/);if(heading){endList();html+=`<h${Math.min(heading[1].length+1,4)}>${inlineMd(heading[2])}</h${Math.min(heading[1].length+1,4)}>`;i++;continue;}
 if(/^---+$/.test(line.trim())){endList();html+='<hr>';i++;continue;}
 if(/^\|.*\|$/.test(line)&&i+1<lines.length&&/^\|?\s*:?-{2,}/.test(lines[i+1])){endList();const header=line.replace(/^\||\|$/g,'').split('|');i+=2;const rows=[];while(i<lines.length&&/^\|.*\|$/.test(lines[i]))rows.push(lines[i++].replace(/^\||\|$/g,'').split('|'));html+='<table><thead><tr>'+header.map(x=>`<th>${inlineMd(x.trim())}</th>`).join('')+'</tr></thead><tbody>'+rows.map(cols=>'<tr>'+cols.map(x=>`<td>${inlineMd(x.trim())}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue;}
 const bullet=line.match(/^\s*[-*]\s+(.+)/),order=line.match(/^\s*\d+\.\s+(.+)/);if(bullet||order){const ty=bullet?'ul':'ol';if(list!==ty){endList();html+=`<${ty}>`;list=ty;}html+=`<li>${inlineMd((bullet||order)[1])}</li>`;i++;continue;}else endList();
 if(line.startsWith('>')){const chunk=[];while(i<lines.length&&lines[i].startsWith('>'))chunk.push(lines[i++].replace(/^>\s?/,''));html+=`<blockquote>${inlineMd(chunk.join(' '))}</blockquote>`;continue;}
 const chunk=[line.trim()];i++;while(i<lines.length&&!special(lines[i]))chunk.push(lines[i++].trim());html+=`<p>${inlineMd(chunk.join(' '))}</p>`;
 }
 endList();return html||'<p>暂无答案，可点击编辑添加内容。</p>';
}

async function adminToken(){if(state.mode!=='server')return'';if(state.token)return state.token;const token=window.prompt('服务端题库受到管理员 Token 保护，请输入 ADMIN_TOKEN：');if(!token)throw Error('未提供管理员 Token，操作取消');state.token=token;saveSession('atlas-token',token);return token;}
async function apiWrite(method,path,data){let token=await adminToken();let response=await fetch(path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:data===undefined?undefined:JSON.stringify(data)});if(response.status===401||response.status===403){state.token='';dropSession('atlas-token');throw Error('管理员 Token 无效或服务端只读');}if(!response.ok){let text=await response.text();throw Error('服务端保存失败：'+text.slice(0,140))}return response.status===204?null:response.json();}

function validateImported(item){const id=String(item.id||'').trim().toUpperCase();if(!/^[A-Z][A-Z0-9_-]{1,18}$/.test(id))return null;const title=String(item.title||'').trim(),answer=String(item.answer||'').trim();if(!title||!answer)return null;return{id,title,answer,category:CAT.some(c=>c.id===item.category)?item.category:'design',priority:['P0','P1','P2'].includes(item.priority)?item.priority:'P1',diagram:DIAG.meta[item.diagram]?item.diagram:'',tags:Array.isArray(item.tags)?item.tags.filter(x=>typeof x==='string').slice(0,6):[],source:String(item.source||'导入'),createdAt:item.createdAt||new Date().toISOString().slice(0,10),updatedAt:new Date().toISOString().slice(0,10)};}
function mdImport(text){const pattern=/^### ([A-Z][0-9]{2,5})【(P[012])】(.+)$/gm;const m=[...text.matchAll(pattern)];return m.map((a,i)=>{let body=text.slice(a.index+a[0].length,i<m.length-1?m[i+1].index:text.length).trim();const nextParent=body.search(/^#{1,2} /m);if(nextParent>=0)body=body.slice(0,nextParent).trim();return validateImported({id:a[1],priority:a[2],title:a[3],answer:body,category:guessCategory(a[1])})}).filter(Boolean)}

 case 'start':state.savedOnly=false;state.category='all';go('library',{selected:'E01'});break;
 case 'select':selectQ(id);break;
 case 'open-diagram':{const d=DIAG.meta[a.dataset.type];if(!d)return;state.savedOnly=false;state.category='all';state.search='';state.priority='all';selectQ(d.featured);break;}
 case 'quicksearch':state.savedOnly=false;state.category='all';state.priority='all';go('library',{focusSearch:true});break;
 case 'toggle-theme':state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;safeStore(THEMEKEY,state.theme);render();break;
 case 'mobile':state.mobileNav=!state.mobileNav;render();break;
 case 'closemobile':state.mobileNav=false;render();break;
 case 'bookmark':if(state.bookmarks.has(id))state.bookmarks.delete(id);else state.bookmarks.add(id);savePersonal();refreshLibrary();toast(state.bookmarks.has(id)?'已添加到收藏':'已取消收藏');break;
 case 'progress':state.progress[id]=state.progress[id]===a.dataset.status?'new':a.dataset.status;savePersonal();refreshLibrary();toast('复习状态已更新');break;
 case 'new':openEditor();break;
 case 'edit':openEditor(id);break;
 case 'delete':deleteQuestion(id);break;
 case 'closemodal':closeModal();break;
 case 'modal-backdrop':if(e.target===a)closeModal();break;
 case 'manager':go('manage');break;
 case 'export':exportJSON();break;
 case 'export-md':exportMarkdown();break;
 case 'import':{let x=document.getElementById('import-file');if(!x){go('manage');x=document.getElementById('import-file');}x?.click();break;}
 case 'reset':reset();break;
 case 'share':{let link=location.href.split('#')[0]+'#q='+id;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>toast('题目链接已复制')).catch(()=>{toast('复制失败，请手动复制地址栏链接')})}else{window.prompt('复制以下题目链接：',link)}break;}
 case 'diagram':updateDiagram(a.dataset.type,a.dataset.value);break;
 }}
function refreshLibrary(){if(state.view==='library'){const panel=document.getElementById('view-container');panel.innerHTML=renderLibrary();const el=document.querySelector(`.question-item.active`);el?.scrollIntoView({block:'nearest'});}else render();}
function handleInput(e){if(e.target.id==='question-search'){const input=e.target;let at=input.selectionStart;state.search=input.value;refreshLibrary();let el=document.getElementById('question-search');el?.focus();try{el?.setSelectionRange(at,at)}catch{}return;}
 if(e.target.id==='study-note'){const id=e.target.dataset.qid;state.notes[id]=e.target.value;safeStore(NOTEKEY,state.notes);return;}
 if(e.target.matches('[data-dinput]')){const key=e.target.dataset.dinput;const num=Number(e.target.value);if(!(key in state.diagramStates.gas))return;state.diagramStates.gas[key]=num;const g=state.diagramStates.gas,eff=Math.min(g.tip,Math.max(0,g.max-g.base)),valid=g.base<=g.max;const put=(selector,value)=>{const el=document.querySelector(selector);if(el)el.textContent=value};put(`[data-dnum="${key}"]`,num);put('#gas-base-label',g.base);put('#gas-tip-label',eff);put('#gas-price-label',valid?g.base+eff:'—');const b=document.getElementById('gas-base-bar'),t=document.getElementById('gas-tip-bar');if(b)b.style.width=(valid?g.base/60*100:0)+'%';if(t)t.style.width=(valid?eff/60*100:0)+'%';put('[data-diagram-desc]',valid?'单价 = baseFee + min(priority, maxFee − baseFee)。未用满的 maxFee 不会按上限全额支付。':'当前 maxFee 小于 baseFee，交易在此 baseFee 下不满足纳入区块的费用条件。');}
}
async function handleSubmit(e){if(e.target.id!=='question-form')return;e.preventDefault();const f=new FormData(e.target);const id=String(f.get('id')||'').trim().toUpperCase(),title=String(f.get('title')||'').trim(),answer=String(f.get('answer')||'').trim();if(!/^[A-Z][A-Z0-9_-]{1,18}$/.test(id)){toast('题号必须以字母开头，只能包含字母、数字、下划线或短横线');return}const old=state.questions.find(x=>x.id===id);const edit=!!old;const rec=validateImported({id,title,answer,category:f.get('category'),priority:f.get('priority'),diagram:f.get('diagram'),tags:old?.tags||[],source:old?.source||'自定义',createdAt:old?.createdAt});if(!rec){toast('请完整填写题号、题目和参考答案');return}await saveQuestion(rec,edit);}
function handleKeydown(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.savedOnly=false;state.category='all';state.priority='all';go('library',{focusSearch:true});return}if(e.key==='Escape'){closeModal();if(state.mobileNav){state.mobileNav=false;render();}return}if(document.getElementById('modal-root')?.innerHTML)return;
if(state.view==='library'&&e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('question-search')?.focus()}}
document.addEventListener('click',handleClick);document.addEventListener('input',handleInput);document.addEventListener('submit',handleSubmit);document.addEventListener('change',e=>{if(e.target.id==='import-file'){importFile(e.target.files?.[0]);e.target.value='';}});document.addEventListener('keydown',handleKeydown);
render();detectServer();
window.STACK_ATLAS_DEBUG={state,go,markdownToHTML,getFiltered};
})();
</script>
