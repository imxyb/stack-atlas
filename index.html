警系统的目标不只是打一个风险分，而是为每条高风险提示建立**可复核的证据链与处置流程**。\n\n### 分层架构\n\n```text\n多链区块 / 交易 / Logs / Trace / Instruction\n    ↓\n标准化行为（Transfer / Swap / Bridge 等）\n    ↓\n地址标签与实体关系（制裁 / 诈骗 / CEX / Mixer）\n    ↓\n实时规则与离线风控模型\n    ↓\n风险评分、归因与路径证据\n    ↓\nAlert / Case / 人工复核\n```\n\n### 典型风险规则\n\n- 直接与已标记高风险地址交互，或短时间内发生多跳资金拆分/归集。\n- 可疑资金通过跨链桥或混币器转移，并与交易所地址发生交易。\n- 新地址在短时大额收款后马上跨链；同一实体多个地址密集转账。\n\n### 每条告警至少需要哪些信息\n\n| 类型 | 字段 |\n|---|---|\n| 风险识别 | `risk_type`、`risk_score`、`rule_id`、`rule_version` |\n| 资金事实 | `asset`、`amount`、`time`、`evidence_tx_hashes` |\n| 归因路径 | `source_risk_address`、`source_entity`、`path`、`distance` |\n| 置信与处置 | `confidence`、`case_status`、审查记录 |\n\n### 高级追问 / 工程边界\n\n区分 `pending / confirmed / retracted` 状态，发生 Reorg 时撤销旧分支告警。风险标签有概率和时间属性，系统应能回答“风险来自哪里、经过几跳、涉及多少金额、证据是否可靠”，而不是直接认定地址违法。","source":"用户第三份资料 · 多链数据 / KYT · 原题 26","createdAt":"2026-10-28","updatedAt":"2026-10-29"},{"id":"D26","title":"如何实现高性能链上地址详情页 API 与增量画像？","category":"analytics","priority":"P1","tags":["链上数据","数据建模","源 JD-27"],"diagram":"","answer":"### 核心回答\n\n**地址详情页通常需要：**\n\n**要点：** 地址基础信息；资产余额；交易列表；资金流入流出；协议交互；风险标签；实体标签；关联地址；历史净值；行为画像。\n\n#### API 设计\n\n- GET /address/{chain}/{address}/profile。 GET /address/{chain}/{address}/balances。\n- GET /address/{chain}/{address}/transactions。 GET /address/{chain}/{address}/risk。\n- GET /address/{chain}/{address}/flows。 GET /address/{chain}/{address}/counterparties。\n\n#### 数据来源\n\n**要点：** profile 表；balance snapshot 表；transfer 明细表；protocol action 表；risk label 表。\n\n**涉及的字段 / 组件：** `entity graph`、`price service`。\n\n#### 性能优化\n\n**要点：** 地址 profile 预聚合；余额快照定时计算；交易列表走 OLAP 明细表；高频地址缓存；大地址分页；counterparty 排名预计算；风险路径异步计算；大图查询限制跳数和金额阈值。\n\n#### 注意\n\n地址详情页不能每次请求都从原始 logs 现场算，否则高频地址和巨鲸地址会非常慢。\n\n### 高级追问 / 工程边界\n\n地址 Profile、余额快照、明细、实体标签和图关联分层查询，按 chain/address/asset/time 建索引；热地址用预聚合、游标分页与异步路径计算，并标注 as-of 与最终性。","source":"用户第三份资料 · 多链数据 / KYT · 原题 27","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"D27","title":"如何设计 Dune/Nansen 类多链分析和查询平台？","category":"analytics","priority":"P1","tags":["链上数据","数据建模","源 JD-28"],"diagram":"","answer":"### 核心回答\n\n### 从原始链数据到查询产品\n\n```text\nRaw Chain Data\n   ↓\nDecoded Data\n   ↓\nCurated Tables\n   ↓\nSQL Query Engine\n   ↓\nDashboard / Alert / API\n```\n\n#### 底层设计\n\n```text\nRaw Chain Data\n    ↓\nDecoded Data\n    ↓\nCurated Tables\n    ↓\nSQL Query Engine\n    ↓\nDashboard / Alert / API\n```\n\n#### 核心表\n\n**涉及的字段 / 组件：** `blocks`、`transactions`、`logs`、`traces`、`token_transfers`、`nft_transfers`、`dex_swaps`、`bridge_events`、`labels`、`entities`、`balances`、`prices`。\n\n#### 难点\n\n**要点：** ABI 自动解码；合约地址识别；协议数据模型抽象；用户自定义 SQL 的资源隔离；查询成本控制；大表分区和排序键设计；热门 dashboard 缓存；数据延迟标识；多链统一 schema。\n\n#### 例如 token_transfers 表可以按\n\n**涉及的字段 / 组件：** `chain_id`、`block_date`、`token_address`、`from_address`、`to_address`、`tx_hash`。\n\n分区和排序。\n\n### 高级追问 / 工程边界\n\n开放 SQL 要限制扫描量、并发、执行时长和租户配额；画像还需要实体标签服务和物化视图。更新 ABI 或标签后保留数据血缘和历史重算能力。","source":"用户第三份资料 · 多链数据 / KYT · 原题 28","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"D28","title":"如何用 SQL 计算一个地址 30 天稳定币净流入？","category":"analytics","priority":"P1","tags":["链上数据","数据建模","源 JD-29"],"diagram":"","answer":"**参考答案：** 先定义“30 天稳定币净流入”的准确口径：以某条链、某个地址为主体，统计规范链上的成功 Token Transfer，并将不同稳定币按交易时刻的历史价格换算为美元，而非简单把 USDT/USDC/DAI 单位数相加。\n\n### 数据模型（数仓层）\n\n`token_transfers` 至少包含 `chain_id`、`block_time`、`block_hash`、`tx_hash`、`log_index`、`token_address`、`from_address`、`to_address`、`amount_raw`、`amount_usd`、`is_canonical`。\n\n`asset_registry` 以 `(chain_id, token_address)` 唯一识别 Token，并标注 `is_stablecoin` 与 decimals；`amount_usd` 应由上游结合历史价格、Token 精度与价格版本计算，避免在聚合查询里反复做高精度转换。\n\n### SQL 示例（MySQL 风格）\n\n```sql\nSELECT\n  t.chain_id,\n  SUM(\n    CASE WHEN t.to_address = :address\n         THEN t.amount_usd ELSE 0 END\n    -\n    CASE WHEN t.from_address = :address\n         THEN t.amount_usd ELSE 0 END\n  ) AS net_inflow_usd\nFROM token_transfers AS t\nJOIN asset_registry AS a\n  ON a.chain_id = t.chain_id\n AND a.token_address = t.token_address\nWHERE t.chain_id = :chain_id\n  AND t.block_time >= :from_time\n  AND t.block_time < :to_time\n  AND a.is_stablecoin = 1\n  AND t.is_canonical = 1\n  AND (t.from_address = :address OR t.to_address = :address)\nGROUP BY t.chain_id;\n```\n\n如果是严格的 token 单位净流入，应按 `token_address` 分组统计 raw 精度；如果是美元计价，必须用历史价格，而不是始终假设稳定币 = 1 美元。\n\n### 高并发与风控追问\n\n- 明确是否包含 Mint/Burn、同地址自转、跨链封装资产、交易所归集与协议内部转移。\n- 对 `(chainId, txHash, logIndex)` 幂等，保留 `blockHash` 与 canonical 字段支持 Reorg 冲正；原始转账的业务去重与聚合口径必须区分。\n- 大表按链/日期分区，按地址维度维护流入流出索引表或预聚合；高频查询避免每次扫描全链 Token Transfer。\n- 若价格缺失，应标记不可估值，而不是把空值直接当作 0 USD。\n\n**来源修订说明：** 第三份原资料示意用 `token_address IN ('USDT','USDC','DAI')`，那是符号而非真实链上合约地址；正式题库已修正为按资产维表识别。","source":"用户第三份资料 · 多链数据 / KYT · 原题 29","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"D29","title":"Token Transfer 表的唯一键、分区、排序键应该如何设计？","category":"analytics","priority":"P1","tags":["链上数据","数据建模","源 JD-30"],"diagram":"","answer":"### 核心回答\n\n#### 主键或唯一键\n\nchain_id + tx_hash + log_index。\n\n#### 对于 Solana，可能是\n\nchain_id + signature + instruction_index + inner_instruction_index。\n\n#### 常见字段\n\n**涉及的字段 / 组件：** `chain_id`、`block_number`、`block_time`、`block_hash`、`tx_hash`、`tx_index`、`log_index`、`token_address`、`token_standard`、`from_address`、`to_address`、`amount_raw`、`amount_decimal`、`amount_usd`、`is_mint`、`is_burn`、`protocol`、`created_at`、`updated_at`。\n\n#### 分区\n\n**涉及的字段 / 组件：** `block_date`、`chain_id`。\n\n#### 排序键可以考虑\n\n**涉及的字段 / 组件：** `(chain_id, token_address, block_time)`、`(chain_id, from_address, block_time)`、`(chain_id, to_address, block_time)`、`(tx_hash, log_index)`。\n\n具体取决于查询模式。\n\n#### 如果产品经常查地址维度交易列表，可以额外建一张 address_transfer_index\n\n**涉及的字段 / 组件：** `chain_id`、`address`、`direction`、`counterparty`、`token_address`、`amount`、`tx_hash`、`block_time`。\n\n### 高级追问 / 工程边界\n\n(chainId,txHash,logIndex) 适合规范 EVM Event 去重，但原始分叉数据必须保留 blockHash 和 canonical 状态；Solana 需要 instruction/innerIndex 等标识。分区/排序策略依赖实际查询与数据库引擎。","source":"用户第三份资料 · 多链数据 / KYT · 原题 30","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"D30","title":"如何识别 Proxy 升级历史并按区块版本选择正确 ABI？","category":"analytics","priority":"P1","tags":["链上数据","数据建模","源 JD-32"],"diagram":"","answer":"### 核心回答\n\n很多合约是 proxy，用户调用的是 proxy 地址，逻辑在 implementation 地址。\n\n#### 数据解析要关心 proxy，因为\n\n**要点：** ABI 可能在 implementation；合约升级后函数和事件语义可能变化；storage 在 proxy；同一个 proxy 在不同时间对应不同 implementation；如果不识别 proxy，input decode 可能失败。\n\n#### 识别方法\n\n- 检查 EIP-1967 implementation slot。 检查 Transparent Proxy / UUPS / Beacon Proxy 特征。\n- 监听 Upgraded 事件。 从区块浏览器或开源验证信息补充。\n- 对 implementation 做版本时间线管理。\n\n#### 数据系统中可以维护\n\n**涉及的字段 / 组件：** `contract_address`、`proxy_type`、`implementation_address`、`valid_from_block`、`valid_to_block`、`abi_version`。\n\n这样解析历史数据时，要按当时区块高度选择对应 ABI，而不是永远用最新 ABI。\n\n### 高级追问 / 工程边界\n\n同一代理不同区块可能指向不同实现，维护 proxy+blockRange→implementation/ABI 版本映射；仅监听 Upgraded 事件可能不完整，EIP-1967/Beacon 等需结合 Storage 观察。","source":"用户第三份资料 · 多链数据 / KYT · 原题 32","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"D31","title":"每天百万级 Logs 怎样分块采集、解码、索引并控制成本？","category":"analytics","priority":"P1","tags":["链上数据","数据建模","源 JD-33"],"diagram":"","answer":"### 核心回答\n\n**优化可以分几层：**\n\n#### RPC 层\n\n**要点：** eth_getLogs 分块查询；按 address/topic 过滤；多 RPC 并发；失败动态缩小 block range。\n\n#### 计算层\n\n**要点：** parser 横向扩展；按 chain_id + block_range 分片；批量 decode；ABI 缓存；topic0 快速路由 parser。\n\n#### 存储层\n\n**要点：** 批量写入；列式存储；按日期和链分区；冷热分离；物化视图。\n\n#### 查询层\n\n**要点：** 预聚合；地址索引表；热门地址缓存；结果缓存；异步查询。\n\n#### 数据质量层\n\n**要点：** 解析失败队列；死信队列；重试队列；unknown topic 监控。\n\n#### 尤其要注意 ABI decode 不应该每条都全量遍历 ABI，而是建立\n\n**涉及的字段 / 组件：** `topic0 -> event ABI`、`selector -> function ABI`。\n\n这样可以 O(1) 找到解码器。\n\n### 高级追问 / 工程边界\n\n按区块范围批量 RPC，按 topic0 建 ABI 索引，水平分片、批写及背压；匿名事件、非标准 ABI 和恶意合约需要降级处理。历史回放与实时链路隔离。","source":"用户第三份资料 · 多链数据 / KYT · 原题 33","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"D32","title":"如何隔离历史 Backfill 和实时扫描，并安全切换新解析版本？","category":"analytics","priority":"P1","tags":["链上数据","数据建模","源 JD-34"],"diagram":"","answer":"### 核心回答\n\n要把实时链路和历史回放链路隔离。\n\n#### 实时任务\n\nlatest block -> low latency -> alert / product。\n\n#### 历史任务\n\nblock range backfill -> batch parser -> warehouse。\n\n#### 设计原则\n\n**要点：** 不共用同一消费组；不抢占实时任务 RPC 配额；backfill 限速；backfill 写入临时表或带 version；校验后再切换；parser 支持版本号；结果可覆盖或 merge；任务按 block range 切片。\n\n#### 例如\n\n**涉及的字段 / 组件：** `parser_version = v1`、`parser_version = v2`。\n\n当协议解析规则升级时，可以跑 v2 回填，然后对比 v1 和 v2 差异，确认后切换应用层读取 v2。\n\n#### 面试加分\n\n历史回放是链上数据系统的常态能力，不是临时脚本。协议解析、风险规则、地址标签都会迭代，所以系统必须支持可控重算。\n\n### 高级追问 / 工程边界\n\n把 Backfill 与实时任务隔离 RPC、消费组、CPU 与存储写额度，按范围可重试跑版本化 parser。先在临时数据集校验行数/校验和，再切换读取；保留 Reorg 窗口。","source":"用户第三份资料 · 多链数据 / KYT · 原题 34","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"P01","title":"如何通过压测证明后端性能优化有效？P99、负载模型与协调遗漏如何处理？","category":"performance","priority":"P0","tags":["第三份精选","源 perf #21"],"answer":"### 核心回答\n\n**先度量，再定位，最后验证。** 性能优化的结果不能只写“QPS 提升 2 倍”，还必须证明尾延迟、错误率及资源成本没有不可接受的回退。\n\n### 压测前要固定什么\n\n- **业务目标：** 吞吐目标、P95/P99 SLO、错误率、成本预算。\n- **流量分布：** 真实接口比例、热点分布、读写比、冷/热缓存。\n- **运行环境：** CPU 配额、数据库数据量、连接池配置、网络与限流策略。\n- **采样方式：** 多次运行，记录预热、稳态、峰值和故障恢复时间段。\n\n### 重点观察的指标\n\n| 维度 | 核心指标 |\n|---|---|\n| 用户体验 | P50 / P95 / P99、超时率、业务成功率 |\n| 吞吐与队列 | QPS、到达率、并发量、队列积压 |\n| 服务资源 | CPU、内存、GC、goroutine、锁竞争 |\n| 下游依赖 | MySQL/Redis 连接池等待、慢查询、RPC 耗时 |\n\n### 高级追问 / 工程边界\n\n必须区分**闭环恒并发**与**开放式到达率**压测；后者更适合观察排队和过载时的尾延迟，需避免 coordinated omission（协调遗漏）低估延迟。优化后在相同条件下对比，并通过线上灰度验证系统级收益。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · perf #21","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"B22","title":"Web3 钱包登录如何实现防重放？SIWE、Nonce、ERC-1271 分别负责什么？","category":"web3","priority":"P0","tags":["第三份精选","源 web #11"],"answer":"### 核心回答\n\n钱包地址是公开信息，仅向后端提交 `0x...` 不能证明用户掌握该账户的签名权限。后端应发出一次性挑战，验证钱包对特定域名和用途的授权。\n\n### 登录执行链路\n\n```text\n用户请求登录挑战\n    ↓\n服务端生成一次性 Nonce 与过期时间\n    ↓\n钱包签署登录消息\n    ↓\n服务端验签并原子消费 Nonce\n    ↓\n创建有明确有效期的 Session / JWT\n```\n\n### SIWE、Nonce、ERC-1271 各自负责什么\n\n| 机制 | 作用 |\n|---|---|\n| EIP-4361（SIWE） | 为登录消息提供域名、URI、chainId、nonce、时间等结构 |\n| Nonce | 一次性挑战值，避免旧签名被重复用于登录 |\n| ECDSA | 验证普通 EOA 的签名控制权 |\n| ERC-1271 | 使用智能合约账户的签名验证接口 |\n\n### 安全要点\n\n验证 `domain`、`uri`、`address`、`chainId`、`issuedAt`、过期时间与业务用途；Nonce 必须具有 TTL 且原子消费。不能把“签名正确”理解为永久身份认证或合约账户不可变的授权关系。\n\n### 高级追问 / 工程边界\n\n`personal_sign` 与 EIP-712 是不同的签名表示方式，SIWE 采用带结构的可读消息规范，不应把 SIWE 简单说成“必须 EIP-712”。对合约钱包还应考虑链上验证时使用的区块和签名有效性变化。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #11","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"S24","title":"为什么 Solidity 无界循环分发奖励会变得不可调用？如何改为 Claim？","category":"solidity","priority":"P0","tags":["第三份精选","源 web #27"],"answer":"### 核心回答\n\nSolidity 交易的 Gas 是有上限的。把“遍历所有用户逐个发奖励”写进一笔链上交易，会随着用户数增长出现不可完成的循环，最终业务功能被锁死。\n\n### 为什么全量 Push 不安全\n\n```solidity\nfunction distribute() external {\n    for (uint256 i = 0; i < users.length; i++) {\n        _pay(users[i]);\n    }\n}\n```\n\n单次交易必须为所有用户支付 Gas；一旦人数足够多，循环超出区块资源限制就会失败。单个恶意接收者的外部调用也可能阻断整个分发。\n\n### 改造方案\n\n| 模式 | 设计 | 适用性 |\n|---|---|---|\n| 分批 Push | 每次只处理固定数量、保存进度 | 管理员/后台定时推进 |\n| Pull Claim | 用户主动领取，合约验证领取条件 | 用户量大、发放周期长 |\n| Merkle Claim | 链下计算领取名单和金额，链上保存 Root | 大规模空投或分红 |\n\n### 高级追问 / 工程边界\n\nMerkle Claim 要维护轮次、已领取标志、proof 验证、Root 更新权限及剩余资金。涉及批量资产分发时仍要处理 Reorg、精度、重复领取与可暂停恢复。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #27","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"S25","title":"Solidity mapping 为什么无法枚举所有 Key？如何兼顾合约状态与链下索引？","category":"solidity","priority":"P1","tags":["第三份精选","源 web #28"],"answer":"### 核心回答\n\nSolidity `mapping` 根据 Key 和声明槽位计算存储位置，并不同时维护 Key 列表，因此**不能直接遍历所有 Key**，也没有常规的 `length` 语义。\n\n### 三种枚举方案\n\n1. **合约数组 / EnumerableSet：** 写入时维护 Key 集，适合规模有限且确实需要链上枚举的场景，但需额外 Gas。\n2. **Event + 链下 Indexer：** 通过事件重建地址集合，适合查询、分页和分析，但必须处理 Reorg 与补扫。\n3. **后端数据库物化视图：** 提供列表、排序与聚合，链上仅核验关键状态。\n\n### 设计边界\n\n链上无限制遍历数组仍可能遇到 Gas 上限，不能为了解决 `mapping` 不可遍历而引入新的无界循环。链下列表也不应成为决定资产能否提取的唯一依据。\n\n### 高级追问 / 工程边界\n\n索引器要保留区块哈希、事件位置、合约升级版本及回滚能力。需要严格账务正确性时，读取应以明确区块的合约状态为准。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #28","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"S26","title":"Uniswap V2 恒定乘积公式如何推出滑点和价格冲击？","category":"solidity","priority":"P0","tags":["第三份精选","源 web #29"],"answer":"### 核心回答\n\nUniswap V2 类型的恒定乘积 AMM 用池内 X、Y 的储备量近似维持 `x × y = k`。交易越大、流动性越浅，执行的平均成交价相对交易前边际价格偏离越明显。\n\n### 从公式推导交易输出\n\n若用户输入 `Δx`、手续费率为 `f`：\n\n```text\n有效输入 = Δx × (1 - f)\n\nΔy = y × 有效输入 / (x + 有效输入)\n```\n\n这意味着**价格冲击**来自 AMM 曲线本身；**滑点**还可能来自报价和实际执行之间的池状态变化及 MEV。\n\n### 如何设计交易保护\n\n- `amountOutMin`：最低可接受输出数量，实际执行低于它则交易回滚。\n- `deadline`：阻止已经过期的报价继续在链上成交。\n- `priceImpact`：显示订单规模对池深的影响，帮助用户理解风险。\n- 对高价值交易评估拆单、多个路由及保护交易意图的方式，但仍不能保证无 MEV。\n\n### 高级追问 / 工程边界\n\nRouter 报价不是最终成交承诺；手续费、Token 转账税、抢跑或多跳路由都可能让模拟值偏离最终状态。","diagram":"amm","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #29","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"S27","title":"借贷协议的健康因子、清算、预言机与坏账保护怎么设计？","category":"solidity","priority":"P0","tags":["第三份精选","源 web #30"],"answer":"### 核心回答\n\n借贷协议的坏账防护不是一个 `require` 就能解决，而是**超额抵押、价格预言机、清算市场、参数治理**共同形成的风险闭环。\n\n### 核心机制\n\n| 机制 | 作用 |\n|---|---|\n| 超额抵押 / 借贷额度 | 限制债务规模 |\n| Liquidation Threshold / Health Factor | 识别何时需要清算 |\n| 清算奖励与清算人 | 让外部参与者有经济动力回收风险债务 |\n| 预言机有效性校验 | 避免过期、被操纵或异常价格 |\n| 资产/借款上限、隔离模式 | 限制单资产风险向全协议传染 |\n| Timelock、暂停开关 | 控制治理和紧急响应 |\n\n### 典型故障场景\n\n- 资产瞬时暴跌或流动性枯竭，抵押物无法按报价卖出。\n- 预言机停更、被操纵，或 L2 Sequencer 异常。\n- 清算拥堵、激励不足或协议风险参数设置过宽。\n- 跨链封装资产脱锚导致抵押品估值失真。\n\n### 高级追问 / 工程边界\n\n设计极端行情、闪电贷操纵、坏账积累与清算压力测试。超额抵押仅是风险缓冲，不是偿付能力的数学保证。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #30","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"S28","title":"Staking 如何用 accRewardPerShare、rewardDebt 实现 O(1) 收益结算？","category":"solidity","priority":"P0","tags":["第三份精选","源 web #31"],"answer":"### 核心回答\n\nMasterChef 风格的 Staking 奖励结算使用**全局累计每份收益**和**用户奖励债务**，将每个用户的结算从“遍历全部质押者”降为常数次操作。\n\n### 核心状态\n\n```solidity\nmapping(address => uint256) public balanceOf;\nmapping(address => uint256) public rewardDebt;\nuint256 public accRewardPerShare;\nuint256 public totalStaked;\n```\n\n### 收益计算\n\n```text\npendingReward =\n  userShares × accRewardPerShare / precision\n  - rewardDebt[user]\n```\n\n每次 Deposit / Withdraw / Claim 前，先更新池子的累计收益，再结算用户待领取额，并更新用户份额和 `rewardDebt`。新用户不能因为后续加入就享有过去的奖励。\n\n### 高级追问 / 工程边界\n\n需要处理精度截断、池子奖励不足、零总份额、Fee-on-transfer Token、紧急退出和重入。若按时间发奖励，`block.timestamp` 不是不可操控的高精度时钟。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #31","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"B23","title":"ERC-4337 Paymaster 如何控制 Gas 赞助预算并防止滥用？","category":"web3","priority":"P0","tags":["第三份精选","源 web #33"],"answer":"### 核心回答\n\nERC-4337 的 Paymaster 替用户支付 UserOperation 所需的 Gas；它本质上是一个有预算、有风控、有审计的**链上补贴系统**，不是无条件的免费交易。\n\n### 赞助许可需要检查什么\n\n- **身份和权限：** 钱包、业务 action、目标签名与允许的调用者。\n- **执行范围：** 目标合约地址、method selector、calldata、Token 金额和允许的操作。\n- **额度控制：** 单用户/单操作预算、频率、有效期和协议总赞助余额。\n- **失败控制：** 模拟结果、实际失败成本、异常消耗、熔断和追踪。\n\n### 为什么模拟成功也不安全\n\n在模拟与最终上链之间，账户状态、价格或资源情况可能变化；即便业务逻辑失败，协议仍可能产生 Gas 成本。因此要限制每笔最大预算，监测失败率与可疑用户/调用模式。\n\n### 高级追问 / 工程边界\n\n签名赞助授权也应包含过期时间、业务域、Nonce 等边界，避免重复套利。Paymaster 与 Bundler 的安全模型需要分别理解。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #33","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"S29","title":"Foundry 与 Hardhat 怎么选？Fuzz、Invariant、Fork 测试各解决什么问题？","category":"solidity","priority":"P1","tags":["第三份精选","源 web #37"],"answer":"### 核心回答\n\nFoundry 和 Hardhat 是可以互补的工具链，不是必须二选一。\n\n### 工具侧重点\n\n| 工具 | 优势 | 适用阶段 |\n|---|---|---|\n| Foundry | Solidity 原生单测、Fuzz、Invariant、Fork、Gas Snapshot | 协议逻辑与安全验证 |\n| Hardhat | JavaScript / TypeScript 插件生态、脚本、集成与部署 | DApp 工程、自动化部署与端到端流程 |\n\n### 四种测试各在证明什么\n\n- **Unit Test：** 已知输入和预期输出是否一致。\n- **Fuzz Test：** 随机和边界输入能否发现未考虑的路径。\n- **Invariant Test：** 一系列状态变化后关键资产和权限不变式是否始终成立。\n- **Fork Test：** 在真实历史链状态、外部协议与代币行为下是否仍然可靠。\n\n### 高级追问 / 工程边界\n\n测试覆盖非标准 Token、代理升级、跨函数重入、异常预言机、资金精度和权限变化。覆盖率高不意味着不存在经济逻辑漏洞。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #37","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"C09","title":"设计 NFT Mint 后端：白名单、签名、交易监听与公平 Reveal","category":"design","priority":"P0","tags":["第三份精选","源 web #39"],"answer":"### 设计目标\n\nNFT Mint 后端要协调**白名单、签名授权、链上 Mint、确认和 Metadata Reveal**。后端允许访问并不等于链上有权限，所有真正影响铸造权的条件必须由合约强制校验。\n\n### 系统链路\n\n```text\n白名单 / Mint 资格生成\n    ↓\nMerkle Proof 或 EIP-712 签名\n    ↓\n用户调用 Mint 合约\n    ↓\nIndexer 监听并处理 Reorg\n    ↓\nNFT 元数据服务与 Reveal\n    ↓\n风控限流、状态 API\n```\n\n### 必须明确的业务不变式\n\n- 签名绑定用户、Chain ID、合约地址、数量、价格、轮次、Nonce、Deadline。\n- 合约强制检查每钱包上限、Mint 总量、价格和签名/Proof，不能只靠后端。\n- 链上 Mint 事件按规范链确认，并允许索引回放与冲正。\n- Reveal 应设计公平方案，避免稀有 NFT 提前被识别与定向抢占。\n\n### 高级追问 / 工程边界\n\n如何防止相同签名跨阶段、跨合约重复使用？如何处理 Mint 交易成功但后端未收到事件、或者短暂 Reorg？答题时把状态机和恢复方案讲透。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #39","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"C10","title":"设计链下挂单 + 链上原子结算 NFT Marketplace","category":"design","priority":"P0","tags":["第三份精选","源 web #40"],"answer":"### 核心方案\n\nNFT Marketplace 常见两种实现路径：\n\n| 模式 | 优点 | 缺点 |\n|---|---|---|\n| 链上订单簿 | 公开透明，部分场景抗审查 | Gas 高、撤单和改价成本高 |\n| 链下订单簿 + 链上结算 | 挂单低成本、查询撮合快 | 后端需要存储和发现订单，结算仍必须链上校验 |\n\n### 链下挂单、链上原子结算\n\n```text\n卖家签署 EIP-712 订单\n    ↓\n后端保存并展示订单\n    ↓\n买家选择订单并提交结算交易\n    ↓\n合约核验订单签名与有效性\n    ↓\nNFT 与支付资产原子交换\n```\n\n### 链上必须校验什么\n\n订单应包含 `nonce`、`deadline`、`chainId`、`verifyingContract`，还要绑定 NFT 合约/Token ID、价格、支付资产、手续费与实际执行限制。结算时再次检查所有权和 Approval。\n\n### 高级追问 / 工程边界\n\n取消订单需用链上 nonce 或 bitmap 生效，而非只从后端订单簿删除。后端的撮合结果不具备修改卖家签名业务条件的权限。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #40","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"C11","title":"设计生产级 Relayer：签名校验、幂等、Nonce 管理、Gas 策略与恢复","category":"design","priority":"P0","tags":["第三份精选","源 web #41"],"answer":"### 核心回答\n\nRelayer 不只是调用 `eth_sendRawTransaction` 的脚本，而是**签名安全、资金预算、Nonce 调度和状态恢复**的一整条可靠业务链路。\n\n### 处理链路\n\n```text\nAPI Gateway\n    ↓\nSignature Verifier\n    ↓\nRisk Engine / 业务授权\n    ↓\nNonce Manager\n    ↓\nTx Builder\n    ↓\nSigner / KMS\n    ↓\nBroadcaster\n    ↓\nReceipt Watcher\n    ↓\nRetry & Replacement / Reorg 恢复\n```\n\n### 关键设计\n\n- **用户意图：** 每个请求有业务幂等 Key，签名绑定操作参数、目标合约和费用上限。\n- **Nonce：** 同一发信账户集中分配并持久化，不允许多个 Worker 分别用 pending nonce 自增。\n- **签名：** 私钥隔离在 KMS/HSM 或专门签名服务，支持审计与权限白名单。\n- **广播与替换：** RPC 超时意味着状态未知，先查已知 raw tx/hash 和链上 Nonce；替换交易沿用同一 Nonce 与业务意图。\n- **确认和对账：** 从 Included、Safe、Finalized 到失败/重组都必须有持久状态机。\n\n### 高级追问 / 工程边界\n\n如何避免重试导致重复转账？如何限制 Gas Sponsor 的损失？如何在 RPC 断连后继续恢复未完成交易？这些问题才是 Relayer 区别于普通脚本的关键。","diagram":"","source":"第三份资料 · 性能优化 / Web3 深度专题 · web #41","createdAt":"2026-10-28","updatedAt":"2026-10-28"},{"id":"G59","title":"sync.Map 的 read/dirty 机制与 Go 1.24+ Hash Trie 实现有什么区别？","category":"go","priority":"P0","tags":["sync.Map","Go 1.24","HashTrieMap","源码"],"diagram":"syncmap","answer":"**这份材料需要特别做版本区分。** 附件中 read、dirty、amended、misses、expunged 的讲解是 Go **1.23 及以前**的经典实现；Go **1.24 起默认**的 `sync.Map` 实现切换为基于 `internal/sync.HashTrieMap` 的并发 Hash Trie，不能再把 read/dirty 当作所有 Go 版本通用事实。\n\n### 旧版 read/dirty 设计\n\n- `read` 是可原子发布的只读 Map 视图，Key 命中时大多无需全局锁；`dirty` 在写入新 Key 时维护，访问慢路径需要 `mu`。\n- `amended` 标记 dirty 中是否包含 read 没有的新 Key；`misses` 达阈值会将 dirty 提升为新 read。\n- 删除 entry 可能经历正常值、nil、expunged 状态；Range 不能保证遍历时严格一致性快照。\n- 这种设计在键集稳定、读多写少时效果好，但大量新增/删除 Key 会造成拷贝和全局锁竞争。\n\n### Go 1.24+ 默认实现\n\n- Hash Trie 使用哈希路径定位节点，原子指针加细粒度节点锁管理并发更新，减少不同 Key 写入时的全局竞争。\n- 没有 `misses`、`amended` 和 dirty 提升机制；`sync.Map` 的**公开 API 和语义**仍大体保持兼容。\n- 不保证跨 Key 事务，`Range` 不构成强一致快照，`Load(key)` 然后 `Store(key,n+1)` **不是原子自增**。可用 `atomic.Int64`、CAS 或 Mutex 维护正确性。\n\n**场景选型：** 用 `map[K]V + Mutex/RWMutex` 对复合不变式加锁；大量不同 Key 并发访问考虑 `sync.Map`，仍需要 Benchmark 和 Mutex/CPU Profile 验证。\n\n**官方资料：** [Go 1.24 Release Notes](https://go.dev/doc/go1.24) · [sync.Map 当前源码](https://go.dev/src/sync/map.go) · [HashTrieMap](https://go.dev/src/internal/sync/hashtriemap.go)。","source":"第三份资料 · sync.Map 专题（按 Go 1.24+ 更新核对）","createdAt":"2026-10-28","updatedAt":"2026-10-28"}];</script>

function loadMergedQuestions(){
  const saved=safeLoad(DATAKEY,null);
  const previous=safeLoad(PUBLISHEDKEY,null);
  if(!Array.isArray(saved)){safeStore(PUBLISHEDKEY,qseed);return qseed;}
  const previousMap=new Map(Array.isArray(previous)?previous.filter(q=>q&&q.id).map(q=>[q.id,q]):[]);
  const priorIds=new Set(Array.isArray(previous)?previousMap.keys():Object.keys(LEGACY_SEED_FINGERPRINTS));
  const savedMap=new Map(saved.filter(q=>q&&q.id).map(q=>[q.id,q]));
  const publishedIds=new Set(qseed.map(q=>q.id));
  const combined=[];
  for(const current of qseed){
    const stored=savedMap.get(current.id);
    if(!stored){if(!priorIds.has(current.id))combined.push(current);continue;}
    const unmodified=previousMap.has(current.id)
      ?JSON.stringify(stored)===JSON.stringify(previousMap.get(current.id))
      :(!Array.isArray(previous)&&LEGACY_SEED_FINGERPRINTS[current.id]===publishedFingerprint(stored));
    combined.push(unmodified?current:stored);
  }
  for(const stored of saved){if(stored&&stored.id&&!publishedIds.has(stored.id))combined.push(stored);}
  safeStore(PUBLISHEDKEY,qseed);
  safeStore(DATAKEY,combined);
  return combined;
}

function splitAnswer(raw){let answer=String(raw||'').replace(/^\*\*参考答案[：:]\*\*\s*/,'').trim();const re=/\*\*(?:追问|面试高频追问|面试加分追问)[：:]\*\*/;const m=re.exec(answer);if(!m)return{main:answer,follow:''};return{main:answer.slice(0,m.index).trim(),follow:answer.slice(m.index).replace(re,'').trim()};}
function inlineMd(text){let safe=escapeHTML(text);const code=[];safe=safe.replace(/`([^`]+)`/g,(_,x)=>{const tok='@@C'+code.length+'@@';code.push(`<code>${x}</code>`);return tok});
 safe=safe.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
 safe=safe.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
 return safe.replace(/@@C(\d+)@@/g,(_,i)=>code[Number(i)]||'');}
function markdownToHTML(markdown){const lines=String(markdown||'').replace(/\r/g,'').split('\n');let html='',i=0,list='';
 const endList=()=>{if(list){html+=`</${list}>`;list='';}};
 const special=s=>/^\s*$/.test(s)||/^```/.test(s)||/^#{1,4} /.test(s)||/^(?:[-*] |\d+\. |>|---\s*$)/.test(s)|| /^\|.*\|$/.test(s);
 while(i<lines.length){let line=lines[i];if(!line.trim()){endList();i++;continue;}
 const code=line.match(/^```([a-zA-Z0-9_-]*)/);if(code){endList();const lang=code[1];i++;const codeLines=[];while(i<lines.length&&!/^```/.test(lines[i]))codeLines.push(lines[i++]);if(i<lines.length)i++;if(lang==='text'&&codeLines.filter(x=>x.trim()==='↓').length>=2){
   const stages=codeLines.filter(x=>x.trim()&&x.trim()!=='↓').map(x=>x.trim());
   html+='<div class="answer-flow" role="group" aria-label="技术执行流程">'+stages.map((step,idx)=>
     '<div class="answer-flow-step"><span class="answer-flow-num">'+String(idx+1).padStart(2,'0')+'</span><span class="answer-flow-label">'+escapeHTML(step)+'</span></div>'
     +(idx+1<stages.length?'<span class="answer-flow-arrow" aria-hidden="true">↓</span>':'')
   ).join('')+'</div>';
  }else html+=`<pre><code class="language-${escapeHTML(lang)}">${escapeHTML(codeLines.join('\n'))}</code></pre>`;continue;}
 const heading=line.match(/^(#{1,4})\s+(.+)/);if(heading){endList();const level=Math.max(2,Math.min(heading[1].length,4));html+=`<h${level}>${inlineMd(heading[2])}</h${level}>`;i++;continue;}
 if(/^---+$/.test(line.trim())){endList();html+='<hr>';i++;continue;}
 if(/^\|.*\|$/.test(line)&&i+1<lines.length&&/^\|?\s*:?-{2,}/.test(lines[i+1])){endList();const header=line.replace(/^\||\|$/g,'').split('|');i+=2;const rows=[];while(i<lines.length&&/^\|.*\|$/.test(lines[i]))rows.push(lines[i++].replace(/^\||\|$/g,'').split('|'));html+='<table><thead><tr>'+header.map(x=>`<th>${inlineMd(x.trim())}</th>`).join('')+'</tr></thead><tbody>'+rows.map(cols=>'<tr>'+cols.map(x=>`<td>${inlineMd(x.trim())}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue;}
 const bullet=line.match(/^\s*[-*]\s+(.+)/),order=line.match(/^\s*\d+\.\s+(.+)/);if(bullet||order){const ty=bullet?'ul':'ol';if(list!==ty){endList();html+=`<${ty}>`;list=ty;}html+=`<li>${inlineMd((bullet||order)[1])}</li>`;i++;continue;}else endList();
 if(line.startsWith('>')){const chunk=[];while(i<lines.length&&lines[i].startsWith('>'))chunk.push(lines[i++].replace(/^>\s?/,''));html+=`<blockquote>${inlineMd(chunk.join(' '))}</blockquote>`;continue;}
 const chunk=[line.trim()];i++;while(i<lines.length&&!special(lines[i]))chunk.push(lines[i++].trim());html+=`<p>${inlineMd(chunk.join(' '))}</p>`;
 }
 endList();return html||'<p>暂无答案，可点击编辑添加内容。</p>';
}

function modalContainer(){let x=document.getElementById('modal-root');if(!x){x=document.createElement('div');x.id='modal-root';document.body.append(x);}return x;}
function closeModal(){modalContainer().innerHTML='';}
function openEditor(id){const q=state.questions.find(x=>x.id===id),newId=`U${String(Date.now()).slice(-8)}`;modalContainer().innerHTML=`<div class="modal-scrim" data-action="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="editor-title"><div class="modal-head"><div><div class="caption">CONTENT EDITOR / MARKDOWN</div><h2 id="editor-title">${q?'编辑题目':'创建新题目'}</h2><p>直接修改题目和答案，可为适合的知识点关联交互图解。</p></div><button class="modal-close" data-action="closemodal" aria-label="关闭">${icon('close',19)}</button></div><form id="question-form"><div class="form-grid"><div class="field"><label for="f-id">题号 ID</label><input id="f-id" name="id" value="${escapeHTML(q?.id||newId)}" ${q?'readonly':''} required maxlength="20"/></div><div class="field"><label for="f-cat">技术分类</label><select id="f-cat" name="category">${CAT.map(c=>`<option value="${c.id}" ${q?.category===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field wide"><label for="f-title">面试题目</label><input id="f-title" name="title" value="${escapeHTML(q?.title||'')}" placeholder="例如：Reorg 为什么可能导致用户凭空到账？" required maxlength="250" /></div><div class="field"><label for="f-priority">面试优先级</label><select id="f-priority" name="priority">${['P0','P1','P2'].map(p=>`<option value="${p}" ${q?.priority===p?'selected':''}>${p} · ${p==='P0'?'高频':p==='P1'?'深挖':'进阶'}</option>`).join('')}</select></div><div class="field"><label for="f-diagram">关联图解（可选）</label><select id="f-diagram" name="diagram"><option value="">无图解</option>${Object.entries(DIAG.meta).map(([key,m])=>`<option value="${key}" ${q?.diagram===key?'selected':''}>${m.name}</option>`).join('')}</select></div><div class="field wide"><label for="f-answer">参考答案（支持 Markdown）</label><textarea id="f-answer" name="answer" placeholder="**参考答案：** 先说明机制...&#10;&#10;**追问：** 如果系统发生故障..." required>${escapeHTML(q?.answer||'**参考答案：** \n\n**追问：** ')}</textarea></div></div><div class="modal-foot"><div class="helper">图解与题目独立维护；答案支持 Markdown 粗体、列表、表格和代码块。</div><div style="display:flex;gap:8px"><button class="btn outline" type="button" data-action="closemodal">取消</button><button class="btn primary" type="submit">${icon('check',16)} 保存题目</button></div></div></form></section></div>`;setTimeout(()=>document.getElementById('f-title')?.focus(),0)}
function toast(msg){const root=document.getElementById('toast-root');const d=document.createElement('div');d.className='toast';d.innerHTML=`${icon('check',16)}<span>${escapeHTML(msg)}</span>`;root.append(d);setTimeout(()=>d.remove(),3400)}
async function adminToken(){if(state.mode!=='server')return'';if(state.token)return state.token;const token=window.prompt('服务端题库受到管理员 Token 保护，请输入 ADMIN_TOKEN：');if(!token)throw Error('未提供管理员 Token，操作取消');state.token=token;saveSession('atlas-token',token);return token;}
async function apiWrite(method,path,data){let token=await adminToken();let response=await fetch(path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:data===undefined?undefined:JSON.stringify(data)});if(response.status===401||response.status===403){state.token='';dropSession('atlas-token');throw Error('管理员 Token 无效或服务端只读');}if(!response.ok){let text=await response.text();throw Error('服务端保存失败：'+text.slice(0,140))}return response.status===204?null:response.json();}
async function saveQuestion(record,editing){try{if(state.mode==='server'){await apiWrite(editing?'PUT':'POST','/api/questions'+(editing?'/'+encodeURIComponent(record.id):''),record)}
 let next=state.questions.slice(),i=next.findIndex(q=>q.id===record.id);if(i>=0)next[i]=record;else next.push(record);state.questions=next;if(state.mode==='local'&&!safeStore(DATAKEY,next))throw Error('浏览器存储空间不足，请先导出备份');closeModal();toast(editing?'题目更新成功':'新题目已创建');selectQ(record.id);
 }catch(e){toast(e.message||'保存失败')}}
async function deleteQuestion(id){const q=state.questions.find(q=>q.id===id);if(!q)return;if(!confirm('确定删除 '+id+' · '+q.title+'？\n此操作会影响题库内容，请先导出备份。'))return;try{if(state.mode==='server')await apiWrite('DELETE','/api/questions/'+encodeURIComponent(id));state.questions=state.questions.filter(q=>q.id!==id);if(state.mode==='local')safeStore(DATAKEY,state.questions);state.bookmarks.delete(id);state.selected=state.questions[0]?.id||'';savePersonal();toast(id+' 已删除');render();}catch(e){toast(e.message)}}
function savePersonal(){safeStore(PROGKEY,state.progress);safeStore(BOOKKEY,[...state.bookmarks]);safeStore(NOTEKEY,state.notes)}
function exportFile(filename,mime,content){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已生成 '+filename);}
function exportJSON(){exportFile('stack-atlas-questions-'+new Date().toISOString().slice(0,10)+'.json','application/json;charset=utf-8',JSON.stringify({schema:'stack-atlas/v1',exportedAt:new Date().toISOString(),questions:state.questions},null,2))}
function exportMarkdown(){const text='# Stack Atlas · 深度面试知识库\n\n'+state.questions.map(q=>`### ${q.id}【${q.priority}】${q.title}\n\n${q.answer}`).join('\n\n---\n\n');exportFile('stack-atlas-questions.md','text/markdown;charset=utf-8',text)}
function validateImported(item){const id=String(item.id||'').trim().toUpperCase();if(!/^[A-Z][A-Z0-9_-]{1,18}$/.test(id))return null;const title=String(item.title||'').trim(),answer=String(item.answer||'').trim();if(!title||!answer)return null;return{id,title,answer,category:CAT.some(c=>c.id===item.category)?item.category:'design',priority:['P0','P1','P2'].includes(item.priority)?item.priority:'P1',diagram:DIAG.meta[item.diagram]?item.diagram:'',tags:Array.isArray(item.tags)?item.tags.filter(x=>typeof x==='string').slice(0,6):[],source:String(item.source||'导入'),createdAt:item.createdAt||new Date().toISOString().slice(0,10),updatedAt:new Date().toISOString().slice(0,10)};}
function mdImport(text){const pattern=/^### ([A-Z][0-9]{2,5})【(P[012])】(.+)$/gm;const m=[...text.matchAll(pattern)];return m.map((a,i)=>{let body=text.slice(a.index+a[0].length,i<m.length-1?m[i+1].index:text.length).trim();const nextParent=body.search(/^#{1,2} /m);if(nextParent>=0)body=body.slice(0,nextParent).trim();return validateImported({id:a[1],priority:a[2],title:a[3],answer:body,category:guessCategory(a[1])})}).filter(Boolean)}
function guessCategory(id){const map={G:'go',M:'mysql',R:'redis',K:'kafka',H:'distributed',S:'solidity',B:'web3',E:'ethereum',A:'ai',C:'design'};return map[id[0]]||'design'}
async function importFile(f){if(!f)return;try{const raw=await f.text();let incoming=[];if(f.name.endsWith('.json')){const parsed=JSON.parse(raw);incoming=Array.isArray(parsed)?parsed:Array.isArray(parsed.questions)?parsed.questions:[];incoming=incoming.map(validateImported).filter(Boolean);}else incoming=mdImport(raw);if(!incoming.length)throw Error('文件里没有可识别的题目');const updated=new Map(state.questions.map(q=>[q.id,q]));for(const q of incoming)updated.set(q.id,q);const next=[...updated.values()];if(!confirm(`检测到 ${incoming.length} 道有效题目。\n将按 ID 合并：已有题目会被覆盖，新题目会追加。\n确认导入吗？`))return;if(state.mode==='server')await apiWrite('PUT','/api/questions',next);state.questions=next;if(state.mode==='local')safeStore(DATAKEY,next);toast(`导入成功，当前共 ${next.length} 道题`);go('manage');}catch(e){toast('导入失败：'+(e.message||'格式无效'))}}
async function reset(){if(!confirm(`这会清除对题库内容的自定义修改并恢复 ${qseed.length} 道原始题目。\n你的收藏和学习记录会保留。\n确定继续？`))return;try{if(state.mode==='server')await apiWrite('PUT','/api/questions',qseed);state.questions=qseed.map(q=>({...q}));if(state.mode==='local')localStorage.removeItem(DATAKEY);toast('已恢复原始题库');go('manage');}catch(e){toast(e.message)}}
async function detectServer(){if(location.protocol!=='http:'&&location.protocol!=='https:')return;try{const response=await fetch('/api/health',{signal:AbortSignal.timeout(1500)});if(!response.ok)return;const info=await response.json();if(info.mode!=='server')return;const qr=await fetch('/api/questions',{signal:AbortSignal.timeout(3000)});if(!qr.ok)return;const rows=await qr.json();if(!Array.isArray(rows))return;state.mode='server';state.serverProtected=!!info.writeProtected;state.questions=rows;render();}catch{/* Standalone static website is deliberately fully offline-capable. */}}
function updateDiagram(type,value){if(!(type in DIAG.meta))return;state.diagramStates[type]=typeof DIAG.defaults[type]==='number'?Number(value):value;const q=state.questions.find(q=>q.id===state.selected);if(q?.diagram===type){const el=document.getElementById('diagram-mount');if(el)el.innerHTML=DIAG.render(type,state.diagramStates)}}
function handleClick(e){const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action,id=a.dataset.qid;switch(action){
 case 'nav':state.savedOnly=false;go(a.dataset.view||'dashboard');break;
 case 'category':state.savedOnly=false;state.priority='all';go('library',{category:a.dataset.category,search:''});break;
 case 'savedview':state.savedOnly=true;state.category='all';state.priority='all';go('library',{search:''});break;
 case 'clearfilter':state.savedOnly=false;state.category='all';state.priority='all';state.search='';render();break;
 case 'resetcategory':state.category='all';render();break;
 case 'priority':state.priority=a.dataset.priority;refreshLibrary();break;
 case 'start':state.savedOnly=false;state.category='all';go('library',{selected:'E01'});break;
 case 'select':selectQ(id);break;
 case 'mobile-back':state.mobileReading=false;history.replaceState({},'',location.pathname+location.search);render();window.scrollTo({top:0,behavior:'instant'});break;
 case 'mobile-library-tab':state.savedOnly=false;state.category='all';state.priority='all';state.search='';go('library');break;
 case 'open-diagram':{const d=DIAG.meta[a.dataset.type];if(!d)return;state.savedOnly=false;state.category='all';state.search='';state.priority='all';selectQ(d.featured);break;}
 case 'quicksearch':state.savedOnly=false;state.category='all';state.priority='all';go('library',{focusSearch:true});break;
 case 'toggle-theme':state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;safeStore(THEMEKEY,state.theme);render();break;
 case 'mobile':state.mobileNav=!state.mobileNav;render();break;
 case 'closemobile':state.mobileNav=false;render();break;
 case 'bookmark':if(state.bookmarks.has(id))state.bookmarks.delete(id);else state.bookmarks.add(id);savePersonal();refreshLibrary();toast(state.bookmarks.has(id)?'已添加到收藏':'已取消收藏');break;
 case 'progress':state.progress[id]=state.progress[id]===a.dataset.status?'new':a.dataset.status;savePersonal();refreshLibrary();toast('复习状态已更新');break;
 case 'new':openEditor();break;
 case 'edit':openEditor(id);break;
 case 'delete':deleteQuestion(id);break;
 case 'closemodal':closeModal();break;
 case 'modal-backdrop':if(e.target===a)closeModal();break;
 case 'manager':go('manage');break;
 case 'export':exportJSON();break;
 case 'export-md':exportMarkdown();break;
 case 'import':{let x=document.getElementById('import-file');if(!x){go('manage');x=document.getElementById('import-file');}x?.click();break;}
 case 'reset':reset();break;
 case 'share':{let link=location.href.split('#')[0]+'#q='+id;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>toast('题目链接已复制')).catch(()=>{toast('复制失败，请手动复制地址栏链接')})}else{window.prompt('复制以下题目链接：',link)}break;}
 case 'diagram':updateDiagram(a.dataset.type,a.dataset.value);break;
 }}
function refreshLibrary(preserveSearchFocus=false){
 if(state.view!=='library'){render();return;}
 const panel=document.getElementById('view-container');
 if(preserveSearchFocus){
  // Keep the live search input mounted to prevent virtual keyboard flicker on iOS/Android.
  const template=document.createElement('div');template.innerHTML=renderLibrary();
  for(const selector of ['#question-scroll','.filter-counter','.page-title h1','#reader-area']){
   const from=panel.querySelector(selector),replacement=template.querySelector(selector);
   if(from&&replacement)from.innerHTML=replacement.innerHTML;
  }
  const layout=panel.querySelector('.library-layout'),nextLayout=template.querySelector('.library-layout');
  if(layout&&nextLayout)layout.className=nextLayout.className;
  return;
 }
 panel.innerHTML=renderLibrary();
 if(!window.matchMedia('(max-width:760px)').matches){
  const el=document.querySelector('.question-item.active');el?.scrollIntoView({block:'nearest'});
 }
}
function handleInput(e){if(e.target.id==='question-search'){const input=e.target;state.search=input.value;state.mobileReading=false;refreshLibrary(true);return;}
 if(e.target.id==='study-note'){const id=e.target.dataset.qid;state.notes[id]=e.target.value;safeStore(NOTEKEY,state.notes);return;}
 if(e.target.matches('[data-dinput]')){const key=e.target.dataset.dinput;const num=Number(e.target.value);if(!(key in state.diagramStates.gas))return;state.diagramStates.gas[key]=num;const g=state.diagramStates.gas,eff=Math.min(g.tip,Math.max(0,g.max-g.base)),valid=g.base<=g.max;const put=(selector,value)=>{const el=document.querySelector(selector);if(el)el.textContent=value};put(`[data-dnum="${key}"]`,num);put('#gas-base-label',g.base);put('#gas-tip-label',eff);put('#gas-price-label',valid?g.base+eff:'—');const b=document.getElementById('gas-base-bar'),t=document.getElementById('gas-tip-bar');if(b)b.style.width=(valid?g.base/60*100:0)+'%';if(t)t.style.width=(valid?eff/60*100:0)+'%';put('[data-diagram-desc]',valid?'单价 = baseFee + min(priority, maxFee − baseFee)。未用满的 maxFee 不会按上限全额支付。':'当前 maxFee 小于 baseFee，交易在此 baseFee 下不满足纳入区块的费用条件。');}
}
async function handleSubmit(e){if(e.target.id!=='question-form')return;e.preventDefault();const f=new FormData(e.target);const id=String(f.get('id')||'').trim().toUpperCase(),title=String(f.get('title')||'').trim(),answer=String(f.get('answer')||'').trim();if(!/^[A-Z][A-Z0-9_-]{1,18}$/.test(id)){toast('题号必须以字母开头，只能包含字母、数字、下划线或短横线');return}const old=state.questions.find(x=>x.id===id);const edit=!!old;const rec=validateImported({id,title,answer,category:f.get('category'),priority:f.get('priority'),diagram:f.get('diagram'),tags:old?.tags||[],source:old?.source||'自定义',createdAt:old?.createdAt});if(!rec){toast('请完整填写题号、题目和参考答案');return}await saveQuestion(rec,edit);}
function handleKeydown(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.savedOnly=false;state.category='all';state.priority='all';go('library',{focusSearch:true});return}if(e.key==='Escape'){closeModal();if(state.mobileNav){state.mobileNav=false;render();}else if(state.view==='library'&&state.mobileReading&&window.matchMedia('(max-width:760px)').matches){state.mobileReading=false;render();}return}if(document.getElementById('modal-root')?.innerHTML)return;
if(state.view==='library'&&e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('question-search')?.focus()}}
document.addEventListener('click',handleClick);document.addEventListener('input',handleInput);document.addEventListener('submit',handleSubmit);document.addEventListener('change',e=>{if(e.target.id==='import-file'){importFile(e.target.files?.[0]);e.target.value='';}});document.addEventListener('keydown',handleKeydown);
render();detectServer();
window.STACK_ATLAS_DEBUG={state,go,markdownToHTML,getFiltered};
})();
</script>
