  <script>window.STACK_ATLAS_SEED = [{"id":"G01","title":"请解释 GMP 调度模型；为什么 Go 能支撑大量 goroutine，但不能无限创建？","priority":"P0","category":"go","tags":["GMP"],"answer":"**参考答案：** G 是 goroutine 的描述结构；M 对应操作系统线程；P 持有执行 Go 代码所需的调度上下文、运行队列和局部资源。只有拿到 P 的 M 才能执行普通 Go 代码；调度器还存在全局队列、work stealing、网络轮询器与抢占机制。阻塞系统调用可能使 M 与 P 分离，P 可交由其他 M；网络 I/O 通常经 runtime poller 挂起 goroutine，而不是每个连接长期占一条线程。\n\nGoroutine 初始栈较小且可伸缩，调度成本远低于线程，但**不免费**：栈、定时器、引用对象、调度队列和下游连接都有成本。大量 goroutine 如果卡在 channel、锁或无限等待的 I/O 上，会导致内存增长与长尾延迟。设计上使用带并发上限的 worker pool、信号量和有界队列，而不是“来一条请求开一条 goroutine”无上限地扇出。\n\n**追问：** `GOMAXPROCS` 限制的是同时执行 Go 代码的逻辑并行度，不是 goroutine 总数或 OS 线程上限；I/O 密集任务可能创建多于 `GOMAXPROCS` 的线程。Go 1.25+ 在 Linux 容器环境默认更能感知 cgroup CPU 配额，但人为显式设置可能覆盖自动调整。","diagram":"gmp","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G02","title":"Channel 的同步语义是什么？无缓冲/有缓冲 channel 的 happens-before 有什么区别？","priority":"P0","category":"go","tags":[],"answer":"**参考答案：** Go 内存模型给出：一次 send 在对应 receive 完成之前同步；关闭 channel 在因关闭而读到零值的 receive 之前同步。无缓冲 channel 还具有接收/发送之间更强的握手关系；有缓冲 channel 的发送成功仅意味着写入缓冲（不代表消费者处理完），因此不能用 `ch <- item` 代替业务处理完成确认。\n\n发送到关闭的 channel 会 panic；读取关闭且已耗尽的 channel 会立刻得到元素类型零值和 `ok=false`；`nil` channel 的发送/接收会永久阻塞（除非外层 `select` 有可执行分支）。关闭操作通常由**唯一的发送侧负责人**完成，多个生产者不能随意抢着关。\n\n**追问：** 使用 `select { case ch <- v: case <-ctx.Done(): }` 控制取消，同时约定谁关闭、谁消费；即便 `ctx.Done()` 已触发，若两个 case 都 ready，`select` 仍可能选中发送，因此严格取消语义还需业务层状态校验。","diagram":"gmp","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G03","title":"什么是 data race？`-race` 能否证明一个程序没有并发问题？","priority":"P0","category":"go","tags":["锁与并发","安全"],"answer":"**参考答案：** 两个 goroutine 无同步地访问同一内存位置，至少一个写，且不形成 happens-before，构成 data race。解决手段有互斥锁、channel 所有权传递、原子操作或不可变对象。普通 `x++` 是读—改—写，不是原子操作，不能因 64 位机器就认为线程安全。\n\n`go test -race` 是**动态检测器**：只覆盖测试中实际执行到的并发路径，无法证明不存在竞态；而“无 data race”不等于“无逻辑 race”，例如先查询库存后扣减，即使用锁保护各自单次读写，分布式情况下仍可能超卖。\n\n**追问：** 使用 `atomic` 可以保证单个状态位的可见性与操作原子性，但多字段不变式必须有明确协议；`sync.Mutex` 更易维护复合状态一致性。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G04","title":"Go 的 `map` 为什么不能并发读写？怎样在 `RWMutex`、`sync.Map`、分片 map 中选择？","priority":"P0","category":"go","tags":["事务"],"answer":"**参考答案：** Go 内建 map 允许多个 goroutine 在**完全没有写入**时并发只读，但并发写和读/写缺乏同步，既违反内存模型，也可能被运行时检测为 fatal error。具体散列和桶布局会随 Go 版本变化（近年有实现更新），不应把某一版桶结构作为永恒 API。\n\n高频复合事务（“判断不存在再写入”）优先 `map + Mutex/RWMutex`，把操作放进一个临界区；`sync.Map` 更适合写一次读多次或不同 key 大多由不同 goroutine 操作的场景，提供如 `LoadOrStore`、`CompareAndSwap` 的特定原子操作；高写入吞吐可按 key 分片，减少锁争用，但要处理多 key 原子性和扩容复杂度。\n\n**追问：** `RWMutex` 不是天然优于 `Mutex`：短临界区、写比例不低或锁竞争模式复杂时，读写锁维护成本可能更高；以基准测试、mutex profile 为依据。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G05","title":"切片作为函数参数会发生什么？扩容会导致哪些诡异 bug？","priority":"P0","category":"go","tags":["GC","缓存"],"answer":"**参考答案：** slice header 包含指向底层数组的指针、长度、容量，**传参复制的是 header**，不是数组。修改可见范围内的元素一般对共享底层数组可见；`append` 如果容量足够可能继续共享，如果扩容则分配新数组，调用方的旧 header 不会自动更新。\n\n典型陷阱：把大切片的一小段长期保存在缓存中，可能因共享底层数组导致大块内存无法 GC；复用 `[]byte` 时将缓冲直接交给异步 goroutine，会产生数据被覆盖。可用 `bytes.Clone`/`append([]T(nil), s...)` 做所有权隔离。\n\n**追问：** `append` 之后的别名关系必须明确；跨 goroutine 传递可变切片应复制或转移独占所有权。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G06","title":"逃逸分析怎样影响性能？“返回局部变量指针必定堆分配”是否正确？","priority":"P0","category":"go","tags":["GC"],"answer":"**参考答案：** 逃逸分析是编译器判断对象是否必须在函数栈帧之外继续存活、是否适合栈分配的过程。返回指针通常使目标值需要跨调用存活，但是否在堆上分配，仍取决于内联、优化和上下文；不能将一条语法规则等同于最终分配结果。传给 `interface{}`、闭包捕获、复杂别名关系等也可能触发逃逸，但非必然。\n\n使用 `go build -gcflags='-m=2'` 看分析，`go test -bench . -benchmem` 看 `allocs/op`、`B/op`，`pprof -alloc_space` 定位分配热点。优化顺序通常是先减少无意义对象/字符串转换，再考虑对象复用，而不是为消除一次分配牺牲代码正确性。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G07","title":"Go GC 的写屏障、三色标记、GOGC 和 GOMEMLIMIT 应怎样理解？","priority":"P0","category":"go","tags":["GC"],"answer":"**参考答案：** Go 使用并发追踪式垃圾回收并配合写屏障维护并发标记期间的正确性；STW 仍存在但不是传统“全程停止”的 GC。`GOGC` 控制 GC 目标堆增长比例，调小通常减少堆占用、增加 GC CPU；调大则反过来。`GOMEMLIMIT` 是 Go runtime 管理内存的**软限制**而非操作系统 OOM 的硬保证；cgo、进程外内存、内存映射等可能不计入对应 runtime 范围。\n\n生产调优应同时看 `heap_inuse`、allocation rate、GC CPU、GC pause、容器 RSS、CPU throttling 和请求 P99；接近软限制时可能发生过度 GC 仍无法避免 OOM。Go 1.26 起 Green Tea GC 默认启用，面试回答不要机械背某个旧实现的固定细节。\n\n**追问：** 泄漏不一定是 GC 漏回收，更常见是活跃引用（goroutine、全局 map、未释放 timer、缓存）导致对象仍然可达。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G08","title":"`Mutex`、`RWMutex`、`atomic`、`sync.Once`、`sync.Cond` 怎么选？","priority":"P0","category":"go","tags":[],"answer":"**参考答案：** `Mutex` 适合保护跨字段不变式，临界区尽量短；`RWMutex` 仅在读多写少且读临界区值得并行时有优势；`atomic` 适合简单计数、状态标志、指针发布，涉及多个值则需要不变式设计。`sync.Once` 适合只执行一次的初始化，但函数 panic 后仍视为完成，不能不加设计地用作“失败重试初始化”。\n\n`sync.Cond` 用于“条件不满足就等待，状态改变再唤醒”，必须在循环中检查谓词，处理虚假假设和状态竞争；多数普通任务排队更容易用 channel。`sync.Pool` 仅是可丢弃的临时对象缓存，GC 可以随时清空，不可拿来维护业务数据。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G09","title":"如何设计不会泄漏的 goroutine 生命周期和取消机制？","priority":"P0","category":"go","tags":["RPC"],"answer":"**参考答案：** 一个异步任务至少要能回答：谁创建、谁取消、谁等待结束、结果谁收取、错误谁处理。`context.Context` 通常由入站请求向下传播，带截止时间/取消信号；`cancel()` 要及时调用以释放定时器等资源。无界 `go func()`、阻塞写无人读取的 channel、没有超时的外部 RPC、忘记停的 ticker 都可能泄漏。\n\n团队实践：有界 worker pool + `errgroup.WithContext` + `SetLimit`（若选用对应库版本）+ shutdown 等待；服务退出先停新流量，再取消长任务、等待已接收工作到限时截止。`context` 不是传任意业务参数的万能容器。\n\n**追问：** `errgroup` 关联上下文会在第一个任务出错后取消其余任务，但底层函数必须遵守取消；协作式取消不能强行杀死不响应的阻塞调用。","diagram":"gmp","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G10","title":"Go 网络服务连接很多但线程很少的原因是什么？netpoll 解决了什么、没有解决什么？","priority":"P1","category":"go","tags":["锁与并发","缓存"],"answer":"**参考答案：** Go runtime 把可轮询的网络 fd 与操作系统 epoll/kqueue 等机制集成：连接暂时无数据时挂起 goroutine，fd 就绪再唤醒；这使大量空闲连接不必每连接占用一个 OS 线程。网络读取与写入仍有缓冲区、编解码 CPU、系统调用和唤醒成本。\n\nnetpoll 不能自动解决慢消费者、TCP 写缓存膨胀、业务 handler 长时间持锁、cgo 阻塞、下游资源耗尽。需要连接数/读写超时、per-connection 缓冲限额、心跳与空闲清理、应用层 backpressure。面试时区别“可处理连接数”和“可持续处理 QPS”。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G11","title":"`interface` 的 typed nil 陷阱是什么？怎样设计错误处理？","priority":"P0","category":"go","tags":[],"answer":"**参考答案：** 接口值包含动态类型及动态值；接口只有两者均为 nil 才等于 nil。若 `var p *MyError = nil; var err error = p`，则 `err != nil`，因为动态类型是 `*MyError`。返回 `error` 时如果没有错误，应返回字面量 `nil`，避免把 nil 指针包装到接口。\n\n错误处理建议用 `%w` 包装上下文并通过 `errors.Is/As` 判断稳定分类；不要靠字符串比较或把底层 SQL/网络错误原样暴露给客户端。可区分可重试错误、业务冲突、权限错误、永久失败；错误码用于 API 协议，详细 cause 留在可关联的结构化日志里。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G12","title":"`defer`、`panic`、`recover` 的边界是什么？","priority":"P1","category":"go","tags":["RPC"],"answer":"**参考答案：** `defer` 调用的参数在注册时求值，执行顺序后进先出；命名返回值可能被 defer 修改。`recover` 只有在**同一 goroutine 的 deferred 函数**中直接有效，不能跨 goroutine 捕捉 panic；普通业务错误不应用 panic 控制流程。\n\nHTTP/gRPC 框架可在最外层增加 recover 中间件，记录请求 ID、堆栈与崩溃指标并返回统一错误，但 recover 不会修复已经被破坏的共享状态。应将 panic 当作程序缺陷处理，配合报警和定位。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G13","title":"如何用 pprof、trace、bench 正确分析 Go 性能？","priority":"P0","category":"go","tags":["GC","锁与并发"],"answer":"**参考答案：** 先确定请求类别、吞吐、P50/P95/P99、CPU、内存、GC、阻塞/锁等待基线，再抓对应时间窗口：CPU profile 定位热点；heap 分 in-use/alloc；goroutine profile 看阻塞栈；mutex/block profile 看锁和等待；execution trace 分析调度、GC、阻塞和延迟链。\n\n压测需固定 workload、预热、记录机器配额与依赖，避免只盯局部函数的 `ns/op`；优化后必须验证端到端指标，不然可能用更多内存换取局部速度而让线上 P99 恶化。RPC handler 高 CPU 不一定是 JSON 解析，还可能是日志格式化或锁竞争。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G14","title":"`database/sql` 连接池常见事故有哪些？","priority":"P0","category":"go","tags":["事务","安全"],"answer":"**参考答案：** `*sql.DB` 是并发安全的**连接池管理器**，不是单连接。`SetMaxOpenConns` 过小会增加 `WaitCount/WaitDuration`，过大可能把数据库连接/线程打满；`MaxIdleConns` 与 `ConnMaxLifetime` 需要结合代理、数据库超时及抖动设置。`Rows` 必须及时 `Close`，事务必须确保 Commit/Rollback，否则连接长时间被占用。\n\n设置 query context 超时并不意味着所有驱动/所有服务端工作都会在该时刻物理终止；监控连接等待、InUse/Idle、MySQL Threads_running、慢 SQL。服务有 N 个副本时，`N × MaxOpenConns` 不能超过数据库承受上限。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G15","title":"设计一个并发可控的批量 RPC 聚合接口，如何处理超时和部分结果？","priority":"P1","category":"go","tags":["锁与并发","缓存","RPC"],"answer":"**参考答案：** 首先分清请求预算（例如整个请求 200ms）与子调用预算（下游不同设更短的 deadline）。有界并发、单接口隔离舱、基于 `ctx` 的取消，必须避免每次失败直接对所有下游重试导致放大。主结果依赖的子调用失败时返回明确错误；可降级子结果则带来源、时间戳和是否过期标记。\n\n对重复子调用用 singleflight 合并（仅同一进程/同一 key 的飞行请求），对真正热点再加小 TTL 缓存；不能把 singleflight 当成跨实例锁或持久缓存。用 trace 看 fan-out 最慢分支、排队等待和各级超时耗尽。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G16","title":"Go 中怎样避免 `time.After`、Ticker、Timer 和 channel 的生命周期问题？","priority":"P1","category":"go","tags":[],"answer":"**参考答案：** 在循环里频繁构造 timer 可能导致大量临时对象/管理开销；应在特定版本的运行时语义下衡量复用的必要性。`Ticker` 不再使用时应 `Stop()`，周期任务还要能从 `ctx.Done()` 退出；重设 Timer 时应遵守所用 Go 版本的 Stop/Reset 语义，勿背诵过时的“必须 drain”规则。\n\n对限流和超时尽量用明确的上下文：一个总 deadline + 独立资源等待预算。取消只是发信号，执行方要有可终止路径。高价值追问是“请求被取消后，是否仍会造成下游写入？”——这需要幂等和状态查询解决，并非 Timer 本身能保证。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"G17","title":"如何评价 Go 近几年的语义和运行时变化，对面试有什么影响？","priority":"P2","category":"go","tags":["GC"],"answer":"**参考答案：** Go 1.22 起符合新语言版本声明的循环变量按迭代独立绑定，经典“闭包抓同一个循环变量”的答案需要先问 `go.mod` 中的语言版本；Go 1.25+ 默认 `GOMAXPROCS` 考虑容器 CPU 配额；Go 1.26 默认启用 Green Tea GC；Go 1.27 支持泛型方法，并新增更丰富的分析能力。\n\n核心不是背发布会，而是强调**语义与实现的版本边界**：内置 map 的底层结构、GC 实现、Timer 行为、编译器逃逸判断均可能变化。回答“我会根据实际 Go 版本查官方 release notes 并实测”通常比硬背某版源码更专业。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M01","title":"为什么 InnoDB 使用 B+Tree？聚簇索引和二级索引分别存什么？","priority":"P0","category":"mysql","tags":["索引"],"answer":"**参考答案：** B+Tree 多路分叉，树高低，适合页式存储和范围扫描；叶子节点有序链式访问，支持范围及排序。InnoDB 聚簇索引叶节点存整行（准确说是主键组织的记录）；二级索引叶节点存二级索引列加主键值，查询缺失字段时需按主键回表。\n\n主键应尽量短、稳定、近似递增，避免随机 UUID 造成页分裂/碎片和二级索引膨胀。联合覆盖索引可以省回表，但并非无成本：每个索引增加写放大、占空间和维护成本。","diagram":"btree","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M02","title":"联合索引的最左前缀规则与范围条件什么时候失效？","priority":"P0","category":"mysql","tags":["索引"],"answer":"**参考答案：** 索引 `(tenant_id, status, created_at, id)` 适合先做 `tenant_id = ? AND status = ?` 再按 `created_at` 范围查询。遇到第一个范围条件后，后续列往往不能进一步缩小 B+Tree 的扫描区间，但可被 ICP 过滤或用于覆盖查询，不能粗暴地说“范围后所有索引字段都失效”。\n\n需要区分能否走索引定位、能否在存储引擎过滤、能否消除回表、能否免 filesort；以 `EXPLAIN ANALYZE` 和实际扫描行数为准。函数包裹索引列、隐式类型转换、低选择性也可能改变优化器决策。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M03","title":"MVCC 如何实现 RR 和 RC？Read View、Undo Log 的关系是什么？","priority":"P0","category":"mysql","tags":["MVCC","锁与并发","一致性","事务"],"answer":"**参考答案：** InnoDB 版本通过事务 ID 与 Undo 历史版本形成可见性链；一致性非锁定读通过 Read View 判断某个版本是否对当前事务可见。RC 下每次一致性读通常建立新的 Read View，RR 下事务首次一致性读确定快照并在后续一致性读中复用（仍可读到本事务自己的修改）。\n\n`SELECT ... FOR UPDATE`、UPDATE、DELETE 是**当前读/锁定操作**，并不沿用同一“老快照”语义。对外宣称“RR 下所有查询都看到固定版本”错误；一致性读和锁定读混用可能出现看似不一致的结果。","diagram":"mvcc","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M04","title":"幻读是什么？RR 能彻底禁止幻读吗？Gap Lock/Next-Key Lock 精确地锁了什么？","priority":"P0","category":"mysql","tags":["锁与并发","一致性","事务","索引"],"answer":"**参考答案：** 幻读描述同一事务按谓词再次查询时出现新增/消失匹配行。InnoDB RR 的普通一致性读通常借同一快照避免观察到新提交的幻影；范围型**锁定读**依赖记录锁与 gap/next-key 锁阻止其他事务插入到被锁区间。Next-key = 索引记录锁 + 记录前的间隙锁，并非笼统“锁住一张表”。\n\n唯一索引完整等值命中已有记录通常只需记录锁；RC 下多数查询/索引扫描不使用 gap 锁，外键/唯一约束检查等例外仍可能使用。最终加锁范围由**实际访问路径**决定，必须看索引与谓词。","diagram":"mvcc","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M05","title":"Undo、Redo、Binlog 三种日志各自解决什么问题？","priority":"P0","category":"mysql","tags":["MVCC","一致性","安全"],"answer":"**参考答案：** Undo 支持回滚和 MVCC 读取旧版本；Redo 是 InnoDB 物理/生理层 WAL，用于崩溃恢复已提交但尚未刷到数据页的修改；Binlog 属 MySQL Server 层，主要用于复制与 PITR，常见 ROW 格式还支持 CDC。三者并非互相替代：仅有 binlog 无法代替 InnoDB redo 恢复数据页一致性。\n\nBinlog 和 InnoDB Redo 为保证主存储与复制日志的提交一致性，涉及内部两阶段提交协调；“写完业务表就一定安全”还取决于 `innodb_flush_log_at_trx_commit`、`sync_binlog`、文件系统和硬件故障模型。","diagram":"mvcc","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M06","title":"数据库事务提交成功后，主机突然掉电，如何判断是否会丢数据？","priority":"P0","category":"mysql","tags":["事务","缓存"],"answer":"**参考答案：** 要区分 API 层返回、WAL 是否持久化、Binlog 是否 fsync、存储设备缓存承诺。典型强持久设置是 `innodb_flush_log_at_trx_commit=1` 与 `sync_binlog=1`，但仍须考虑底层磁盘/控制器是否真实遵守 flush、主从异步复制是否已传播、异地备份的恢复点。\n\n即便主库本地崩溃恢复数据不丢，在故障切主时也可能因从库未收到某事务造成逻辑数据回退。因此 **本机持久性 ≠ 集群 RPO=0**，需要 GTID、半同步/组复制或更强共识方案与故障切换规则来约束风险。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M07","title":"死锁和锁等待超时有什么区别？如何排查大量死锁？","priority":"P0","category":"mysql","tags":["锁与并发","事务","索引"],"answer":"**参考答案：** 死锁是等待依赖环，InnoDB 可以检测并主动选择一个事务作为牺牲者回滚；锁等待超时是超过 `innodb_lock_wait_timeout`，未必形成环。应用必须把死锁视作可预期的**事务级重试**，且带抖动和次数上限；不能只重试半条 SQL。\n\n排查查看 `SHOW ENGINE INNODB STATUS`、`performance_schema.data_locks/data_lock_waits`、慢 SQL 和事务时长；统一访问顺序、缩短事务、建立正确索引、减少“先范围锁再按主键更新”的不确定交叉路径。盲目提高锁超时通常只是加剧堆积。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M08","title":"高并发扣库存或账户余额，如何确保不会超卖/透支？","priority":"P0","category":"mysql","tags":["事务"],"answer":"**参考答案：** 使用数据库单条**条件更新**实现原子校验与写入：`UPDATE account SET balance = balance - ? WHERE id=? AND balance>=?`，然后检查 `RowsAffected=1`。与“先 SELECT 再 UPDATE”相比，条件更新把关键不变式交给同一存储引擎执行。\n\n同时要处理请求重试：业务请求 ID 唯一约束/幂等表必须在同一事务中与余额更新绑定，否则超时重试可能二次扣款。高热 key 会使同一行成为串行化瓶颈，可考虑账户分桶、流水聚合、异步排队，但会引入新的余额一致性和查询复杂度。","diagram":"mvcc","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M09","title":"怎样系统排查 SQL 突然从 10ms 变成 2s？","priority":"P0","category":"mysql","tags":["锁与并发","事务","缓存","索引"],"answer":"**参考答案：** 先拆分时间在连接池等待、网络、锁等待、执行计划/扫描、磁盘 I/O、复制延迟中占多少；比对慢日志、`EXPLAIN ANALYZE`、行数估算与实际差异、执行计划是否改变、统计信息和缓存命中。然后看是否出现新索引、数据倾斜、隐式转换、临时表、filesort、回表或大事务。\n\n优化原则是减少**实际扫描行数**及随机 I/O，而不是只看 `type=range/ref`。对热 SQL 建合适覆盖联合索引时，要同时评估 INSERT/UPDATE 维护成本与线上 DDL 风险。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M10","title":"深分页为什么慢？基于游标的分页有哪些限制？","priority":"P0","category":"mysql","tags":["索引"],"answer":"**参考答案：** `LIMIT 1000000,20` 常需定位并跳过大量结果，即便命中索引也有扫描与回表成本。Keyset pagination 用稳定排序键继续：`WHERE (created_at,id) < (?,?) ORDER BY created_at DESC,id DESC LIMIT 20`，并配 `(created_at,id)` 索引，可以把复杂度与定位移动到游标位置附近。\n\n前提是排序稳定、二级键去重、查询条件一致。数据插入/删除可能使跨页结果变化；若要求严格快照，需要快照隔离或查询版本令牌，游标不自动提供全局一致性。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M11","title":"主从复制的异步、半同步意味着什么？如何处理读写分离的读己之写？","priority":"P1","category":"mysql","tags":[],"answer":"**参考答案：** MySQL 复制常借 binlog 传输，GTID 有助于描述执行进度。异步从库可能落后并在故障切换丢失尚未复制的提交；半同步通常要求至少某个从库确认收到日志，但不等同于业务已经在该从库执行、可读或完成 fsync（细节随配置模式变化）。\n\n读写分离的刚写后读可以路由主库、基于 GTID/位点等待从库追平、或使用业务版本条件读；每种方式有延迟/成本取舍。跨 AZ 切主需要防旧主回归双写，并正确处置复制位点分叉。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M12","title":"分库分表的分片键怎么选？为什么不能只按用户 ID 哈希？","priority":"P1","category":"mysql","tags":["交易处理","事务","索引"],"answer":"**参考答案：** 分片键要兼顾读写主路径、热点分布、扩容迁移和跨分片事务。按用户 ID 哈希适合“以用户为中心”交易，但后台按时间/状态批量查询、跨用户订单、全局排序与大户热点会很困难。常见组合是主数据按用户分片、异步构建查询索引/搜索系统、分析任务走列式或离线管道。\n\n扩容不等于取模数量加倍：通常需要虚拟节点/路由表、双写或增量复制、对账与灰度切换。全局唯一 ID 不保证业务唯一性，唯一请求号仍需明确在哪个分片上施加强约束。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M13","title":"MySQL Online DDL 真正能做到全程无锁吗？","priority":"P1","category":"mysql","tags":["锁与并发","事务"],"answer":"**参考答案：** Online DDL 的 `ALGORITHM=INPLACE/INSTANT/COPY`、`LOCK` 支持取决于具体语句、MySQL 版本和表结构；“在线”也可能在 DDL 开始/结束阶段等待 MDL，遇到长事务造成新请求排队形成雪崩。Instant 修改是元数据为主的优化，但有适用限制。\n\n流程：预估表大小和复制延迟，查长事务、设低峰和 `lock_wait_timeout`，灰度执行与回滚策略。大表重建可考虑 gh-ost/pt-online-schema-change，但额外写压力、触发器/复制拓扑和 cutover 锁仍需评估。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M14","title":"为什么 `COUNT(*)`、二级索引与覆盖索引的性能表现差异很大？","priority":"P1","category":"mysql","tags":["MVCC","事务","索引"],"answer":"**参考答案：** InnoDB 不维护一个所有事务都适用的精确总行数，`COUNT(*)` 在不同快照下要按可见性统计；优化器通常倾向扫描较小的合适索引。覆盖索引减少回表，但 MVCC 可见性判断可能仍需要访问聚簇记录，不能把 `Using index` 理解成必然零额外访问。\n\n大规模实时计数可建立异步汇总表，但要定义允许的误差与延迟；对财务口径则以可审计原始数据和明确快照为准。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"M15","title":"使用 MySQL 做 Outbox + CDC，如何保证写库和发 Kafka 不双写丢消息？","priority":"P1","category":"mysql","tags":["Kafka","事务"],"answer":"**参考答案：** 在**同一个数据库事务**里提交业务行和 outbox 事件行，避免“DB 成功但 Kafka 发送失败”的双写窗口；CDC/轮询器把 outbox 事件异步发布到 Kafka，并保存可恢复进度。这个方案使事件具备最终可达基础，但投递仍可能重复，消费者必须依据 `event_id` 或业务版本幂等。\n\n事件 schema 要可演进，outbox 需清理策略、积压报警与毒消息隔离；对业务状态和发件顺序必须有定义。**Outbox 提供原子产生日志，不是跨 MySQL/Kafka/外部 HTTP 的神奇全局 exactly-once。**\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R01","title":"Cache Aside 模式如何保证 MySQL 与 Redis 的一致性？“先更新数据库再删缓存”为什么仍会出错？","priority":"P0","category":"redis","tags":["一致性","事务","缓存"],"answer":"**参考答案：** 主流 Cache Aside 写路径是先在 MySQL 事务提交后删除缓存，读路径 miss 后查询数据库并回填。不能先删除缓存再更新 DB，否则其他读请求可能把旧数据回填；但“先 DB 后删缓存”也仍可能因为删除失败、旧读请求回填、网络乱序而短暂不一致。\n\n可用 TTL 作为最终恢复兜底、删除失败重试与消息补偿、事件驱动失效、读写版本号 CAS 等手段。特别重要：同一个 key 的旧读请求可能在新提交之后回填旧值，应避免没有版本检查的无条件回填。金额/库存等强正确性数据应以 DB 事务校验为准，缓存主要用于加速展示或预估。\n\n**追问：** “延迟双删”是降低风险的经验手段，不能给出严格一致性证明；网络延迟不设上限时仍可能竞争。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R02","title":"缓存穿透、击穿、雪崩分别指什么？如何兼顾热点 key 的恢复？","priority":"P0","category":"redis","tags":["缓存"],"answer":"**参考答案：** 穿透：反复访问原本不存在的 key，打到后端；可用负缓存、参数校验、布隆过滤器，但负缓存涉及新建数据的失效。击穿：单个热点 key 过期/失效导致并发同时回源；可用 singleflight、互斥刷新、逻辑过期+后台刷新。雪崩：大量 key 同时失效或缓存集群整体故障；使用 TTL 抖动、多级缓存、隔离/限流和降级。\n\n**追问：** 逻辑过期的“旧数据可返回”只适合允许陈旧读的业务；单飞在进程内部减少重复请求，不能保证跨实例只刷新一次。回源流量仍要有硬并发上限。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R03","title":"Redis 分布式锁 `SET key value NX PX` 真正能保证什么？","priority":"P0","category":"redis","tags":["GC","锁与并发"],"answer":"**参考答案：** `SET NX PX` 可以让同一 Redis 主节点在某个时段内只允许一个客户端成功获得某个 key，删除锁应使用 Lua 判断随机 owner token 后再 `DEL`，防止 A 的锁过期后删掉 B 的锁。但业务执行可能超过 TTL、进程 STW/GC 暂停、网络分区、主从异步复制切换，这些都使客户端之间发生同时持锁的“错觉”。\n\n若锁用来协调“不能并发修改数据库账本”等关键外部状态，应使用**fencing token**：每次租约获得单调递增版本，真正写入资源的一方拒绝旧版本。注意令牌生成方也需要具有一致性，不能简单假设异步主从 Redis 的 `INCR` 永不回退。对强正确性问题，数据库条件更新/唯一约束通常比缓存锁更关键。","diagram":"lock","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R04","title":"Redlock 是否解决了 Redis 锁的所有正确性问题？","priority":"P1","category":"redis","tags":["Nonce","锁与并发","事务","重入"],"answer":"**参考答案：** Redlock 通过多个相互独立实例的多数派成功加锁和超时估计，降低单个节点故障影响，但正确性仍依赖时间/暂停/网络模型；它不能约束**已经失去锁、但继续执行外部写入的旧客户端**。因此面试不要回答“用了 Redlock 就能实现强分布式事务”。\n\n分清需求：缓存刷新、定时任务去重通常容忍少量重入，可接受 best-effort 锁；支付、账户余额、链上 nonce 分配等需要通过持久存储中的版本检查、幂等键或串行化队列落实不变式。","diagram":"lock","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R05","title":"Redis RDB、AOF、主从复制分别保护哪种故障？","priority":"P0","category":"redis","tags":["事务","缓存"],"answer":"**参考答案：** RDB 生成快照，便于全量恢复但快照之间有丢数据窗口；AOF 按写命令持久化，`appendfsync everysec` 在典型故障下可能损失最近约一秒数据，但这是经验窗口不是所有故障条件的数学上限；AOF rewrite 旨在控制体积。主从复制通常异步，提升读能力与故障接管，但**不是强一致的实时备份**。\n\n`WAIT`/副本确认能改善传播概率，不能自动变成强事务持久化。资金与不可丢失的业务记录应落 MySQL/强持久日志，Redis 更多作为可恢复缓存或辅助协调层。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R06","title":"Redis Cluster 如何分片？MOVED、ASK 和热 slot 如何处理？","priority":"P0","category":"redis","tags":["事务"],"answer":"**参考答案：** Cluster 将 key 映射到 16,384 个 hash slot；正常请求遇到 `MOVED` 表示槽的永久路由位置更新，迁移中的 `ASK` 表示临时去另一个节点执行并需 ASKING 语义。客户端必须支持拓扑发现、重定向和有限重试。`{tag}` 决定哈希标签，使相关多 key 落同一个 slot，支持某些多键操作。\n\nHash tag 不是万能的：把一个巨大业务域放在同一 tag 会造成 slot 热点，扩容后热点不能自动被多个主节点并行承载。跨 slot Lua/事务受限制，设计时优先保证数据结构与访问模式可分片。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R07","title":"Redis 内存达到 `maxmemory` 后会发生什么？LRU/LFU 有什么陷阱？","priority":"P0","category":"redis","tags":[],"answer":"**参考答案：** 淘汰策略决定内存超限时是拒绝可增长写入，还是从全部 key/仅有 TTL 的 key 中采样淘汰。Redis 的 LRU/LFU 是近似算法，不要误解为严格全序。`volatile-*` 策略若没有可淘汰的带 TTL key，可能仍拒绝写入。\n\n内存预算不能只看 `used_memory_dataset`：复制 backlog、客户端缓冲、AOF rewrite、内存碎片以及 fork 的写时复制都会影响 RSS 和峰值。要明确业务允许的驱逐语义，不可将无 TTL 的“核心计数器”放在可淘汰实例中而不做补偿。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R08","title":"如何发现和治理 big key、hot key、慢查询和网络拥塞？","priority":"P0","category":"redis","tags":["一致性","缓存"],"answer":"**参考答案：** Big key 是值/成员过大，影响命令执行、网络传输、迁移、删除和备份；hot key 是流量极度集中，未必大。使用 `SLOWLOG`、latency monitor、`INFO`、`MEMORY USAGE`、采样扫描、key 空间统计及客户端指标定位；生产中尽量用 `SCAN` 代替阻塞的 `KEYS`。\n\nBig key 可拆分、分段扫描、`UNLINK` 异步回收；hot key 可本地缓存、只读副本（容忍延迟）、分片计数、请求合并，注意修改类热点仍要由一致性来源串行化。不能只靠“Redis 单线程很快”来掩盖 CPU/网络单核瓶颈。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R09","title":"Lua 脚本、Pipeline、MULTI/EXEC 分别保证什么？","priority":"P1","category":"redis","tags":["Kafka","交易处理","事务","链上"],"answer":"**参考答案：** Pipeline 主要减少网络往返，**不代表批量原子执行**；事务 `MULTI/EXEC` 保证执行期间命令序列不与其他客户端命令交错，但没有传统关系型数据库的自动回滚，命令级运行错误可能让其他命令继续执行。Lua/Redis Functions 能在服务器侧组合多个 Redis 操作并在执行阶段阻止其他命令插入，适合“检查并扣减”等单实例原子逻辑。\n\n原子性的边界是 Redis 内部状态：脚本无法把 MySQL、HTTP、Kafka 或链上交易一起纳入原子事务；长脚本会阻塞其他请求。Cluster 中还需关注 key slot 约束。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R10","title":"Redis 能否用于精确限流？固定窗口、滑动窗口、令牌桶怎样选？","priority":"P1","category":"redis","tags":["安全"],"answer":"**参考答案：** 固定窗口计数实现简单，却可能在边界发生双倍突发；滑动日志（常用 ZSET 记录时间戳）更精确但每次操作 O(log N) 并占内存；滑动窗口计数是成本和准确性折中；令牌桶允许指定容量突发并按稳定速率补充，漏桶适合平滑输出。\n\n使用 Lua/Function 将读取时间、清理、判断、计数及 TTL 设置原子化（注意时钟来源）；多区域部署要决定全局一致预算还是区域配额。限流被 Redis 故障影响时要预先定义 fail-open/fail-closed，安全敏感 API 往往不能无条件开放。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R11","title":"Redis Stream 与 Kafka 的消费保证有什么不同？","priority":"P1","category":"redis","tags":["Trie","Kafka"],"answer":"**参考答案：** Redis Streams 有 consumer group、Pending Entries List、`XACK`、`XAUTOCLAIM` 等机制，可实现待确认消息的重新认领；但如果设置过短裁剪、缺少持久化/副本保障，或者消费者错误处理，仍会丢失业务事件。Redis Streams 的运维模型、容量与磁盘长期留存能力和 Kafka 的分区日志不同。\n\n适合中小规模轻量异步工作队列；跨团队的大吞吐事件管道、长周期回放、海量可持久消费组一般更偏 Kafka。两者都需要幂等消费与 poison message 处理。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R12","title":"使用 Redis 做排行榜、库存预占、会话保存时最容易忽略什么？","priority":"P1","category":"redis","tags":["缓存"],"answer":"**参考答案：** 排行榜 ZSET 适合排名和 TopN，但需要定义并列分数、增量回放及历史归档；库存预占需要超时释放和与订单状态的最终一致，对资金/库存最终账务不能只靠易失缓存；Session 存储应考虑 TTL 续期、并发登出、同账号多端、token 吊销、跨机房可用性。\n\n设计缓存数据时先问**丢了能否从权威源重建**。如果不能重建，就不该把 Redis 作为唯一事实来源。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"R13","title":"热点计数从 1 万 QPS 到 100 万 QPS，Redis `INCR` 为什么不一定够？","priority":"P1","category":"redis","tags":["Kafka"],"answer":"**参考答案：** 对同一 key 的 `INCR` 必须在其所属节点串行执行，限制可能来自单核、网络、复制和持久化，而非 O(1) 算法复杂度。可做本地聚合定期 flush、按用户/实例分桶、Kafka 异步累计，并在读取时合并；代价是实时精确性变弱，失败恢复要有偏移量和幂等保障。\n\n如果计数是财务余额等强正确性字段，不可直接套用最终一致分桶方案。先明确精确度和延迟 SLA，再选架构。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K01","title":"Partition、Leader、ISR、HW、LEO 分别是什么？","priority":"P0","category":"kafka","tags":["安全"],"answer":"**参考答案：** Topic 拆成多个 partition，单 partition 内记录具有有序 offset；同一 partition 的副本由 leader 对客户端读写，ISR 是当前与 leader 保持足够同步的副本集合。LEO 可粗略理解为日志末端下一条 offset，HW 是被认为已提交、可供正常消费者读取的高水位；不能把 leader 上刚追加但尚未安全复制的记录等同于已提交。\n\nISR 缩小时，系统的可用性与持久性约束发生变化；故障恢复依赖 leader 选举及不干净选举策略。跨分区没有全局总顺序。","diagram":"kafka","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K02","title":"`acks=all`、`min.insync.replicas=2`、`replication.factor=3` 意味着绝对不丢消息吗？","priority":"P0","category":"kafka","tags":[],"answer":"**参考答案：** 这套配置意味着 ISR 数量不足 2 时写入会失败，而写入成功通常需要当前 ISR 中所有副本确认；它显著提高副本故障下的持久性，但**不是对任意多个故障都零丢失**。还需考虑 broker 磁盘、刷盘、集群级损毁、错误配置、unclean leader election、数据保留策略和灾备。\n\n生产端要处理超时“写成功但 ACK 丢失”的不确定结果，使用幂等生产者并以业务 ID 去重。acks 与消息处理完成不是同一个概念。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K03","title":"Kafka Producer 的幂等写是如何实现的？解决不了什么重复？","priority":"P0","category":"kafka","tags":["Kafka","事务"],"answer":"**参考答案：** Kafka 幂等生产者使用 Producer ID、epoch 与 partition 内序号，让 broker 识别重试造成的重复批次，并避免一定范围内的重排。它主要处理同一个 producer 会话/逻辑生产者下重试的重复，**不会凭空识别两个来自不同 HTTP 请求但业务语义相同的消息**。\n\n跨进程/跨服务业务幂等仍要事件 ID、数据库唯一约束或幂等状态机。`transactional.id` 关联事务性生产者，并让过期旧生产者被 fenced，属于另一层语义。","diagram":"kafka","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K04","title":"Kafka Exactly-once 到底在哪个边界内成立？","priority":"P0","category":"kafka","tags":["Kafka","事务"],"answer":"**参考答案：** Kafka 的 EOS 通过幂等生产者、事务写入、消费者 `read_committed`，以及把消费 offset 与输出 topic 记录放入**同一个 Kafka 事务**，支持 Kafka→处理→Kafka 路径的原子可见性。它不能天然确保“消费消息→调用支付接口→写 MySQL→发 Kafka”只执行一次。\n\n外部系统要使用 outbox/inbox、业务去重键、数据库条件状态迁移，或者接受补偿；尤其不能以“Kafka 开了事务”替代支付幂等设计。Exactly-once processing 是**效果等价于一次**，不是物理执行恰好一次。","diagram":"kafka","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K05","title":"Consumer 应该先提交 offset 还是先执行业务？","priority":"P0","category":"kafka","tags":["Kafka","事务"],"answer":"**参考答案：** 先提交 offset 再处理可能因故障**丢任务**（at-most-once）；先处理并持久化，再提交 offset，崩溃重启会重放，通常是 **at-least-once + 消费端幂等**。对于 MySQL，推荐在事务内写入业务效果与已处理事件 ID，成功提交后再提交 Kafka offset；重放时唯一约束阻止重复效果。\n\n还要处理 offset commit 失败、消费组 rebalance 导致的分区转移、批量中部分消息成功；不要把“已拉取”当成“已处理”。","diagram":"kafka","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K06","title":"如何保证用户或订单事件有序？增加 Partition 数量有哪些副作用？","priority":"P0","category":"kafka","tags":[],"answer":"**参考答案：** 把同一 `order_id` 或 `account_id` 做 partition key，可保证同一 partition 追加顺序，但处理器自身并发、重试 topic、异步下游调用仍可能造成业务处理乱序。加业务版本/序列号，消费端要求 `version = current_version + 1` 或按状态转换校验。\n\n增加 partition 后，hash(key) 到 partition 的映射通常改变，历史与新增消息可能落不同分区，跨变更时间段不再具备天然单 key 顺序保障。扩容需评估重新分片、迁移窗口与业务版本锁。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K07","title":"Consumer Lag 飙升时，怎样判断是消费能力不足还是 Kafka 本身出问题？","priority":"P0","category":"kafka","tags":["Kafka"],"answer":"**参考答案：** Lag 是可用 offset 与已提交/已消费进度的差；先看生产速率是否瞬时上升，再看消费速率、消费异常/重试、rebalance 次数、poll 间隔、broker fetch 延迟、磁盘/网络、分区倾斜、下游数据库等待。增加 consumer 只有在有效分区可并行且下游能承受时才有效。\n\n如果单个 partition 热点，更多同组消费者不提高此 partition 的并行度；可重新设计 key、局部批量处理或增加业务层分片，但要保持顺序约束。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K08","title":"Rebalance 发生时怎样避免重复写业务与长时间停摆？","priority":"P0","category":"kafka","tags":["Kafka"],"answer":"**参考答案：** 成员加入、离开、订阅变化或 poll 超时等都可能导致分区重新分配。旧消费者可能在分区被收回前完成某项副作用，但没有及时提交 offset，新消费者会重放，因此**幂等**是底线。\n\n实践上处理 revoke 回调：停止取新任务、处理/取消在途任务、合理提交已完成 offset；限制处理时间与批次，考虑 cooperative assignment、静态成员及较新的 consumer group 协议以降低停摆。Kafka 4.x 已引入新的组协议能力，具体以客户端和 broker 兼容性为准。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K09","title":"什么是消息重试风暴？重试 Topic、DLQ 怎样设计？","priority":"P0","category":"kafka","tags":[],"answer":"**参考答案：** 当下游数据库、第三方 API 故障，所有消费者立即重试会放大负载并阻塞正常消息。应先对错误分类：网络瞬时错误延迟重试（指数退避+抖动+重试预算），参数错误/不可恢复业务错误直接送 DLQ 并报警。主 topic 不应无限卡在 poison message 上。\n\n将消息转到延迟重试 topic 会破坏原 partition 的严格顺序，必须明确业务是否容忍；重要资金流水更适合按账户隔离执行、维持序列号与人工介入状态，而不是无条件跳过。","diagram":"kafka","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K10","title":"Kafka 的日志压缩 `compact` 与按时间删除 `delete` 有何区别？","priority":"P1","category":"kafka","tags":["Kafka"],"answer":"**参考答案：** Delete 按保留时间/大小清理日志段，适合事件流；compaction 在后台保留同一个 key 的较新值，适合键值状态变更或 CDC changelog，但它不是“立刻只剩一条最新消息”，短期仍可能有多条记录。Tombstone 可表达删除，保留/清理时机与消费者落后程度需协调。\n\n使用 compacted topic 恢复状态要理解快照边界、同 key 分区顺序、是否已错过 tombstone；对审计型不可篡改流水不宜依赖只有最新值的压缩主题。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K11","title":"为什么 Kafka 吞吐高？为什么批量越大不一定越好？","priority":"P1","category":"kafka","tags":["Kafka","GC","事务","缓存"],"answer":"**参考答案：** Kafka 依托顺序追加日志、操作系统页缓存、批处理、压缩、批量网络请求等降低单位记录开销；实际高性能不意味着每条消息都 `fsync`。生产端 `linger.ms` 与 `batch.size` 越大通常吞吐/压缩效率更好，但增加排队延迟与请求大小；消费端大批次也会带来 GC、长事务和延迟 ACK 风险。\n\n优化从生产速率、平均消息体积、key 分布、压缩比、带宽、磁盘、刷盘模型和端到端 P99 综合测量，不单看 broker 的 MB/s。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K12","title":"KRaft 和 ZooKeeper 的关系是什么？控制平面与数据平面怎样隔离？","priority":"P1","category":"kafka","tags":["Kafka"],"answer":"**参考答案：** KRaft 将 Kafka 元数据管理放到基于 Raft 的 controller quorum，不再依赖 ZooKeeper；Kafka 4.0 已移除 ZooKeeper 模式。Controller 负责元数据决策、分区 leader 变更等，broker 负责数据读写；元数据 quorum 不等于每个 topic partition 的业务消息副本协议。\n\n生产中应监控 controller quorum 可用性、元数据变更延迟、broker 注册状态、partition under-replicated、磁盘占用和升级兼容性。把“Kafka 用 Raft”笼统等同于“所有日志分区按 Raft 写入”是常见误区。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"K13","title":"如何设计 CDC / Outbox 的全链路顺序和可重放？","priority":"P1","category":"kafka","tags":["事务"],"answer":"**参考答案：** 单表 binlog 原始变更具有确定的提交顺序，但不同表/事务、不同 partition、消费者并发和外部依赖会让业务端看到不同顺序。设计事件 envelope：`event_id, aggregate_id, version, event_type, occurred_at, schema_version, trace_id`；同聚合键定向分区，在消费者用版本检查。\n\nCDC 要处理初始快照+增量衔接、schema 变更、binlog 保留不足、重复事件、回滚/恢复与断点重读。想支持历史重建，要让事件具有足够业务语义，不能只发送某行“更新了”的模糊通知。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H01","title":"高可用的 SLA、SLO、SLI 怎么拆解？99.99% 可用真的能说明用户体验吗？","priority":"P0","category":"distributed","tags":[],"answer":"**参考答案：** SLI 是可测量指标（例如成功请求占比、正确结果率、P99 延迟），SLO 是内部目标，SLA 是对外承诺及违约责任。应从真实用户路径定义成功：钱包充值链路不能只测 API 返回 200，还要看到账正确率、完成时间、重复入账率。99.99% 的“探针 HTTP 可用”可能掩盖功能失效。\n\n错误预算 = 可容忍失败量，用于发布节奏与风险管理。分别建立入口可用性、依赖可用性、业务正确性、数据完整性目标，关注 P99 而不仅是平均值。严格意义的“4 个 9”还要明确统计周期、排除窗口和地域口径。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H02","title":"如何估算服务从 1 万 QPS 扩到 10 万 QPS 的资源容量？","priority":"P0","category":"distributed","tags":["GC"],"answer":"**参考答案：** 先拆请求类型、峰值/平均比例、每请求 CPU 时间、平均与 P99 耗时、内存/网络/DB query 数量，而不是直接按 QPS 线性增加 Pod。简单估算：若每请求消耗 2ms 单核 CPU，则 10 万 QPS 需要约 200 CPU 核的理论 CPU 时间，生产还要留 GC、调度、峰值和故障容量冗余。\n\n依据 Little's Law `L = λW`：100k QPS、平均在途时间 100ms，系统平均约 10k 个在途请求；P99 很高时队列/连接需求可能远超平均估算。压测要使用能维持目标到达率的 open-loop 模型，避免闭环压测的 coordinated omission 低估尾延迟。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H03","title":"限流、熔断、降级、隔离、背压区别是什么？","priority":"P0","category":"distributed","tags":[],"answer":"**参考答案：** 限流限制请求进入速率；并发隔离限制正在消耗的资源；背压让上游知道“处理能力不足”，避免无限排队；熔断在下游持续失败时快速拒绝请求并安排探测；降级在功能和新鲜度允许的范围返回简化结果。它们是不同控制维度，不能以一个 Redis QPS 计数器替代全链路保护。\n\n典型次序：入口速率控制 → 下游并发隔离/排队上限 → 超时与重试预算 → 熔断 → 受控降级。熔断器应区分调用方错误（4xx）与基础设施失败，半开探测要有数量限制，否则恢复瞬间仍会打爆后端。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H04","title":"为什么重试会把一个小故障放大成全站故障？","priority":"P0","category":"distributed","tags":["链上","RPC"],"answer":"**参考答案：** 多层服务若每层失败重试 3 次，A→B→C→D 的最坏调用量可能成倍增长；下游本已过载，重试只会加重排队。正确策略是统一端到端 deadline、限制重试只发生在合适层、指数退避+抖动、设置最大次数/总时间预算，并为重试设独立并发配额。\n\n首先判断操作是否幂等：GET 可重试不等于所有 GET 都无副作用；支付、发券、链上广播必须有请求 ID 和状态查询。RPC 超时后**结果是未知**，不是“必定失败”。","diagram":"retries","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H05","title":"怎样设计一个真正可靠的幂等 API？","priority":"P0","category":"distributed","tags":["交易处理","事务","索引","链上"],"answer":"**参考答案：** 客户端为“同一次业务意图”生成稳定幂等键；服务端将 `tenant_id + idempotency_key` 建唯一索引，并记录请求参数摘要、执行状态、结果与可恢复凭据。重复请求若 key 相同但 payload 不同应拒绝，而不是错误复用成功结果。\n\n对于 DB 内业务操作，用同一事务写入幂等记录与业务状态；对于外部支付/链上交易，需持久化状态机、外部请求唯一 ID、超时后的主动查询和人工兜底。不可把 Redis `SETNX` 当永久幂等存储，它会过期/被淘汰或切主丢写。","diagram":"retries","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H06","title":"跨服务订单 + 支付 + 库存，2PC、TCC、Saga、Outbox 怎么选？","priority":"P0","category":"distributed","tags":["锁与并发","事务","链上"],"answer":"**参考答案：** 2PC 提供协调式原子提交语义，但会带来锁持有、协调者和可用性/扩展性问题，外部 HTTP/链上操作通常不具备 XA 参与者能力；TCC 在各服务实现 Try/Confirm/Cancel 与资源预留，要求处理空回滚、悬挂和幂等；Saga 把长事务拆成本地事务加补偿，适合有可逆步骤的流程。\n\nOutbox 负责可靠地把本地事务结果发布成事件，并不决定业务补偿。支付退款可能不能在业务语义上“当作从未发生”，所以必须明确每步不可逆性及客户可见状态。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H07","title":"分布式 Leader 选举之后为什么还需要 fencing token？","priority":"P0","category":"distributed","tags":["锁与并发","事务"],"answer":"**参考答案：** 租约过期不等于旧 leader 停止运行：旧进程可能经历长暂停后恢复，继续向数据库/对象存储写入。新 leader 已获得租约，若存储系统不校验代际，便出现双写。用单调增加 epoch/fencing token，并在**最终资源的写入路径上**拒绝比当前版本旧的写入，才能封住旧 leader。\n\n必须区分“有了锁服务”和“资源本身支持 fencing”；如果目标系统不能比较版本，只能通过更强的事务中心、单写代理或业务乐观锁设计消除风险。","diagram":"lock","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H08","title":"服务跨可用区部署就具备高可用了吗？","priority":"P0","category":"distributed","tags":[],"answer":"**参考答案：** 多 AZ 只能降低部分机房故障风险；如果实例依赖同一个单主 Redis、同一条 NAT、同一套配置中心、同一个数据库写节点，仍存在共享故障域。需要分层梳理入口、服务发现、负载均衡、数据库、消息、DNS、证书、运维控制面等依赖。\n\n设计明确 RTO（恢复时间目标）和 RPO（数据丢失目标），实施可验证的切流、主从提升、只读降级与回切。故障切换期间的 split-brain、防旧主写、数据修复通常比“能自动重启实例”难得多。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H09","title":"Redis/MySQL/Kafka 全链路超时应如何设置？","priority":"P0","category":"distributed","tags":["Kafka","交易处理","事务","RPC"],"answer":"**参考答案：** 一次用户请求的总 budget 应严格覆盖网关排队、RPC 连接/调用、DB 等待与结果编码；各层只消费剩余时间，而不是每层都独立设 5s 导致总耗时无边界。对下游设置连接超时、请求超时、pool 等待、批量上限与最大排队长度；用 tracing 量化预算耗尽的位置。\n\n对 DB 写操作，超时后的事务是否提交未知，不能无条件再扣一次；对 Kafka，ACK 超时同样不能证明消息未到；对 EVM 交易，RPC 广播超时也不能证明交易不存在。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H10","title":"如何防止库存/余额高并发更新引发单点热点？","priority":"P0","category":"distributed","tags":[],"answer":"**参考答案：** 先判断是否确实需要每次操作都有全局强一致的最新值。如果必须强一致，单个账户或 SKU 的关键不变式存在不可绕过的串行化成本，可通过专属分区/账户 actor、同 key 排队与批处理提升效率，但无法凭空消除冲突。若容忍最终一致，可以预分配配额、分片桶与本地扣减，再异步对账和回收。\n\n预售场景可将总库存分成多份“可卖额度”，配额耗尽就拒绝或申请补充，但须保证额度总和不超总库存；分布式分片只是改变争用形态，风险控制是关键。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H11","title":"多机房双活的难点是什么？是否可以无脑实现“跨地区同时写”？","priority":"P0","category":"distributed","tags":["交易处理","一致性"],"answer":"**参考答案：** 双活最大难点是跨地域延迟、网络分区、并发冲突和故障恢复。读多写少或互不相关的用户数据可按用户/地域单写归属，再就近读；交易余额、唯一约束不能简单用 last-write-wins，因为两个并发扣款若互相覆盖会破坏不变式。\n\n需明确一致性模型：强一致跨区写牺牲延迟和分区可用性；最终一致需要 CRDT/冲突解决且仅适合可合并的数据类型。数据主权和监管也会影响可复制范围。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H12","title":"CAP、PACELC 在架构选型中真正意味着什么？","priority":"P1","category":"distributed","tags":["Nonce","一致性"],"answer":"**参考答案：** CAP 讨论在**网络分区发生时**，分布式系统无法同时向所有请求保证强一致和可用响应；不是平时随便从 C/A/P 三项选两项。PACELC 补充“即使没有分区，也要权衡同步复制延迟与一致性”，与跨 AZ/跨地域数据库实际取舍更贴近。\n\n要按操作分类：展示型统计可牺牲少量新鲜度，支付余额、取款 nonce/资金不变式则不能容忍任意陈旧写。术语必须落到“读取是否线性一致、写入在故障期间是拒绝还是接受”的 API 合同。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H13","title":"雪花 ID、UUID、ULID、数据库号段怎么选？","priority":"P1","category":"distributed","tags":["索引"],"answer":"**参考答案：** Snowflake 类 ID 通过时间戳、节点标识和序列组合，吞吐高/趋势递增，但必须处理时钟回拨、节点 ID 冲突、序列耗尽；UUIDv4 去中心化强，但随机索引局部性差；UUIDv7/ULID 具有时间排序特征，但不等于绝对全局单调、也不自动提供业务唯一约束。号段模式依赖中心存储分配，可降低每次请求对中心的依赖。\n\n不应把 ID 的“唯一”与“可排序”“不可猜测”“业务幂等”混为一谈。订单号外露可能还需要抗枚举和业务域校验。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H14","title":"如何设计可观测性，排查“用户说慢，但服务器平均延迟正常”？","priority":"P1","category":"distributed","tags":["Kafka","锁与并发","安全","RPC"],"answer":"**参考答案：** 聚合看平均会掩盖某个租户、某个链、某个机房的长尾。建立 RED（Rate/Errors/Duration）和资源饱和度指标，日志带 `trace_id, request_id, tenant, chain_id, tx_hash` 等安全元数据；全链路 trace 标注连接池等待、Kafka Lag、RPC provider、DB query、锁等待与异步任务消费间隔。\n\n直方图聚合应正确计算跨实例分位数，不能直接取“各实例 P99 的平均”；注意标签高基数导致监控爆炸，原始地址/tx hash 通常应留日志/trace，而不是所有维度作为 Prometheus label。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H15","title":"RPC / HTTP/2 / gRPC 的连接复用及负载均衡隐藏了哪些问题？","priority":"P1","category":"distributed","tags":["RPC"],"answer":"**参考答案：** HTTP/2 在少量 TCP 连接上多路复用，降低建连开销，但长期连接会让 L4 负载均衡在新增实例后仍保持旧的连接分布；服务发现与客户端连接池、L7 负载均衡需协调。gRPC 截止时间要跨服务传播，连接断开后的重试须区分是否已经产生业务副作用。\n\n流控、最大并发 stream、消息大小、keepalive、服务端 graceful shutdown 和 load shedding 都影响真实容量；单纯增加实例无法解决客户端只粘住旧连接的问题。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H16","title":"Kubernetes 下如何做优雅终止、滚动发布和防止流量黑洞？","priority":"P1","category":"distributed","tags":["Kafka","安全"],"answer":"**参考答案：** Pod 收到终止信号后，需要尽快不再承接新请求（readiness/endpoint 更新有传播延迟），并完成在途请求或在业务允许的范围内取消；`terminationGracePeriodSeconds` 与 Ingress/LB draining、后台 worker 的重新认领周期协同。对 Kafka consumer，要先停轮询再结清或明确放弃在途并允许幂等重放。\n\n发布安全需要最小就绪副本、maxUnavailable/maxSurge、连接池容量和数据库迁移兼容窗口；schema 先扩后缩，避免旧新版本同时运行导致不可读或写错。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H17","title":"故障演练中，应如何验证“高可用”不是口头承诺？","priority":"P1","category":"distributed","tags":["Kafka","RPC"],"answer":"**参考答案：** 按单实例故障、AZ 故障、数据库主库失效、Redis 主从切换、Kafka 分区不可写、RPC provider 大面积超时等注入故障；对每类给出预期 SLO/RTO/RPO 和验收脚本。测试重点包括故障开始后队列增长、重试放大、旧 leader fencing、业务记录对账、恢复后的积压清空与人工操作流程。\n\n避免只在空载做 Chaos Test；真实问题常出现于峰值负载与恢复抢流的瞬间。演练前要有隔离环境/终止按钮，并严格避免在真实资金系统上进行无保护注入。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"H18","title":"如何设计生产级 API 安全：鉴权、幂等、防重放与审计？","priority":"P1","category":"distributed","tags":["Nonce","安全","链上"],"answer":"**参考答案：** 认证证明调用者身份，授权决定对某个资源是否有权限，必须在每个服务边界校验租户/对象所属权，防止仅凭前端传来的 userId 访问他人订单。高风险 API 使用短期凭据、细粒度权限、签名/时间戳/nonce 防重放、业务幂等及操作审计。\n\n日志不要记录私钥、助记词、可用 bearer token 或完整签名材料；PII/链上地址的关联也应遵循最小权限。鉴权成功不等于业务意图合法，提现还要考虑风控、额度、二次确认、地址白名单和延迟审核。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S01","title":"`storage`、`memory`、`calldata`、`transient storage` 有什么区别？","priority":"P0","category":"solidity","tags":["Storage","Gas","EIP","交易处理"],"answer":"**参考答案：** `storage` 是持久状态；`memory` 是调用执行期间的易失内存；`calldata` 是不可变的调用输入区域，外部函数读取复杂只读参数时通常减少复制；`transient storage` 基于 EIP-1153 的 `TLOAD/TSTORE`，生命周期限于当前交易，适合低成本的交易内共享状态（如重入锁），并不是跨交易缓存。数据位置转换可能触发复制；相同位置的引用赋值可能造成别名。\n\n**追问：** `storage` 改写不等于立刻落磁盘，而是 EVM 状态转换的一部分；Gas 成本取决于冷/热访问、原值/新值、fork 规则。`transient` 仅支持相应语言/编译器支持的值类型，需验证目标链硬分叉支持。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S02","title":"Solidity 状态变量如何布局？`mapping(address => uint256)` 的槽位怎样计算？","priority":"P0","category":"solidity","tags":["Storage"],"answer":"**参考答案：** 通常状态变量从 slot 0 依声明/继承顺序分配，多个可打包的小型值有机会放进同一 32 字节槽，struct/数组有特殊边界规则。若 mapping 根槽为 `p`，key 为 `k`，对应元素位置为 `keccak256(abi.encode(k,p))`（对应静态类型和编码细节），mapping 根槽本身不存元素数据。动态数组长度占根槽，元素数据从 `keccak256(p)` 开始。\n\n升级合约时插入/重排已有状态字段会破坏代理旧 storage 布局；应比对 compiler storage layout、使用 namespace/storage gap 等受控模式。","diagram":"storage","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S03","title":"`call`、`delegatecall`、`staticcall` 的执行上下文有何差别？","priority":"P0","category":"solidity","tags":["Storage"],"answer":"**参考答案：** `CALL` 在被调用合约的存储/余额上下文执行，`msg.sender` 变为当前调用合约；`DELEGATECALL` 借用目标代码，但在**调用方的 storage、address、balance 上下文**执行，保留上层 `msg.sender` 与 `msg.value`，是代理合约的核心能力；`STATICCALL` 不允许产生状态变化。\n\n危险在于对任意地址做 `delegatecall` 相当于允许外部代码操纵本合约资产与任意存储槽。任何可升级/插件系统都需要强权限、代码来源验证以及明确的 storage 兼容性约束。","diagram":"proxy","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S04","title":"重入攻击本质是什么？CEI 与 `ReentrancyGuard` 能覆盖全部重入吗？","priority":"P0","category":"solidity","tags":["重入"],"answer":"**参考答案：** 重入源于合约在不变式尚未稳定时把控制权交给不可信外部合约，对方通过回调再次进入原函数或其他共享状态函数。例如提现函数先 `call{value: amount}` 发送 ETH，后扣余额，攻击者回调反复提取。CEI（Checks→Effects→Interactions）先验证并更新内部账本再外部调用，是基础防线。\n\n`nonReentrant` 互斥保护可辅助防止某些跨函数路径，但需覆盖共享状态的所有入口；ERC-777 hooks、ERC-721/1155 safe transfer 回调、外部 token 合约都可能重入，不只是 ETH 转账。对异步/复杂协议，须以“不变式与状态机”审计而非只加 modifier。","diagram":"proxy","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S05","title":"为什么现在不建议依赖 `transfer`/`send` 的 2300 Gas 来防重入？","priority":"P0","category":"solidity","tags":["Gas","锁与并发","重入"],"answer":"**参考答案：** 转发 2300 Gas 的假设对后续 Gas 定价调整敏感，可能使原本能接收 ETH 的合约无法正常收款；即便当前 gas 约束成立，也不构成全局防重入证明。实践常采用 `(bool ok,) = to.call{value: amount}(\"\"); require(ok)`，但必须先完成状态更新、检查返回结果和适当加锁。\n\n更稳妥的设计是 Pull Payment：给用户记可领取余额，由用户自行领取；同时考虑提款失败、恶意接收方、手续费和重复领取状态。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S06","title":"`tx.origin` 为什么不能做权限判断？EIP-7702 后有什么新问题？","priority":"P0","category":"solidity","tags":["EIP","交易处理","安全"],"answer":"**参考答案：** `tx.origin` 是交易外层发起地址；用户若调用恶意中间合约，中间合约仍能触发目标合约，而 `tx.origin` 仍是用户，导致钓鱼式越权。鉴权通常依据 `msg.sender`、角色与明确授权语义。也不能仅用 `msg.sender == tx.origin` 判断“人类/EOA”，因为智能钱包和账户抽象破坏了简单假设。\n\nEIP-7702 允许 EOA 持久设置到实现代码的委托指示器，使原本外部账户能执行账户逻辑；这进一步弱化“账户无代码/外层起源地址”之类安全判断。应依据经审计的签名/权限流程。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S07","title":"Transparent Proxy 与 UUPS Proxy 的差异是什么？升级最危险的点在哪里？","priority":"P0","category":"solidity","tags":["Storage","EIP","锁与并发"],"answer":"**参考答案：** 两者常通过 EIP-1967 约定的实现地址槽与 `delegatecall` 实现业务；Transparent 的升级/admin 逻辑主要放在 Proxy/ProxyAdmin 侧，UUPS 将升级逻辑放在实现合约中（常重写 `_authorizeUpgrade`）。UUPS 轻量，但错误授权或升级到缺失正确升级接口的实现，可能让系统被接管或无法再升级。\n\n升级风险包括 storage 布局碰撞、未锁定实现合约初始化器、初始参数错误、权限迁移失误、selector 冲突、代理与实现模式混用。应有 Timelock + 多签、变更审计、fork 模拟、storage-layout 检查和紧急暂停机制。","diagram":"proxy","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S08","title":"什么是 Signature Replay？如何正确使用 EIP-712 和 Permit？","priority":"P0","category":"solidity","tags":["Nonce","EIP","交易处理"],"answer":"**参考答案：** 如果验证签名时没有绑定链、验证合约、操作类型、执行参数、用户 nonce 和截止时间，相同签名可在别的交易、合约或链重复使用。EIP-712 用 domain separator 与 typed structured data 显式约束签名域；具体设计仍必须自己加入防重放 nonce/deadline 并在成功执行后消费。\n\nEIP-2612 `permit` 是签名授权 ERC-20 allowance 的机制，不代表所有 ERC-20 都实现它；它本身也不是“签名直接转账”。智能合约钱包签名验证往往要支持 ERC-1271 而不只靠 `ecrecover`。对 `ecrecover` 原语还要考虑签名规范化、错误返回值与 EIP-2098 形式。","diagram":"signature","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S09","title":"Solidity 0.8+ 默认检测溢出，为什么 DeFi 仍可能发生算术漏洞？","priority":"P0","category":"solidity","tags":[],"answer":"**参考答案：** 0.8+ 对通常算术溢出/下溢执行检查并回滚，`unchecked` 可绕过；但整数除法截断、精度倍率、转换窄化、错误币种 decimals、先乘还是先除、价格量纲、负债和资产净额关系仍会破坏经济正确性。\n\n例如 `shares = assets * totalSupply / totalAssets` 的初始池、极小值舍入和捐赠操控会出现份额膨胀风险；需要合适的初始虚拟份额/资产、最小入金和不变式测试。**没有 overflow ≠ 没有财务漏洞**。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S10","title":"为什么低级调用不检查返回值属于高危缺陷？","priority":"P0","category":"solidity","tags":["交易处理"],"answer":"**参考答案：** `.call/.delegatecall/.staticcall` 返回是否成功及返回数据；如果忽略 `success=false`，调用方可能继续记账，产生“账上已支付，实际未转出”的不一致。高层接口调用通常传播 revert，但若业务使用 `try/catch` 或低级调用自主吞错，也必须明确定义失败分支。\n\n同一交易内，未被捕获的 revert 会回滚本次交易状态及事件；捕获子调用失败后继续执行则需要确保不变式仍成立。批处理合约尤其要决定是全有全无还是逐条记录失败。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S11","title":"ERC-20 代币交互有哪些“非标准兼容性”问题？","priority":"P1","category":"solidity","tags":["交易处理","重入"],"answer":"**参考答案：** 现实中的 token 可能不返回标准 `bool`、收转账手续费（fee-on-transfer）、余额自动 rebasing、黑名单/暂停、不同 decimals 或特殊 approve 行为。不能假设 `transferFrom(amount)` 必然让目标余额增加 `amount`；涉及资产记账时应验证交易前后实际 `balanceOf` 变化，并注意变化本身是否可能被重入/重基变动干扰。\n\n可以使用经审计的 `SafeERC20` 处理返回值差异，但它不会替业务自动修复税费、rebasing、hook 或黑名单语义。白名单资产及单币种适配层经常比“支持所有 token”更安全。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S12","title":"闪电贷攻击真正攻击的是什么？怎样抵御预言机操纵？","priority":"P0","category":"solidity","tags":["交易处理","安全"],"answer":"**参考答案：** 闪电贷提供单个交易内暂时可支配的大额资金，只要交易末能还款就成立；它本身不是漏洞，放大了可操控市场价格/治理票权/抵押定价等逻辑问题。若合约直接读取某个低流动性池子的瞬时现货价格作为清算或抵押估值，攻击者可短时推高价格并借出超额资产。\n\n防御包括稳健预言机（多源、TWAP、价格偏离限制、陈旧度检查）、资产上限、时间/块级缓冲、清算安全边际及对极端流动性的压力测试。不能认为“禁止合约调用”可防御所有闪电贷。","diagram":"l2","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S13","title":"MEV、Front-running、Sandwich 对 DEX 合约意味着什么？","priority":"P0","category":"solidity","tags":["交易处理","链上"],"answer":"**参考答案：** 待打包交易的信息可能被搜索者/构建者利用；抢跑可抢占价格/名额，三明治通过在用户交易前后交易利用滑点获利。合约应要求 `amountOutMin`、`deadline`、合理价格边界/批处理公平性，客户端也要避免无限滑点和无限有效期。\n\n使用私有交易通道可以改善部分暴露，但不消除所有 MEV 或可信排序风险。以链上预言机瞬时值决定外部经济结算仍需要操控成本分析。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S14","title":"Gas 优化的主要方向是什么？为什么“省 Gas”不是唯一目标？","priority":"P1","category":"solidity","tags":["Storage","Gas","安全","缓存"],"answer":"**参考答案：** 高成本往往来自新的持久存储写入、冷 slot 首次访问、循环内重复读取 storage、动态数组扩容及不必要的外部调用。可考虑值打包、缓存 storage 到 stack/memory、只读大参数用 calldata、简化布局、使用 custom errors；但精确费用随硬分叉、访问冷热状态、编译器版本改变。\n\n把复杂安全校验删掉只为省几千 Gas，往往得不偿失。可以用 Foundry gas snapshot 对典型状态（首次调用与热路径）回归，而非孤立比较一段 opcode。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S15","title":"Event 与合约 Storage 的区别是什么？后端能不能以 Event 作为唯一事实？","priority":"P1","category":"solidity","tags":["Storage","Reorg","交易处理","索引"],"answer":"**参考答案：** Event 属交易 receipt/log，便于链下索引检索，`indexed` 字段进入 topics（动态类型通常经哈希编码），但**合约本身不能直接读取历史事件**。Storage 是链上当前可访问状态，读写贵但可被业务逻辑约束。事件在 revert 交易中不会保留为规范链有效结果；被 reorg 移除的事件要被索引器撤销。\n\n后端应保留 `chainId, blockHash, blockNumber, txHash, logIndex, contractAddress`，必要时定期用 `eth_call`/状态证明校验，而不是收到 WebSocket 推送就视作永久到账。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S16","title":"链上随机数为什么难？`block.timestamp`、`blockhash` 安全吗？","priority":"P1","category":"solidity","tags":["交易处理","安全","链上"],"answer":"**参考答案：** 区块构建者/验证者能对部分区块字段或交易排序施加影响，单纯 `block.timestamp`、当前块可控数据或可预测的上一块哈希不适合高价值抽奖随机数。Commit-reveal 可减少单方预知，但存在最后揭示者选择不揭示的偏置与可用性问题；可引入罚没、超时和重开协议。\n\n可验证随机函数（VRF）提供可验证随机结果，但要分析预言机依赖、callback 失败、延迟、重试和跨链来源。随机性与公平交易排序是两个不同问题。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S17","title":"`CREATE2` 的地址如何决定？有哪些部署和安全注意事项？","priority":"P1","category":"solidity","tags":["Nonce","安全"],"answer":"**参考答案：** `CREATE2` 地址由部署者地址、salt 与**init code 哈希**推导，因此可在部署前预测地址，适合账户抽象钱包/工厂模式。注意地址与 init code/构造参数相关，别把 runtime bytecode 哈希直接代替 init code；同地址已存在代码或 nonce 非零的部署通常会失败。\n\n部署前已有资产打入预测地址，需要确保 init code 不被替换或抢占；同时现代 EVM 对 `SELFDESTRUCT` 的语义已收紧，不应照搬旧时代“自毁再部署同地址合约”的 metamorphic 技巧。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S18","title":"ERC-721、ERC-1155、ERC-4626 的复杂攻击面有哪些？","priority":"P1","category":"solidity","tags":["Gas","安全","重入"],"answer":"**参考答案：** ERC-721 的 `safeTransferFrom` 和 ERC-1155 的安全接收钩子会执行接收者回调，因此需要处理跨合约/跨方法重入；批量铸造/转移应防止 Gas DoS。ERC-4626 vault 的份额兑换需关注舍入方向、空池首次存入时的捐赠/膨胀攻击、预言机和底层资产 rebasing/手续费语义。\n\n一个高级答案不仅能说出标准接口，还要指出“调用了不可信 token/nft 合约即交出了控制权”，不能因为遵循 ERC 就假设安全。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"S19","title":"怎样建立智能合约从编码到上线的安全验证链路？","priority":"P0","category":"solidity","tags":["安全","链上"],"answer":"**参考答案：** 定义关键不变式（总资产≥总负债、无授权用户不能转出、token accounting 保守等），用 Foundry/Hardhat 写单元测试、分叉测试、状态机 fuzz 和 invariant 测试；结合 Slither 等静态分析以及必要的形式化验证/独立审计。上线前测试多签权限、代理升级、暂停/解除暂停、治理延迟与紧急撤离方案。\n\nAudit 报告是某一版本、某一范围的评估，不是无限期保险；部署字节码/编译器版本/constructor 参数/代理指向必须可复现和验证。发生异常后应有链上事件监控、资金出入限制和明确的应急 runbook。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B01","title":"PoW 与 PoS 的安全性和最终性有什么本质区别？","priority":"P0","category":"web3","tags":["交易处理","安全"],"answer":"**参考答案：** PoW 通常通过累计工作量选择链，确认数越多交易被重组的成本越高，属于概率性最终性；以太坊 PoS 使用出块、验证者投票、fork choice（LMD-GHOST）和 Casper FFG checkpoint，实现经济最终性。PoS finalized 被回滚意味着极严重的共识安全事故与大规模验证者罚没，不能只把它理解为“等 N 个块”。\n\n对业务来说，`head/latest`、`safe`、`finalized` 是不同的信任层级；L2 的 sequencer 确认、L1 发布和可提现最终性又是不同时间尺度。设计入账阈值必须以具体链的共识模型为准。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B02","title":"一笔 EVM 交易从用户提交到最终确认经历哪些状态？","priority":"P0","category":"web3","tags":["Reorg","Nonce","Gas","交易处理"],"answer":"**参考答案：** 本地构建交易（chainId、nonce、to/value/data、gas 参数）→私钥签名→RPC 接收/广播→mempool 等待→被打包进区块→receipt 显示成功/失败→经历可能的 reorg→到达安全或 finalized 状态。`eth_sendRawTransaction` 返回 hash 只证明节点接受/识别交易，并不保证进链；receipt `status=1` 只代表**该次 EVM 执行未 revert**，也不证明合约的业务预期完全达成。\n\n交易可能长时间 pending、被替换、被丢弃、执行失败或在 reorg 后重新进入 mempool。后端应显式建状态机，而不是 `sent=true` 后直接标记资产到账。","diagram":"tx","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B03","title":"EIP-1559 的 Gas 定价是什么？`gasLimit` 和 `maxFeePerGas` 的关系？","priority":"P0","category":"web3","tags":["Gas","EIP","交易处理"],"answer":"**参考答案：** 在适用 EIP-1559 的交易类型里，`baseFeePerGas` 随区块拥堵调整并被销毁；`maxPriorityFeePerGas` 约束小费；`maxFeePerGas` 是愿意支付的单 gas 最高价格。通常有效 gas 单价约为 `min(maxFeePerGas, baseFeePerGas+maxPriorityFeePerGas)`（以实际链规则和交易类型为准）；交易付费是实际 gasUsed × effectiveGasPrice，而不是默认支付 gasLimit × maxFee。\n\n`gasLimit` 是执行预算上限，不等于保证执行成功；gas 估算依赖当前状态，状态变化/竞价策略/具体代码路径可能导致失败。Blob 交易还有独立的数据 gas 市场，不能把 blob fee 简化成普通 execution gas。","diagram":"gas","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B04","title":"一个热钱包每秒发 1000 笔交易，如何管理 nonce？","priority":"P0","category":"web3","tags":["Nonce","交易处理"],"answer":"**参考答案：** 同一 EOA 的 nonce 是顺序消费的：交易 `n+1` 通常需要 `n` 先被纳入才能执行，因此单地址具有不可避免的顺序约束。可靠方案以数据库为**可恢复的 nonce 分配权威**，对单地址分区/租约排队，持久化 `nonce, request_id, tx_payload_hash, raw_tx, tx_hash, status`；同一 nonce 可能多次加价替换，但这些 hash 代表**同一 nonce 槽位**。\n\n重启后要对账 `latest`、`pending` 交易计数和本地未决请求，不能简单每次 `eth_getTransactionCount(pending)` 再加一，多个实例会碰撞；遇到 stuck nonce 要用同 nonce 适当提高 gas 价格替换或发送自转账取消，但不能悄悄丢掉对应业务意图。","diagram":"tx","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B05","title":"什么是 Reorg？为什么监听 `Transfer` Event 仍可能造成重复充值或凭空到账？","priority":"P0","category":"web3","tags":["Reorg","交易处理","索引"],"answer":"**参考答案：** Reorg 指原先被节点接受的区块被另一条规范链替换；旧块的 logs/receipts 可能被移除，某笔交易可能被重新打包到新块，交易 hash 不变而 block hash/log 索引和执行结果可能变化。WebSocket 上某些 log 通知可能带 `removed=true`，但不能只依赖推送保证不漏。\n\n索引器必须持久保存高度、block hash、parent hash，发现父块不连续时找到共同祖先；把旧块衍生的业务记录标记 orphan/reverted，再按新规范链重放。金融业务可以先标记 `observed/pending`，达到风控确认或 `finalized` 再转为可用余额；撤销账务建议用可审计冲正流水而不是无痕删除。","diagram":"reorg","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B06","title":"怎样设计不漏、不重、可回滚的链上事件索引器？","priority":"P0","category":"web3","tags":["Reorg","交易处理","事务","索引"],"answer":"**参考答案：** 核心组件：按链持久化 cursor → 通过 RPC 批量 `eth_getBlockByNumber`/`eth_getLogs` 拉取 → 验证连续父 hash → 在 MySQL 事务中保存区块、交易/日志和业务事件 → 更新 cursor。事件唯一标识应包含 `chainId, blockHash, txHash, logIndex`（或其他可证明唯一的规范化坐标），不能单用 txHash，因为一笔交易可有多条同类事件、reorg 后日志位置可改变。\n\nWebSocket 用于低延迟通知，**HTTP 拉块补偿是可靠性的底座**；按 provider 的 `eth_getLogs` 范围/结果限制动态分窗，处理重试、限速、重启断点、ABI 版本升级以及重扫幂等。要明确库里存的是所有观测到的 fork 还是仅规范链及冲正记录。","diagram":"reorg","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B07","title":"何时以区块确认数入账，何时使用 `safe`/`finalized`？","priority":"P0","category":"web3","tags":["Reorg","安全","链上"],"answer":"**参考答案：** 固定确认数是按经验估计 reorg 风险，不同链上并不等价；以太坊等支持标准最终性标签的链上，`safe`/`finalized` 提供更直接的共识层语义，但不同节点、L2、侧链可能不支持或含义不同。大额/高风险资产可以等 finalized，小额体验需求可先展示临时到账但暂不可提现。\n\n面试时给出**风险梯度**：观测到账（可展示）→安全确认（部分功能）→最终确认（可提现/结算）。链上最终性也不能替代本地 DB 入账原子性及业务风控。","diagram":"reorg","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B08","title":"如何设计中心化平台的充值入账流程？","priority":"P0","category":"web3","tags":["Reorg","事务","索引"],"answer":"**参考答案：** 先维护受支持 `chainId + tokenContract` 白名单、账户地址映射以及到账来源规则；索引候选入金事件/原生转账 → 校验规范链、合约地址与资产精度 → 等确认阈值 → 使用确定性的 `deposit_event_id` 在数据库事务中写入不可变账务流水和余额变更 → 发布 outbox 通知。重复扫描不会重复入账；Reorg 用状态回滚/冲正路径。\n\n还要考虑同一个 ERC-20 `Transfer` 事件并非所有资产转移语义的充分证据（非标准代币/伪造 token/代理变更）；合约地址、网络 ID 和业务白名单比只看 symbol/name 可靠得多。资产明细与总账要能定期自动对账。","diagram":"reorg","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B09","title":"如何设计安全的提现系统？","priority":"P0","category":"web3","tags":["Nonce","交易处理","安全","链上"],"answer":"**参考答案：** 分成请求/鉴权风控 → DB 冻结可用余额 → 提现状态机与审批额度 → nonce/地址队列 → 签名与广播 → receipt/最终性确认 → 完成/失败解冻或补偿。热钱包签名必须与业务 API 分权，采用 KMS/HSM/MPC、白名单、限额、审计和最小权限；不能把私钥直接放在普通 Pod 环境变量中。\n\n链上广播超时的状态为未知：先用 tx hash/raw tx/nonce 查询，再决定是否重播同签名交易或替换；绝不因超时简单生成一个**新 nonce**的重复提现。资金流水需要资产守恒：冻结、扣减、手续费、退款都有可审计分录。","diagram":"tx","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B10","title":"为什么 Web3 后端应使用双分录账本而非简单修改 `user.balance`？","priority":"P0","category":"web3","tags":["交易处理","事务","链上"],"answer":"**参考答案：** 简单余额字段难以解释每次变动的来源、逆向修复错误入账及证明资金守恒。双分录账本把每次价值移动同时记录借方/贷方账户，保持总分录平衡，账户可用余额、冻结余额、平台在链资产、手续费收入等明确拆分。流水带 `source_event_id`、币种/链、幂等键、状态和关联凭证，更新在一笔 DB 事务内完成。\n\n业务余额可以是从流水投影出的物化结果，但要提供历史重算和对账机制。**链上交易完成与平台内部账本完成不能靠一次远程调用建立分布式原子性**，必须用状态机和补偿。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B11","title":"怎样对账链上余额、用户余额、热钱包与冷钱包？","priority":"P1","category":"web3","tags":["Gas","事务","链上"],"answer":"**参考答案：** 先统一按 `chainId + assetContract + decimals + account` 建资产标识，分解为链上托管总余额、内部客户负债、冻结/待确认/待提现、平台自有资产及已计提手续费。对账时以一致的链高度/最终性视图取链上余额，以事务快照/账本流水序号取内部状态，避免不同时间点比较制造假差异。\n\n差异按漏扫充值、重复入账、失败提现未解冻、gas 补充、内部划拨、手续费/非标准 token 行为分类，形成可追溯差错单；不得简单覆盖数据库余额以“修复”差异。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B12","title":"RPC 服务商不稳定时，怎样做多 Provider 容灾而不读到不一致数据？","priority":"P0","category":"web3","tags":["Nonce","交易处理","索引","RPC"],"answer":"**参考答案：** 各 Provider 的 latest 高度、同步进度、可用历史、`getLogs` 限制及 mempool 可见性可能不同。应按 `chainId/genesisHash` 验证网络，对每个 provider 监控头高度、延迟、错误率、最终高度、日志完整性；写 RPC 可多播同一已签名 raw transaction，但不能多次生成不同 nonce 的业务交易。\n\n历史索引用**明确块号与块 hash**比对而非仅问 latest；多个 provider 给出冲突结果时应暂停敏感入账或与自建节点核验。客户端需要退避、限流、熔断，避免故障时所有请求切到唯一备用节点形成雪崩。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B13","title":"全节点、归档节点、轻节点、索引服务的职责分别是什么？","priority":"P1","category":"web3","tags":["Storage","索引"],"answer":"**参考答案：** 全节点验证共识与执行规则并维护访问当前链状态所需数据，具体可访问的历史取决于客户端和裁剪配置；归档能力一般额外保留大量历史状态，以支持“在任意旧区块查询过去账户/合约 storage”；第三方 indexer 对日志和合约语义构建高效查询索引；轻客户端依赖加密证明等方式减少自行存储和验证负担。\n\n`eth_getLogs` 查询历史日志不必然要求完整历史状态归档，但老区块的 `eth_call`/状态查询可能需要 archive 服务。不要把“能查历史日志”误写成“必须 archive node”。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B14","title":"Merkle Patricia Trie、状态根、交易根、收据根分别证明什么？","priority":"P1","category":"web3","tags":["Trie","Proof","交易处理","RPC"],"answer":"**参考答案：** Ethereum 传统执行层用 Merkle Patricia Trie（不同升级阶段的数据结构可能演进）承诺账户/存储等状态；区块头包含状态根、交易根、receipt 根等承诺，允许借助包含路径证明特定数据与给定区块头一致。收据包含执行结果与日志，但一个 RPC 返回的 JSON 并非自带可信性证明。\n\n要通过状态证明真正建立信任，还需要可信区块头/共识验证和正确的证明验证逻辑；从未经验证的中心化 RPC 得到的同一个哈希和 proof，仍无法独立证明链头真实性。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B15","title":"ABI 编解码和 Event Topic 设计时容易踩哪些坑？","priority":"P0","category":"web3","tags":[],"answer":"**参考答案：** Function selector 是规范函数签名 Keccak-256 摘要的前 4 字节，调用数据包括 selector + ABI 编码参数；标准 event 的 topic0 是事件签名摘要，匿名事件规则不同。`indexed` 的静态参数可从 topics 直接解析，动态类型通常使用哈希，不能像普通字符串那样从 topic 还原原文。\n\n合约升级可能新增/重载事件或改变 ABI；后端需要基于合约地址与生效高度管理 ABI 版本。Keccak-256 与标准 SHA3-256 并非简单可互换。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B16","title":"EIP-4337 Account Abstraction 的核心参与方及安全风险是什么？","priority":"P0","category":"web3","tags":["Nonce","Gas","EIP","交易处理"],"answer":"**参考答案：** 用户签署的是 `UserOperation`，Bundler 收集并通过 EntryPoint 提交到链上，智能账户执行签名/权限校验，Paymaster 可为其支付 gas，Factory 可部署新账户。AA 支持批量调用、Gas 赞助、自定义签名策略，但也引入 bundler 模拟、验证 DoS、paymaster 资金耗尽、签名重放与账户模块升级风险。\n\n`UserOperation` 不是普通 EOA 链上交易；回执、hash、nonce 结构及不同 EntryPoint 版本要区分，不能只把它当 `eth_sendRawTransaction` 的别名。签名应绑定 chainId、EntryPoint、nonce 和操作内容。","diagram":"l2","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B17","title":"EIP-7702 和 ERC-4337 如何区分？给钱包后端带来什么变化？","priority":"P1","category":"web3","tags":["EIP","交易处理"],"answer":"**参考答案：** ERC-4337 是通过 EntryPoint/Bundler 支持智能账户的交易编排标准；EIP-7702 是协议级新交易类型，让 EOA 用签名授权持久设置执行代码的委托指示器。两者可结合，但并不等价。7702 的委托逻辑可能拥有该 EOA 的广泛执行权限，授权对象代码的升级/初始化与撤销路径必须审计。\n\n后端账户画像不能再以“这个地址此前是 EOA”推断未来永远没有合约逻辑；签名验证、代码探测、交易模拟和风控应考虑 7702 授权交易的状态变化。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B18","title":"Optimistic Rollup 与 ZK Rollup 的安全和取款体验有何差异？","priority":"P1","category":"web3","tags":["安全"],"answer":"**参考答案：** Optimistic Rollup 通常依赖欺诈证明与挑战期确保有机会纠正错误状态，L2 到 L1 的规范取款往往受挑战窗口影响；ZK Rollup 通过在 L1 验证有效性证明确认计算正确性，但证明生成、数据可用性和跨链消息最终确定仍要时间。两者的安全假设、升级管理与逃生机制也依具体协议变化。\n\nSequencer 的“软确认”不是 L1 终局；中心化 sequencer 可能宕机、审查或重组 L2 软确认。生产系统要为每条链分别定义 `seen / sequenced / L1-posted / proven(or challenged) / finalized` 风险状态。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B19","title":"EIP-4844 Blob 的意义是什么？为什么它不是永久链上存储？","priority":"P1","category":"web3","tags":["Storage","Gas","EIP","交易处理"],"answer":"**参考答案：** Blob 引入独立于执行 gas 的数据定价与短期数据可用性，为 Rollup 批量交易数据发布降低成本。它不直接作为可由 EVM 任意读取的永久 storage；数据保留有指定窗口（最初约 18 天），历史归档/探索服务必须另行保存。\n\nBlob 降低的是数据发布成本，不自动等于 L2 交易最终确定、隐私保护或抗审查全部得到解决。对 Rollup/跨链后端，要分清 L2 本地确认、数据是否已上 L1、证明/争议是否结束。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B20","title":"跨链桥为什么是高危系统？信任边界在哪里？","priority":"P1","category":"web3","tags":["Nonce","安全"],"answer":"**参考答案：** 跨链桥通常验证另一条链的某种状态/事件后在目标链释放或铸造资产；真正的难点是来源链最终性、跨链消息唯一性、证明验证、重放保护、限额、升级权限和验证者/多签密钥安全。若仅信任一个中心化 relayer 的“见到充值日志”，就把所有桥接资产押在它的正确性上。\n\n严格记录 `sourceChain, sourceBlockHash, txHash, logIndex, messageNonce, destinationChain`，仅在满足来源最终性条件后执行；跨链消息只能消费一次且要支持源 reorg、目标链执行失败与补偿。资产 escrow 与 wrapped asset 的供应要持续对账。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"B21","title":"如何在 Go 后端中用以太坊签名和合约调用保证安全？","priority":"P1","category":"web3","tags":["Nonce","Gas","EIP","安全"],"answer":"**参考答案：** Go-ethereum 常用于构建 ABI、签名 EIP-1559/typed tx、模拟 `eth_call`、估 gas、发送和查询 receipt。所有输入必须校验 `chainId`、目标合约地址、函数 ABI、金额单位、nonce 状态与签名账户；不要用浮点数表示 Wei/Token 最小单位，用 `big.Int` 或明确 decimal 表达。\n\nRPC 的 `eth_estimateGas`/`eth_call` 是基于特定区块状态的模拟，不是执行承诺；签名服务要隔离密钥、请求授权与可执行交易白名单。ABI 一经升级，后端解析、事件消费和交易构建要协调灰度。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E01","title":"以太坊经典“三棵树”具体是哪三棵？为什么一个区块需要三个 Root？","priority":"P0","category":"ethereum","tags":["MPT","Trie","交易处理"],"answer":"**参考答案：** 经典三棵树是**全局状态树（State Trie）**、**区块交易树（Transactions Trie）**、**区块收据树（Receipts Trie）**。区块头分别保存 `stateRoot`、`transactionsRoot`、`receiptsRoot`。三者采用相似的 MPT 承诺机制，回答的却是不同问题：这个区块结束后的账户状态是什么？这个区块按什么顺序包含了哪些交易？这些交易形成了哪些执行结果与日志？\n\n状态树是全网账户的全局数据结构，随着执行新区块而改变其根；交易树、收据树则按区块各自构建。账户状态中的 `storageRoot` 又指向该账户的 Storage Trie，因此“三棵树”只是**区块头三个经典根承诺**，不能理解成“整条链只有三棵树”。\n\n面试里最有价值的一句：**交易被纳入区块 ≠ 执行成功；执行成功 ≠ 状态已最终确定；RPC 返回数据 ≠ 独立证明可信**。交易根、收据根、状态根、共识最终性分别解决其中一部分问题。\n\n**追问：** 区块中的交易顺序调换了，但交易集合不变，交易根会不会变？会，因为键使用交易索引，根承诺的是有序交易；状态根也可能因状态依赖和执行顺序改变而变化。反过来，两种交易执行安排可能碰巧得到相同状态根，也不代表交易根相同。","diagram":"trie","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E02","title":"MPT 和普通 Merkle Tree / Trie / Patricia Trie 有何区别？请画出节点类型。","priority":"P0","category":"ethereum","tags":["MPT","Trie","索引"],"answer":"**参考答案：** Merkle Tree 的重点是由子节点哈希形成可验证承诺；Trie（前缀树）的重点是按键的前缀逐步查找；Patricia Trie 把没有分叉的路径压缩。Ethereum 经典 MPT 综合了**16 叉前缀索引 + 路径压缩 + 哈希承诺**。\n\nMPT 的核心节点有三类：`Branch` 节点包含 16 个按 nibble（半字节，0～f）选择的子指针外加第 17 个可选终止值；`Extension` 节点保存一段共享路径和下一节点引用；`Leaf` 节点保存剩余路径及最终值。空节点表示无数据。一个 `bytes32` 键通常表示 64 个 nibbles，而不是 32 个二叉分支。\n\n路径压缩避免对长串公共前缀逐层建节点。更新某条路径只需重建受影响的节点，子树未变化时可复用它们的哈希，但这不意味着实现层面的查询、磁盘 I/O 永远是 O(log N)：哈希散布、缓存命中、数据库 compaction 和证明大小都影响实际性能。\n\n**追问：** 如果两个状态里有完全相同的地址余额，`stateRoot` 一定相同吗？不一定，根承诺**全部账户和 storage 状态**，其他账户或合约槽位不同也会改变根。","diagram":"mpt","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E03","title":"什么是 Hex-Prefix（HP）编码、RLP 编码？MPT 为什么还要“短节点内联”？","priority":"P0","category":"ethereum","tags":["MPT","交易处理"],"answer":"**参考答案：** RLP（Recursive Length Prefix）解决的是执行层中**嵌套字节串/列表如何规范序列化**，并不自行表达“这是一个地址/这是一个哈希”的类型语义。整数按规范最短大端表示；特别地，整数 0 的 RLP 编码是 `0x80`，而不是 `0x00`。因此交易树里 `RLP(index=0)` 不能草率地写成 `0x00`。\n\nHP（compact）编码解决 Leaf/Extension 节点路径按 nibble 编码时的**奇偶长度和终止标志**问题：首个半字节标记扩展/叶节点及路径长度奇偶，消除类似 `0x1` 和 `0x01` 路径之间的歧义。\n\n子节点引用还有一条容易被忽略的规则：**节点的 RLP 编码长度小于 32 字节时，可以直接内联其编码；否则引用节点的 Keccak-256 哈希**。根对外仍有固定的哈希承诺。写自己的证明验证器时，若无脑将每个孩子都当成 32 字节哈希，可能直接验证失败。\n\n**追问：** RLP 与 ABI 编码能互换吗？不能。RLP 用于执行层 Trie/交易/区块等底层对象的规范序列化；ABI 用于 EVM 合约函数参数、返回值和 Event 数据编码，动态偏移规则完全不同。","diagram":"mpt","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E04","title":"为什么状态树的 Key 是 `keccak256(address)`，不是原始 Address？什么是 Secure Trie？","priority":"P1","category":"ethereum","tags":["MPT","Storage","Trie"],"answer":"**参考答案：** 账户地址原本只有 20 字节；经典状态树首先把地址做 Keccak-256，作为 MPT 的逻辑路径。存储树也对 32 字节的槽位键再次 Keccak-256 以形成 Trie 路径。这样做将原始键映射为固定长度、近似均匀分布的哈希路径，减轻刻意构造长共享前缀带来的结构偏斜与某些恶意输入风险；但代价是键不再天然支持原始地址的顺序扫描。\n\n一定要区分两层哈希：**Solidity 的 `mapping` 先按布局规则计算逻辑 Slot，Storage Trie 再哈希这个 Slot 作为树路径。** 例如 `mapping(address => uint256) balances` 的成员键计算为 `keccak256(pad32(user) || pad32(p))`，这个结果是要传给 `eth_getStorageAt` 的 **slot**；而 Storage Trie 对该 Slot 使用的路径是 `keccak256(slot)`。\n\n**追问：** 为什么不能拿 `eth_getStorageAt(address, keccak256(slot))` 查询 mapping 值？因为它要求的是**合约逻辑槽位索引**，不是内部 Storage Trie 再次哈希后的路径。","diagram":"storage","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E05","title":"Ethereum Account 里究竟有什么？EOA 与合约账户怎么存？","priority":"P0","category":"ethereum","tags":["Storage","Nonce","交易处理"],"answer":"**参考答案：** 经典账户状态是一个按顺序 RLP 编码的四元组：`[nonce, balance, storageRoot, codeHash]`。全局状态树的 Key 是 `keccak256(20-byte address)`，Value 是此四元组的 RLP。`balance` 用 Wei；`nonce` 在普通交易发送账户上用于顺序与重放控制，合约账户的 nonce 还与创建行为等协议规则相关。\n\n**合约 Bytecode 不直接放在账户四元组里**。账户仅保存 `codeHash`，代码内容在客户端状态数据库中可通过该哈希关联获取；`storageRoot` 指向该账户的存储树。对于没有代码的普通账户，代码哈希对应空字节串的 Keccak-256，而不是 `0x00`。未初始化的 Storage Trie 则有特定的空树根。\n\n升级代理的一个经典考题：调用者访问的是 Proxy 地址，状态存在 Proxy 的 Storage Trie；在 `delegatecall` 下执行的是 Implementation 代码，因而**状态承诺跟随代理账户，而不是实现合约账户**。\n\n**追问：** EIP-7702 后，能否仍根据“EOA”断言 `codeHash` 必定是空代码哈希？不能。协议级代码委托使“一个地址属于哪种账户”的工程假设发生变化，必须按目标链分叉和账户当前代码状态判断。","diagram":"trie","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E06","title":"Storage Trie 究竟存什么？为什么 Solidity 变量 Slot 不等于 Trie 路径？","priority":"P0","category":"ethereum","tags":["Storage","Trie","索引"],"answer":"**参考答案：** 对于持久合约存储，EVM 对外呈现一个从 256 位槽位索引到 256 位值的键值空间。经典 Storage Trie 的路径是 `keccak256(slot32)`，值是整数的规范 RLP 编码（不是固定 32 字节的原始数组，也不是 ABI 编码）。零值槽通常不会作为普通显式键值存在于该存储树中。\n\n状态树账户记录 `storageRoot`，因此如果 `SSTORE` 改变逻辑槽位，可能引起 Storage Trie 对应路径的节点变化、`storageRoot` 更新、账户节点变化，最终全局 `stateRoot` 更新。注意 `SSTORE` 会受 Gas、Revert、EVM 调用帧影响，并非执行过这个 opcode 就一定提交新状态。\n\n**追问：** 查询过去区块中的某个变量，可以直接用 `eth_getStorageAt` 加旧高度吗？RPC 语义上可以指定历史区块，但节点必须保留或能重建相应历史状态；非归档配置可能不具备所需历史 State。","diagram":"storage","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E07","title":"请从 Solidity 源码手推 `mapping`、嵌套 `mapping`、动态数组的 Storage Slot。","priority":"P0","category":"ethereum","tags":["Storage"],"answer":"**参考答案：** 假设以下是合约的最初状态变量，且没有继承引入的前置布局、命名空间 storage 或编译器特殊布局：\n\n```solidity\ncontract Vault {\n    uint256 public total;                         // slot 0\n    mapping(address => uint256) public balance;   // 声明位置 slot 1\n    mapping(address => mapping(uint256 => uint256)) public allowance; // slot 2\n    uint256[] public amounts;                      // 长度在 slot 3\n}\n```\n\n- `balance[a]` 的逻辑位置：`keccak256(pad32(a) || pad32(1))`。\n- `allowance[a][id]`：先算 `x = keccak256(pad32(a) || pad32(2))`，再算 `keccak256(pad32(id) || x)`。\n- `amounts.length` 在 slot `3`；`amounts[i]` （元素 32 字节、无打包）位于 `keccak256(pad32(3)) + i`（按 256 位槽位加法）。\n\n这里使用的是按 storage 布局拼接固定宽度字节的 Keccak-256，**不是** `abi.encodePacked` 任意参数排列；对于 address 和 uint256 的对应编码，`abi.encode(a, p)` 可以提供 32 字节对齐的效果。最终拿到的 Slot 再由 Storage Trie 层计算 `keccak256(slot)`。如果要证明某个值存在，必须依次验证**账户状态证明 + 账户存储证明**。\n\n**追问：** 代理实现升级后把变量声明顺序调换会怎样？如果不遵循兼容的布局约束，相同 Slot 被不同变量重解释，可能导致余额/管理员地址等关键数据读错；需做精确 storage layout diff，而不能只看 Solidity 代码能否编译。","diagram":"storage","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E08","title":"Solidity Storage Packing 怎么运作？为什么要考虑代理升级和 Slot 冲突？","priority":"P0","category":"ethereum","tags":["Storage","Gas"],"answer":"**参考答案：** 能放进同一个 32 字节 Slot 的若干小值类型通常按声明顺序打包；结构体、动态类型、数组和继承链还会影响插槽分配。比如 `uint128 a; uint128 b;` 在常见布局下同处一个槽位，`uint256 c` 再占一槽。若 `a` 与 `b` 被分别修改，编译器可能需要执行读—掩码—改写，这会影响 Gas，并可能增加跨函数共享槽位的复杂度。\n\n动态数组在声明槽位保存长度，数据起点通常从 `keccak256(pad32(p))` 推导；mapping 声明位置起到“命名空间盐值”的作用，本身不直接存全部键值。字符串和 `bytes` 又有短数据内联/长数据外置等特殊编码，不能机械套用数组规则。\n\n升级合约如果通过 `delegatecall` 共享 Proxy Storage，必须保留已有变量语义、继承布局和特殊槽位约定（如 ERC-1967）。工程上以编译器 `storageLayout` 输出与升级工具校验为准，不应靠手算就断言安全。","diagram":"storage","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E09","title":"Transaction Trie 的 Key 为什么是 RLP(index) 而不是 TxHash？Type-2/3/4 交易如何参与计算？","priority":"P0","category":"ethereum","tags":["Trie","EIP","交易处理","索引"],"answer":"**参考答案：** 每个区块独立构建交易 Trie，Key 是**交易在该区块的位置索引的 RLP 编码**，Value 是交易按协议规定的序列化字节。这个设计让 `transactionsRoot` 承诺**有序列表**：同样的交易集合换顺序会改变 Key-Value 的对应关系，通常也改变根。\n\n对于 Legacy 交易，Value 是传统的 RLP 交易；在 EIP-2718 Typed Transaction Envelope 下，Value 是 `typeByte || transactionPayload`（具体 Payload 取决于类型，常见类型有 1/2/3/4）。注意**不是**把整个 `typeByte || payload` 再额外包一层 RLP 当作 Value。交易哈希通常是该规范交易序列化字节的 Keccak-256 摘要，但它不是 Trie Key。\n\n**追问：** 拿到 TxHash 就能证明交易上链吗？不能。TxHash 只标识交易内容，证明某笔交易被某块包含需要交易内容、索引、该块交易 Trie 的包含证明以及可信区块头；实际服务往往通过独立验证节点获取这一事实，而不是自行构造全部证明。","diagram":"trie","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E10","title":"Receipts Trie 存了什么？`status`、`cumulativeGasUsed` 与 `gasUsed` 怎么区分？","priority":"P0","category":"ethereum","tags":["Trie","Gas","EIP","交易处理"],"answer":"**参考答案：** 收据树和交易树一样按 `RLP(txIndex)` 建键。现代 Legacy Receipt 的核心共识编码结构是 `[status, cumulativeGasUsed, logsBloom, logs]`；Typed Receipt 的编码是 `typeByte || receiptPayload`。`status=1/0` 表示顶层交易执行成功/失败（来自 EIP-658 之后的语义），不等于“业务所有意图成功”——合约可能捕获内部调用失败后继续返回成功。\n\n`cumulativeGasUsed` 是**从区块第一笔交易到当前交易为止**的累计执行 Gas，单笔 `gasUsed` 可由相邻累计值之差推得（首笔直接取累计值）。RPC Receipt 通常还额外展示 `transactionHash`、`blockNumber`、`transactionIndex`、`effectiveGasPrice` 等便于检索的派生元数据，**这些字段不应统统当作 Receipt Trie 中的原始四字段**。\n\n收据中的 `logs` 承载 Event：日志的地址、topics、data 由执行产生；如果顶层交易 Revert，它的日志同样回滚，不会作为该交易有效日志出现在最终收据里。\n\n**追问：** 为什么标准 `eth_getTransactionReceipt` 返回的 JSON 不能直接 Hash 后和 `receiptsRoot` 对比？RPC JSON 是展示对象，不是规范的共识收据编码，而且 `receiptsRoot` 是整棵 Trie 根而不是单笔收据 Hash。","diagram":"trie","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E11","title":"能否通过 `receiptsRoot` 独立证明 ERC-20 `Transfer` Event 真的发生？","priority":"P0","category":"ethereum","tags":["Trie","Proof","交易处理","索引"],"answer":"**参考答案：** 可以建立**被特定区块执行收据承诺**的证明链，但不能仅凭浏览器页面或普通 RPC Logs JSON 就说已经完成密码学验证：\n\n1. 取得并验证一个可信的执行区块头（或从已验证的共识层锚定该头），拿到 `receiptsRoot`。\n2. 取得目标交易在该块中的 `transactionIndex`、对应**规范编码的收据**，并取得该索引的 Receipt Trie Merkle Patricia Proof。\n3. 用 `RLP(txIndex)` 沿 Proof 验证到 `receiptsRoot`，再解码收据，检查 `status`、真实的发出日志的 `address`、`topics`、`data` 等。\n4. 在跨链桥或充值场景，仍必须再验证该块处于期望的规范链/安全或最终确定状态；事件证明只证明**某块中含该日志**，不替代对链本身的信任和共识验证。\n\n普通 Ethereum JSON-RPC 没有一个通用且必然可用的 `eth_getReceiptProof` 标准接口；工程上可通过可信自建节点、相关客户端支持的证明接口，或拉取区块收据重建 Trie/生成证明。`Transfer` 事件也不自动证明代币遵循标准价值语义，恶意 token 能随意构造日志。\n\n**追问：** 仅有 `blockHash + txHash + logIndex` 就是 Proof 吗？不是，那是引用/定位元数据，不包含 MPT 验证路径，也不确保块头可信。","diagram":"proof","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E12","title":"`eth_getProof`（EIP-1186）怎样证明账户余额和 Mapping Slot？能否证明“不存在”？","priority":"P0","category":"ethereum","tags":["Storage","Trie","Proof","EIP"],"answer":"**参考答案：** `eth_getProof(address, [slotKeys], block)` 返回账户四元组相关字段、`accountProof` 以及针对各指定槽位的 `storageProof`。验证账户时从可信 `stateRoot` 出发，使用 `keccak256(address)` 作为路径验证 RLP 账户值；取出经过验证的 `storageRoot`，再以 `keccak256(pad32(logicalSlot))` 作为存储 Trie 路径验证槽位的 RLP 值。查询的是**同一个确定区块**，否则账户证明和存储证明可能锚在不同状态上。\n\nMPT 还支持**不存在性证明**：沿真实路径遇到空分支、叶节点路径不匹配、扩展节点无法匹配等，可以证明一个键在该承诺下不存在。对存储逻辑层的未写入槽位，读取语义一般表现为 0；证明验证器要正确区分“Trie 缺项”和“接口返回数值 0”。\n\n最关键的信任边界：如果 `stateRoot` 和 `accountProof` 都来自同一个未经验证的恶意 RPC，它完全可以编造一套自洽假数据。**Proof 只能把值绑定到根，不能自动证明根属于真实规范链。**\n\n**追问：** 证明中发现 `storageProof` 对不上 `storageRoot`，首先检查什么？是否使用了**计算出的原始 Slot**而不是二次哈希的 Trie Key 去请求 RPC；区块号/哈希是否一致；是否错误地使用了 Keccak 与标准 SHA3；是否误用了 ABI/RLP 编码。\n\n---","diagram":"proof","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E13","title":"为什么说 EVM 本质上是“确定性状态机”？一个节点如何验证 `stateRoot`？","priority":"P0","category":"ethereum","tags":["Nonce","Gas","交易处理"],"answer":"**参考答案：** 执行层的核心抽象可写成 `S' = Υ(S, T, blockContext)`：给定上一有效状态、按序排列的有效交易以及区块环境（例如时间戳、费用、提议者相关值），所有遵守相同协议分叉规则的执行客户端应得到相同的新状态与收据集合。EVM 是其中执行智能合约字节码的确定性栈机，状态转换规则还包含非合约的交易验证、费用、余额转移和分叉规定的系统级变更。\n\n验证流程：先确认父块和执行所用前状态；逐笔验证交易签名、chainId、nonce、资金和 Gas 约束；按顺序执行（包括内部调用、日志、Gas 计量、回滚）；应用该分叉规定的系统级状态操作；计算最终 `stateRoot`、所有交易的 `transactionsRoot` 与收据的 `receiptsRoot`，与块头值比较。任何不一致都意味着这个执行区块不能作为有效执行结果接受。\n\n要区分**计算有效性**和**共识选链**：执行客户端能判断候选块的执行规则是否正确，不能单凭自己重新执行就决定哪个竞争分叉已获得 PoS 最终性；共识客户端负责投票与选链。独立验证还依赖正确的软件、上游锚点和网络数据可用性。\n\n**追问：** 区块 `transactionsRoot`、`receiptsRoot` 都没变，`stateRoot` 却变了，一定无效吗？必须看相同前状态、共识上下文与分叉规则；如果同一个区块头只被人为改了状态根且无法重现，就是无效。系统级状态变更不能被忽略。","diagram":"evm","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E14","title":"EVM 的 Stack、Memory、Storage、Calldata、Returndata 到底怎么分工？","priority":"P0","category":"ethereum","tags":["Storage","Gas"],"answer":"**参考答案：** EVM 以 256-bit word 为基本运算单位，栈最多 1024 层；`PUSH`/`DUP`/`SWAP` 等围绕栈工作，表达式求值和指令参数通常经过栈。`Memory` 是当前执行调用帧的可扩展字节数组，调用帧退出即释放，扩大内存有递增的 Gas 成本；它不是数据库，也不是每 32 字节都持久落盘。\n\n`Storage` 是账户永久状态，访问依赖状态树/存储树及 Gas 规则。`Calldata` 是当前调用输入数据，通常是只读的；`Returndata` 是外部调用返回的字节序列，需显式处理成功标志、返回长度与 ABI 解码。`LOG0～LOG4` 发出的日志进入交易收据，智能合约不能在链上通过任意历史日志直接读取它们。\n\n同一个交易可包含多个调用帧，每个帧有自己的栈、memory、calldata 和 returndata 上下文；在 `delegatecall` 下会共享调用者账户的**persistent storage 语义**，但不等于两个帧的 memory 共享。`transient storage` 是另一种事务级临时存储，后题单独说明。\n\n**追问：** 为什么 solidity `memory` 数组和 `storage` 数组 GAS 相差很大？前者主要涉及扩展内存及操作，后者触及全局共识状态并需要复杂的冷热访问、净计量与持久化承诺更新。","diagram":"evm","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E15","title":"EIP-1559 的实际成交价格和费用如何计算？`maxFeePerGas` 是否会被全额扣掉？","priority":"P0","category":"ethereum","tags":["Gas","EIP","交易处理"],"answer":"**参考答案：** 对普通 Type-2 交易，在该块 `baseFeePerGas <= maxFeePerGas` 且其他约束满足时：\n\n```text\npriorityFeePaid = min(maxPriorityFeePerGas, maxFeePerGas - baseFeePerGas)\neffectiveGasPrice = baseFeePerGas + priorityFeePaid\nexecutionFee = gasUsed * effectiveGasPrice\n```\n\n协议销毁 `baseFeePerGas * gasUsed`，执行区块的费用接收者获得相应的优先费部分。`gasLimit` 是允许使用的最大执行 Gas 数量，不能直接当成实际 `gasUsed`；`maxFeePerGas` 是单位 Gas 价格的上限，**不是每单位都必然扣满**。提交前账户还必须满足相应费用能力检查，执行后未使用部分按协议结算。\n\n举例：`gasLimit=100000`、`gasUsed=52000`、`baseFee=25 Gwei`、`maxPriority=3 Gwei`、`maxFee=40 Gwei`。有效 Gas 单价为 `28 Gwei`，执行费用 `52,000 * 28 Gwei = 0.001456 ETH`；其中 `0.0013 ETH` 是 Base Fee 销毁，`0.000156 ETH` 是优先费。如果是 Blob 交易，**另有 Blob Gas 费用**，不能用上述单一公式涵盖全部成本。\n\n**追问：** `maxPriority=10`、`maxFee=30`、`baseFee=25`，Tip 是多少？`min(10,30-25)=5 Gwei`。这里体现优先费上限与总费用上限同时生效。","diagram":"gas","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E16","title":"为什么同一交易里两次 `SLOAD` 的 Gas 不一样？`SSTORE` 能否固定记一个价格？","priority":"P0","category":"ethereum","tags":["Gas","EIP","交易处理","事务"],"answer":"**参考答案：** EIP-2929 在交易执行上下文跟踪已访问的账户与存储键（warm/cold）。对此前未访问的存储槽，典型 `SLOAD` 冷访问成本是 **2100 Gas**；再次读取同一个已热的槽，典型暖读成本是 **100 Gas**。对外部账户首次访问也可能承担冷账户访问费用，不能把所有 `CALL` 都记同一个固定数。\n\n`SSTORE` 更复杂：花费取决于 slot 原始值、当前值、新值是否从零变非零、是否清零、是否在同一事务内反复改写，以及冷访问附加成本和 Gas refund 规则。退款规则经历过多次协议升级（例如 EIP-3529），不能仅背“写入 20000，清零退 15000”作为当前通用答案。\n\n部署与 Gas 优化应综合评估实际交易访问集（Access List 可能预热部分访问）、编译器生成操作、内存扩展、Event、动态编码及 L2 额外费用，使用 fork 测试基准而不是固化某一历史 Gas 表。\n\n**追问：** 只执行一次 `SLOAD`，冷成本为何通常比暖成本高？首次访问涉及更高的状态访问资源假设与协议定价；暖访问集合在一笔交易内共享，不是每个 Solidity 函数重新初始化。","diagram":"gas","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E17","title":"`CALL` / `DELEGATECALL` / `STATICCALL` 的 `msg.sender`、`msg.value` 和 Storage 上下文怎么变？","priority":"P0","category":"ethereum","tags":["Storage"],"answer":"**参考答案：** \n\n| Opcode | 执行谁的代码 | 使用谁的 Storage | `msg.sender` | `msg.value` | 典型用途 |\n|---|---|---|---|---|---|\n| `CALL` | 被调合约 | 被调合约 | 调用方合约 | 本次 CALL 携带的 value | 跨合约交互、转 ETH |\n| `DELEGATECALL` | 被调合约 | 发起 delegatecall 的账户 | **保留当前调用帧的 sender** | **保留当前调用帧的 value** | 代理、模块库 |\n| `STATICCALL` | 被调合约 | 被调合约，只读 | 调用方合约 | 0 | 只读跨合约调用 |\n\n`STATICCALL` 的只读限制会沿调用链传播；尝试执行状态写入、发日志或其他被禁止的状态改变操作会失败。`DELEGATECALL` 是代理升级安全的核心：实现合约代码解释代理的 Slot，因此布局错位或恶意实现可直接破坏代理资产状态。\n\n还要区分执行成功标志：底层 CALL 类 opcode 返回成功/失败，调用者若捕获错误并继续执行，顶层交易 receipt 仍可能 `status=1`。不能只凭“receipt 成功”就推断内部 ERC-20 转账或目标合约调用成功，必须分析业务调用的返回与事件。\n\n**追问：** 合约 A `delegatecall` 合约 B，B 中读 `address(this)` 是谁？是 A 的地址；但执行的指令来自 B 的代码。这正是代理将逻辑与状态分离的机制。","diagram":"proxy","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E18","title":"`REVERT`、Out-of-Gas、顶层交易失败、内部调用失败各会如何影响状态与 Event？","priority":"P0","category":"ethereum","tags":["Nonce","Gas","交易处理"],"answer":"**参考答案：** EVM 的调用帧具有可回滚的状态快照/变更日志（可用 journal 来理解）。某个帧失败时，该帧与其子调用中尚未保留的状态变化、日志等按照调用语义回滚；当失败向上传播至顶层且未被捕获时，该笔交易的执行状态变化整体回滚，但**Gas 消耗仍需要结算，交易 nonce/交易费等协议级效果仍存在**。\n\n`REVERT` 与异常性失败（如 Out-of-Gas）不同：`REVERT` 能返回错误数据且未用完的部分 Gas 可以返还给调用者；Out-of-Gas 通常消耗当前失败帧分配的剩余 Gas。调用者若正确处理低级调用的失败，可以让整个顶层交易继续并成功，但失败的子调用所产生的 Event 不会“复活”。\n\n一个极常见误区是“交易 Revert 就什么也没发生”：业务存储写入会回滚，但交易已经上链、使用了 Gas，并产生 `status=0` 收据；链外监听器也可能见过 pending 信号，但不能因此记账。\n\n**追问：** 如果交易回执 `status=1`，却没有预期 `Transfer` Event，意味着什么？可能业务分支跳过、Token 行为不标准、调用失败被捕获、日志过滤条件错误，或对合约实现的假设不成立；不能根据 status 直接补造业务事件。","diagram":"evm","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E19","title":"`CREATE`、`CREATE2` 的合约地址如何推导？“预计算地址”有哪些安全边界？","priority":"P0","category":"ethereum","tags":["Nonce","安全"],"answer":"**参考答案：** 传统 `CREATE` 地址取 `keccak256(RLP([deployer, deployerNonce]))` 的**最后 20 字节**。`CREATE2` 则取 `keccak256(0xff || deployer20 || salt32 || keccak256(init_code))` 的最后 20 字节。注意这里哈希的是**部署时的 init_code**（含构造参数/初始化代码），不是部署后的 runtime bytecode；地址也不直接取决于实际部署时区块高度。\n\n`CREATE2` 适合 Counterfactual Account、固定钱包地址、工厂和部署前收款等场景，但需要保护 Factory 的授权、Init Code、初始化阶段安全与地址碰撞/已存在合约冲突。相同部署者、salt、init_code 对应相同的**候选地址**，不等于可以无条件覆盖已经占用的合约地址。\n\n**追问：** `CREATE2 + SELFDESTRUCT` 是否还能把合约销毁后在后续交易以相同地址随意重部署？在 EIP-6780 生效后的以太坊主网，普通旧合约的 `SELFDESTRUCT` 不再删除其代码和存储，这种跨交易“变形合约”假设失效。要结合例外的同交易创建/销毁语义判断。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E20","title":"`SELFDESTRUCT` 的语义变更为什么会影响审计和 CREATE2 设计？","priority":"P1","category":"ethereum","tags":["EIP","交易处理","安全"],"answer":"**参考答案：** 旧时代教程常说 `SELFDESTRUCT` 删除合约代码与存储并转移余额。EIP-6780 在 Cancun 等相应规则激活后改变了这一语义：如果不是**合约创建的同一笔交易**中执行它，通常只执行转移该账户全部 ETH 余额与终止当前执行帧，**不删除代码、存储或账户本身**；创建同交易内的场景保留特殊删除行为。\n\n这意味着许多“通过销毁再部署实现升级”的历史模式在现代以太坊主网不能按旧逻辑工作；反过来，认为一个合约永远不可能接收 ETH 也不安全，因为向某地址转入 ETH 的协议路径和强制转入等边界会打破简单余额断言。`SELFDESTRUCT` 已被废弃，不适合作为现代合约正常生命周期或权限设计基础。\n\n**追问：** 编译器版本是 Solidity 0.8.x，所以 `SELFDESTRUCT` 语义一定如何？不对。它主要是**目标链执行规则/分叉高度**决定的协议行为，不是仅靠源码版本决定。","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E21","title":"以太坊交易签名如何防重放？`v,r,s`、chainId、EIP-2718 和 EIP-712 有何关系？","priority":"P0","category":"ethereum","tags":["Nonce","EIP","交易处理"],"answer":"**参考答案：** 普通外部账户交易依赖 secp256k1 ECDSA 签名，交易哈希用于标识规范编码的已签名交易。Legacy 交易在 EIP-155 后通过链 ID 进入签名域并反映在恢复参数中防止简单跨链重放；Typed Transaction 则按类型定义签名预映像，通常将 `chainId`、交易类型、nonce 和关键交易字段绑定在一起。\n\n`v`（或 typed tx 的 `yParity`）用于公钥恢复的相关信息；`r,s` 是 ECDSA 签名组成部分。签名要符合协议关于低 `s` 等规则。`ecrecover` 恢复地址不等于检查“这个签名肯定授权此业务”：合约仍须验证签名域、目标合约/用途、Chain ID、Nonce、过期时间和权限；EIP-712 是结构化消息签名域的编码规范，**不是一条普通链上交易的序列化格式**。\n\n**追问：** 钱包签名一个 `Permit`，可否在另一个 Token 合约重放？正确实现应将 Token 合约地址、Chain ID、nonce、owner/spender、额度和期限等域绑定；域实现错误、链分叉和代理升级仍可能导致特殊重放风险。","diagram":"signature","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E22","title":"EIP-1153 的 `TLOAD/TSTORE` 和普通 Storage、Memory 有什么不同？","priority":"P1","category":"ethereum","tags":["Storage","Trie","EIP","交易处理"],"answer":"**参考答案：** `TLOAD/TSTORE` 访问的是**事务级 Transient Storage**：在同一笔交易内部的调用帧间以账户语义共享，事务结束后丢弃；不会像普通 Storage 那样持久进入全局状态 Trie，也不是每个调用帧独立的 Memory。它适合 Reentrancy Guard 的临时标记、一次交易内的协调状态等。\n\nTransient Storage 按调用帧遵循回滚规则：子调用 Revert 时该帧内的相关 TSTORE 更改一并撤销；`DELEGATECALL` 的 owning contract 语义与持久 Storage 类似。`STATICCALL` 只读限制同样适用于 `TSTORE`。不能误认为“它不持久所以外部调用无论如何都不会看见”。\n\n它的 Gas 定价与普通冷暖 `SSTORE` 机制不同，但使用者更应先保证**在同交易不同入口/调用帧之间的安全不变式**；Reentrancy Guard 如果对复杂调用流程有重入路径，换成 transient 变量也不能自动修复逻辑漏洞。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E23","title":"执行区块头除了三棵树的根还有什么？为什么不能再说“区块头只有三个 Root”？","priority":"P0","category":"ethereum","tags":["Gas","交易处理"],"answer":"**参考答案：** 典型执行区块头包含 `parentHash`、`stateRoot`、`transactionsRoot`、`receiptsRoot`、`logsBloom`、`number`、`timestamp`、`gasLimit`、`gasUsed`、`baseFeePerGas`、`feeRecipient`、`prevRandao` 等字段，实际字段依协议分叉阶段发生变化。`parentHash` 链接父区块，`stateRoot` 承诺状态转换结果，交易/收据根承诺执行输入和输出，`logsBloom` 用于日志过滤快速排除。\n\n上海升级之后执行区块头有 `withdrawalsRoot`（证明验证者提款列表）；后续升级又引入 Blob 相关的 `blobGasUsed`、`excessBlobGas` 等，以及 `requestsHash` 等字段。它们是新数据的承诺或协议参数，但不会把经典三棵 MPT 的概念完全推翻。\n\n**区块哈希**一般指执行区块头按共识规定字段和规范顺序序列化后求 Keccak-256。客户端会依分叉高度选择正确结构，不能将某个历史固定 Header struct 用于所有年份。PoS Beacon Block 自身还有共识层结构与根，和执行块头哈希不是同一个对象。\n\n**追问：** 交易/收据树没有 `withdrawals` 记录，验证者提款是否影响余额？会。提款属于协议级状态变化，执行状态根要反映余额变化，不能仅执行 Transaction Trie 中的普通用户交易后就宣称完整复算了区块。","diagram":"trie","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E24","title":"以太坊合并后的 Execution Layer 和 Consensus Layer 如何协作？MPT 与 SSZ 有什么关系？","priority":"P0","category":"ethereum","tags":["MPT","交易处理"],"answer":"**参考答案：** 执行客户端（如 Geth/Nethermind/Besu 等）处理 EVM 交易、账户状态、收据和执行有效性；共识客户端处理 Beacon Chain、验证者、投票、分叉选择与最终性。共识客户端通过 Engine API 等接口与执行客户端协作，提议区块时生成执行 Payload，验证新区块时请求执行客户端检查并执行该 Payload。\n\n以太坊执行层传统状态、交易与收据承诺通常基于 RLP/MPT；共识层使用 SSZ（Simple Serialize）及 SSZ Merkleization 来组织和承诺 Beacon 状态与区块。**MPT Proof 证明执行层账户/收据在给定执行根下的关系，SSZ/共识证明用于锚定相应的共识对象。** 它们并非一个通用“Merkle Proof 接口”互相替代。\n\n一个节点声称自己验证了链，应该能说明它验证的是哪个层次：只执行 `eth_getProof` 并未验证 PoS 共识；只跟随 Beacon Head 也不代表用户已经验过每个 EVM Storage Slot。\n\n**追问：** `stateRoot` 是 Beacon State Root 吗？不是。前者是执行层账户状态承诺；后者对应共识层 Beacon State 的 SSZ Merkle 根，两者的结构和含义不同。","diagram":"l2","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E25","title":"Slot、Epoch、区块、验证者分别是什么？12 秒是否必有一个区块？","priority":"P0","category":"ethereum","tags":["Finality"],"answer":"**参考答案：** 以太坊 PoS 的基本时隙（slot）为 12 秒，每个 Epoch 包含 32 个 Slot。每个 Slot 可以指派一个区块提议者，并有验证者委员会作出证明（attestation），但**某个时隙可能因为提议者离线、传播或共识问题没有形成规范区块**。因此不能用“每 12 秒必出一个块”设计严格定时结算。\n\nAttestation 承载验证者对链头与检查点等对象的投票信息，所贡献的权益权重用于选链和 Finality；验证者的有效质押权重及奖励/惩罚由共识规则管理。出块提议与执行正确性验证是两个不同职责。\n\n**追问：** `block.number` 和 `slot` 能简单相互换算吗？不能。出现空 Slot 时，Slot 编号仍前进，但没有对应的执行区块。以区块高度推估时间或确认数需要理解该差异。","diagram":"l2","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E26","title":"LMD-GHOST、Casper FFG 与 Gasper 是怎样组合的？","priority":"P0","category":"ethereum","tags":["Gas"],"answer":"**参考答案：** **LMD-GHOST** 负责针对可能竞争的分叉确定当前更适合扩展的链头，依赖验证者近期 attestation 的有效权重；**Casper FFG** 负责在 Epoch 检查点之间通过质押权重投票形成 `justified` / `finalized` 的经济最终性。二者组合常被称为 **Gasper**。\n\n二者作用不重合：LMD-GHOST 解决“当前头部竞争时该沿哪条链继续”，并不保证任何最近块立刻不可撤销；FFG 解决达到足够投票权重后的不可逆性保障，但最终性不是每 12 秒对每个区块独立投一轮票。\n\nFinality 的安全性基于拜占庭容错与罚没经济机制：要出现互相冲突的最终确定链通常需要重大共识违约和可罚没权益；但严重离线、网络故障可能首先造成**无法继续 finalization（活性问题）**，不等同于历史已 finalized 区块立即丧失安全性。\n\n**追问：** 一个新区块获得很多 attestation，是否立即等同 `finalized`？不等同；须满足协议关于检查点链接和投票权重的特定条件。","diagram":"l2","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E27","title":"`latest`、`safe`、`finalized` 三种 RPC 标签到底有何不同？","priority":"P0","category":"ethereum","tags":["Reorg","Finality","安全","链上"],"answer":"**参考答案：** `latest` 指节点当前看到的最新规范执行链头，容易受到短期 Reorg 的影响；`safe` 是共识客户端认为安全性较高、被重组风险很低的头；`finalized` 表示在该共识协议规则下已获得 Finality 的最深相应状态点。它们是**链状态/共识风险级别**，不是三种不同的普通区块格式。\n\n工程中应显式定义充值状态：`observed`（初见日志）→ `canonical`（当前规范链上）→ `safe` → `finalized` / 可结算；实际业务可能根据金额、风控和可用性设置不同准入条件。并非所有 EVM 兼容链或 RPC 都支持相同语义，尤其不能把以太坊主网标签的信任模型生搬硬套到私链或 L2。\n\n更高级的细节：**`safe` 不等于数学绝对不可回滚，`finalized` 也不等于不存在软件共识 bug 或社会层干预的可能性**。产品承诺应与可接受损失、应急熔断、资产限制和链的安全模型相匹配。\n\n**追问：** 区块已经有 64 个确认，和 RPC 显示 `finalized` 哪个更可靠？在 Ethereum PoS 主网中优先理解并利用协议最终性，而不是用固定确认数替代 Finality；64 confirmations 不天然等于已达 FFG finalized。","diagram":"reorg","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E28","title":"以太坊轻客户端如何信任区块头？什么是 Weak Subjectivity？","priority":"P1","category":"ethereum","tags":["Proof","交易处理","RPC"],"answer":"**参考答案：** 轻客户端的目标是避免维护全量执行状态或完整重演所有历史交易，而使用经过验证的共识数据、同步委员会相关签名/证明及状态/收据 Merkle Proof 来检验关心的数据。其验证能力取决于具体实现：某些钱包仅依赖 RPC，不能因为名字叫“light”就声称它独立验证了 PoS。\n\nPoS 面临长期离线客户端重新加入时的**长期历史/长程攻击（long-range attacks）**挑战；Weak Subjectivity 指在特定时间窗内需要从可信渠道获得足够新的共识检查点，以避免仅凭非常古老的密钥历史被误导。之后才能沿协议规则持续验证新的共识更新。\n\n完整证明链通常包含：可信弱主观性锚点 → 已验证共识头 → 执行 Payload/块头承诺 → `stateRoot` 或 `receiptsRoot` → 账户/存储/收据的 MPT Proof。只拿到最末端的 Proof JSON 并未完成整条验证链。\n\n**追问：** 通过 RPC 拿到有效 Merkle Proof，是否解决了中心化 RPC 的单点信任？它能降低对“具体值是否被篡改”的信任，但前提是根已由独立机制验证；数据可用性、服务可用性和抗审查仍是另外的问题。\n\n---","diagram":"","source":"原始题库","createdAt":"2026-10-13","updatedAt":"2026-10-13"},{"id":"E29","title":"Pending Pool 是全网一致的吗？同 Nonce 替换交易为什么有时一个节点认为成功另一个拒绝？","priority":"P0","category":"ethereum","tags":["Nonce","交易处理"],"answer":"**参考答案：** Pending Pool（mempool/txpool）是各节点本地维护和传播的候选交易集合，不是一个经过共识复制的全网数据库。不同节点因为交易传播路径、私有交易渠道、淘汰策略、客户端实现、容量和替换策略不同，**看到的 pending 交易可能不一致**。\n\n同地址普通交易按 nonce 顺序上链；
